<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Card Board</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect x='2' y='6' width='13' height='19' rx='2' fill='%23333'/><rect x='17' y='6' width='13' height='19' rx='2' fill='%23e8c547'/></svg>">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans+Condensed:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap">
<link rel="stylesheet" href="/static/tokens.css"><link rel="stylesheet" href="/static/game.css"><link rel="stylesheet" href="/static/mana.css">
<style>
/* layout: the Card Board — a fixed toolbar over an endless table you pan and zoom; piles are labelled patches on it */
:root {
  --table:#e6e4df; --bar:#fafaf8; --barline:#d6d3cc; --btn:#fff; --btnline:#cfccc5; --btnhover:#f1f0ec;
  --ink:#222; --muted:#6d6a64; --pile:rgba(255,255,255,.55); --pile-line:#c4c1ba; --hot:#2f7de1; --danger:#d93025;
  --card:#fbfaf7; --cardline:#d6d1c5; --gem:#2f6fb0; --atk:#b98a1c; --hp:#b4372f;
  --r-F:#b9b6ae; --r-C:#9a978f; --r-R:#2f7fd6; --r-E:#8b46c9; --r-L:#e08a12;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --table:#232321; --bar:#1b1b1a; --barline:#383735; --btn:#2a2a28; --btnline:#45443f; --btnhover:#34332f;
  --ink:#ebe8e1; --muted:#9c978c; --pile:rgba(255,255,255,.04); --pile-line:#55534d; --hot:#4a90e8;
  --card:#2e2d2a; --cardline:#45433e; --gem:#4f8fd0; --atk:#d6a63a; --hp:#d4564d; color-scheme:dark } }
:root[data-theme="dark"] {
  --table:#232321; --bar:#1b1b1a; --barline:#383735; --btn:#2a2a28; --btnline:#45443f; --btnhover:#34332f;
  --ink:#ebe8e1; --muted:#9c978c; --pile:rgba(255,255,255,.04); --pile-line:#55534d; --hot:#4a90e8;
  --card:#2e2d2a; --cardline:#45433e; --gem:#4f8fd0; --atk:#d6a63a; --hp:#d4564d; color-scheme:dark }
* { box-sizing:border-box; }
html, body { height:100%; }
body { background:var(--table); color:var(--ink); font:14px/1.3 system-ui,-apple-system,"Segoe UI",sans-serif; overflow:hidden; user-select:none; -webkit-user-select:none; }
.top { position:fixed; left:0; right:0; top:env(safe-area-inset-top,0px); height:44px; z-index:10; display:flex; align-items:center; gap:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px)); background:var(--bar); border-bottom:1px solid var(--barline); }
body::before { content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:11; background:var(--bar); }
.top button { border:1px solid var(--btnline); background:var(--btn); border-radius:5px; padding:5px 11px; font:500 13px system-ui,sans-serif; color:var(--ink); cursor:pointer; white-space:nowrap; }
.top button:hover { background:var(--btnhover); }
.top button:disabled { opacity:.4; cursor:default; }
.top input { width:220px; min-width:80px; flex:0 1 220px; border:1px solid var(--btnline); background:var(--btn); color:var(--ink); border-radius:5px; padding:5px 9px; font:13px system-ui,sans-serif; }
.top .sp { flex:1; }
.top .count { color:var(--muted); font-variant-numeric:tabular-nums; white-space:nowrap; }
button:focus-visible, input:focus-visible { outline:2px solid var(--hot); outline-offset:2px; }
#view { position:fixed; left:0; right:0; top:calc(44px + env(safe-area-inset-top,0px)); bottom:0; overflow:hidden; touch-action:none; }
#view.panning { cursor:grabbing; }
#world { position:absolute; left:0; top:0; transform-origin:0 0; }

/* a card: the game's own (static/mana.js manaCard), in a box as big as its outline */
.it { position:absolute; left:0; top:0; z-index:2; width:var(--cw); height:var(--ch); }
.it .mcard { position:absolute; left:var(--ox); top:var(--oy); }
.it.sel::after { content:""; position:absolute; inset:-4px; border:6px solid var(--hot); border-radius:14px; pointer-events:none; z-index:5; }
.it.dim { opacity:.18; }
.it.drag { z-index:50; }
.it.hidden { display:none; }
.it:hover { z-index:8; }
.bin { position:absolute; top:22%; right:6px; z-index:6; width:34px; height:34px; padding:0; border:0; border-radius:8px; display:none; place-items:center;
  background:rgba(20,20,18,.72); color:#fff; cursor:pointer; }
.it:hover .bin { display:grid; }
.it.drag .bin { display:none; }
.bin:hover { background:var(--danger); }
.bin svg { width:19px; height:19px; }

.pile { position:absolute; left:0; top:0; z-index:1; background:var(--pile); border:2px dashed var(--pile-line); border-radius:14px; }
.pile.hot { border-color:var(--hot); border-style:solid; }
.pile.sel { outline:6px solid var(--hot); outline-offset:4px; }
/* the header's text keeps a readable screen size at any zoom */
.pile .ph { --s:min(1, calc(1 / 3.6 / var(--z, 1))); position:absolute; left:0; right:0; top:0; height:92px; display:flex; align-items:center; gap:calc(40px * var(--s)); padding:0 16px; cursor:grab; }
.pile .nm { font:700 calc(60px * var(--s))/1.1 system-ui,sans-serif; outline:none; white-space:nowrap; flex:none; min-width:20px; cursor:text; }
.pile .ct { font:400 calc(54px * var(--s))/1.1 system-ui,sans-serif; color:var(--muted); flex:none; }
.pile .nm[contenteditable="true"] { background:var(--btn); padding:2px 4px; border-radius:4px; }
.pile .ph .gap { flex:1; }
.pile .ph button { font:500 calc(46px * var(--s))/1.2 system-ui,sans-serif; border:1px solid var(--pile-line); background:var(--btn); border-radius:calc(12px * var(--s));
  padding:calc(6px * var(--s)) calc(22px * var(--s)); color:var(--ink); cursor:pointer; visibility:hidden; flex:none; display:inline-flex; align-items:center; }
.pile .ph button:hover { background:var(--btnhover); }
.pile .ph:hover button, .pile .ph.open button { visibility:visible; }
.pile .ph button svg { width:1.15em; height:1.15em; }
.pile .pal { display:none; gap:calc(12px * var(--s)); align-items:center; }
.pile .ph.open .pal { display:flex; }
.pile .pal button { width:1.6em; height:1.6em; padding:0; border-radius:50%; }
.pile .rs { position:absolute; right:-8px; top:92px; bottom:0; width:16px; cursor:ew-resize; }
.pile.stacked .rs { display:none; }
.pile .ghost { position:absolute; width:var(--cw); height:var(--ch); border-radius:22px; background:var(--cardline); box-shadow:0 0 0 2px var(--table); }
.ins { position:absolute; z-index:40; width:8px; height:var(--ch); background:var(--hot); border-radius:4px; display:none; }
.marq { position:fixed; z-index:20; border:1px solid var(--hot); background:rgba(47,125,225,.12); display:none; pointer-events:none; }
#peek { position:fixed; z-index:30; pointer-events:none; display:none; }
#peek .mcard { position:absolute; }
#sync { color:var(--danger); }
.it .pwcard { margin:0; }
#peek .rc:not(.notext) { --open:1; }   /* the square board's card, peeked, is read: its rules up */
#ed { position:fixed; z-index:35; width:300px; display:grid; grid-template-columns:1fr 1fr; gap:10px; padding:12px; background:var(--bar); color:var(--ink);
  border:1px solid var(--barline); border-radius:8px; box-shadow:0 8px 28px rgba(0,0,0,.3); font:13px system-ui,sans-serif; }
#ed[hidden] { display:none; }
#ed h4 { grid-column:1 / -1; margin:0; font:600 15px system-ui,sans-serif; }
#ed label { display:grid; gap:4px; color:var(--muted); }
#ed label.tx { grid-column:1 / -1; }
#ed input, #ed textarea { width:100%; min-width:0; font:15px system-ui,sans-serif; color:var(--ink); background:var(--btn); border:1px solid var(--btnline); border-radius:5px; padding:5px 8px; resize:vertical; }
#toast { position:fixed; z-index:60; left:50%; bottom:20px; transform:translateX(-50%); background:var(--danger); color:#fff; padding:6px 14px; border-radius:6px; max-width:80vw; }
</style></head><body>

<div class="top">
  <button id="newpile" type="button">+ New pile</button>
  <input id="q" type="search" placeholder="Find a card" aria-label="Find a card">
  <button id="fit" type="button">Fit</button>
  <button id="snap" type="button" title="Line up the picked cards on the table into a grid">Snap to grid</button>
  <span class="sp"></span>
  <span id="sync"></span>
  <span class="count" id="count"></span>
  <button id="restore" type="button">Restore removed</button>
  <button id="reset" type="button">Reset</button>
</div>
<div id="view"><div id="world"><div class="ins" id="ins"></div></div></div>
<div class="marq" id="marq"></div>
<div id="peek"></div>
<div id="ed" hidden><h4></h4>
  <label>Mana <input type="number" min="0" data-col="cost"></label>
  <label>Strength <input type="number" min="0" data-col="strength"></label>
  <label class="tx">Text <textarea rows="4" data-col="effect"></textarea></label>
</div>
<div id="toast" hidden></div>

<script>
let manaCard, fitPlaques, powerCard;   // the game's card (static/mana.js), loaded at the start
const PW = 150;   // the card's piece width; the card itself is a fifth wider
let W = 185, H = 300;
const G = 14, PAD = 16, HEAD = 92, CAMKEY = 'card-board-cam';
const $ = s => document.querySelector(s);
const TINT = { none:'', red:'#f6d6d1', orange:'#f9e1c6', yellow:'#f5ecb7', green:'#d7ebcf', blue:'#d4e3f5', purple:'#e4d9f2', grey:'#d9d7d2' };
const svg = b => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${b}</svg>`;
const ICON = {
  stack: svg('<rect x="7" y="3" width="12" height="15" rx="2"/><path d="M5 6v13a2 2 0 0 0 2 2h9"/>'),
  spread: svg('<rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="9" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>'),
  tint: svg('<circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 0 0 16z" fill="currentColor"/>'),
  bin: svg('<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>'),
};
const esc = t => String(t ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
let DATA = [], CARDS = {}, stampSeen = 0;
// The table's order: by cost, then rarity, then name.
const RORD = { legendary: 0, rare: 1, common: 2 };
// A leader's power is an item of its own, right after its leader's card.
function setData(list, powers = []) {
  const sorted = [...list].sort((a, b) => a.mana - b.mana || (RORD[a.rarity] ?? 3) - (RORD[b.rarity] ?? 3) || a.name.localeCompare(b.name));
  const pw = Object.fromEntries(powers.map(L => [L.id, { ...L, id: 'power:' + L.id, leader: L.id, power: true, name: L.kind === 'power' ? 'Hero power' : 'Passive' }]));
  DATA = sorted.flatMap(c => pw[c.id] ? [c, pw[c.id]] : [c]);
  CARDS = Object.fromEntries(DATA.map(c => [c.id, c]));
}
const ids = () => DATA.map(c => c.id);
const view = $('#view'), world = $('#world');
let B, cam = { x: 40, y: 30, z: 0.3 };
let sel = new Set(), psel = new Set(), undo = [], redo = [];
const els = {}, pileEls = {};

// ---------- the arrangement ----------
// A pile holds rows of cards (p.rows), each as long as he likes; p.cols is the pile's least width. While cards are dragged
// over a pile it grows one spare column and one spare row, so a card can start a new row or lengthen the longest one.
const flat = p => p.rows.flat();
const pileOf = id => B.piles.find(p => p.rows.some(r => r.includes(id)));
let overPile = null;
const pileSize = p => {
  if (p.stacked) return { w: PAD * 2 + 2 * W + G, h: HEAD + H + PAD + 12 };
  const spare = overPile === p.id ? 1 : 0;
  const cols = Math.max(p.cols, ...p.rows.map(r => r.length + spare)), rows = Math.max(1, p.rows.length + spare);
  return { w: PAD * 2 + cols * W + (cols - 1) * G, h: HEAD + rows * H + (rows - 1) * G + PAD };
};
const slotRC = (p, r, c) => ({ x: p.x + PAD + c * (W + G), y: p.y + HEAD + r * (H + G) });
function slot(p, id) {
  if (p.stacked) return { x: p.x + PAD, y: p.y + HEAD + 12 };
  const r = p.rows.findIndex(row => row.includes(id));
  return slotRC(p, r, p.rows[r].indexOf(id));
}
const posOf = id => { const p = pileOf(id); return p ? slot(p, id) : B.cards[id]; };
// rows from cards lying loose: those whose tops are within half a card of each other share a row, left to right
function rowsOf(ids) {
  const pts = ids.map(id => ({ id, ...posOf(id) })).sort((a, b) => a.y - b.y), rows = [];
  for (const q of pts) { const r = rows[rows.length - 1]; if (r && q.y - r[0].y < H / 2) r.push(q); else rows.push([q]); }
  return rows.map(r => r.sort((a, b) => a.x - b.x).map(q => q.id));
}
const gone = id => B.gone.includes(id);

// the column count that makes n cards a block closest to 4:3 landscape
function cols43(n) {
  let cols = 1, best = Infinity;
  for (let c = 1; c <= n; c++) { const d = Math.abs(Math.log((c * (W + G) - G) / (Math.ceil(n / c) * (H + G) - G) / (4 / 3))); if (d < best) { best = d; cols = c; } }
  return cols;
}
// Cards with no place yet (all of them at the start, a new card later) go under everything, a 4:3 block in the table's order.
function placeNew() {
  const homeless = ids().filter(id => !B.cards[id] && !pileOf(id) && !gone(id));
  if (!homeless.length) return false;
  const bs = [];
  for (const id of ids()) { const q = posOf(id); if (q && !gone(id) && !homeless.includes(id)) bs.push([q.x, q.y, W, H]); }
  for (const p of B.piles) { const s = pileSize(p); bs.push([p.x, p.y, s.w, s.h]); }
  const y = bs.length ? Math.max(...bs.map(([, y, , h]) => y + h + G * 6)) : 0, x = bs.length ? Math.min(...bs.map(b => b[0])) : 0;
  const cols = cols43(homeless.length);
  homeless.forEach((id, i) => B.cards[id] = { x: x + (i % cols) * (W + G), y: y + Math.floor(i / cols) * (H + G) });
  return true;
}

// ---------- drawing ----------
function setCam() { world.style.transform = `translate(${cam.x}px,${cam.y}px) scale(${cam.z})`; world.style.setProperty('--z', cam.z); try { localStorage.setItem(CAMKEY, JSON.stringify(cam)); } catch (e) {} }
const cardHTML = (c, w = PW) => c.power ? powerCard(c.leader, c, w) : manaCard(c, { cost: c.mana ?? null, w });
const sig = c => JSON.stringify(c);
function buildCard(c) {
  let el = els[c.id];
  if (!el) { el = els[c.id] = world.appendChild(document.createElement('div')); el.className = 'it'; el.dataset.id = c.id; }
  if (el.dataset.sig === sig(c)) return;
  el.dataset.sig = sig(c);
  el.innerHTML = cardHTML(c) + `<button class="bin" type="button" title="Remove from the table" aria-label="Remove ${esc(c.name)}">${ICON.bin}</button>`;
}
function buildCards() {
  for (const id of Object.keys(els)) if (!CARDS[id]) { els[id].remove(); delete els[id]; }
  DATA.forEach(buildCard);
  fitPlaques(world);
}
// the card's outline, measured once: the box a card takes on the table
function measure() {
  const probe = document.body.appendChild(document.createElement('div'));
  probe.style.cssText = 'position:absolute;left:0;top:0;visibility:hidden';
  probe.innerHTML = cardHTML({ id: '_', name: '', text: '', rarity: 'common', str: 1, mana: 1 });
  const m = probe.querySelector('.mcard').getBoundingClientRect(), p = (probe.querySelector('.plaque') || probe.querySelector('.mcard')).getBoundingClientRect();   // the square board's card is its own outline
  probe.remove();
  W = Math.round(p.width); H = Math.round(p.height);
  const st = document.documentElement.style;
  st.setProperty('--cw', W + 'px'); st.setProperty('--ch', H + 'px');
  st.setProperty('--ox', (m.left - p.left) + 'px'); st.setProperty('--oy', (m.top - p.top) + 'px');
}
function draw() {
  for (const id of Object.keys(pileEls)) if (!B.piles.find(p => p.id === id)) { pileEls[id].remove(); delete pileEls[id]; }
  for (const p of B.piles) {
    let el = pileEls[p.id];
    if (!el) {
      el = pileEls[p.id] = world.insertBefore(document.createElement('div'), world.firstChild);
      el.className = 'pile'; el.dataset.pile = p.id;
      el.innerHTML = `<div class="ph"><span class="nm"></span><span class="ct"></span><span class="gap"></span><span class="pal">${Object.entries(TINT).map(([k, c]) => `<button data-tint="${k}" title="${k}" style="background:${c || 'var(--btn)'}"></button>`).join('')}</span><button data-act="tint" title="Colour">${ICON.tint}</button><button data-act="stack"></button><button data-act="del" title="Remove the pile; its cards stay on the table">×</button></div><div class="rs"></div>`;
    }
    const s = pileSize(p);
    el.style.transform = `translate(${p.x}px,${p.y}px)`; el.style.width = s.w + 'px'; el.style.height = s.h + 'px';
    el.classList.toggle('stacked', !!p.stacked); el.classList.toggle('sel', psel.has(p.id));
    const nm = el.querySelector('.nm'); if (nm.getAttribute('contenteditable') !== 'true') nm.textContent = p.name;
    el.querySelector('.ct').textContent = flat(p).length;
    const sb = el.querySelector('[data-act="stack"]'); sb.innerHTML = p.stacked ? ICON.spread : ICON.stack; sb.title = p.stacked ? 'Spread out' : 'Stack up';
    el.style.background = TINT[p.tint] ? `color-mix(in srgb, ${TINT[p.tint]} 70%, transparent)` : '';
    el.querySelectorAll('.ghost').forEach(g => g.remove());
    if (p.stacked && flat(p).length > 1) for (const o of [2, 1].slice(0, flat(p).length - 1))
      el.insertAdjacentHTML('beforeend', `<div class="ghost" style="left:${PAD + o * 6 - 2}px;top:${HEAD + 12 - o * 6 + 2}px"></div>`);
  }
  for (const id of ids()) {
    const el = els[id], q = posOf(id), p = pileOf(id);
    el.style.display = gone(id) || !q ? 'none' : '';
    if (!q) continue;
    el.style.transform = `translate(${q.x}px,${q.y}px)`;
    el.classList.toggle('hidden', !!(p && p.stacked && flat(p)[0] !== id));
    el.classList.toggle('sel', sel.has(id));
  }
  const n = B.gone.length;
  $('#count').textContent = `${DATA.length - n} of ${DATA.length} cards`;
  $('#restore').disabled = !n; $('#restore').textContent = n ? `Restore removed (${n})` : 'Restore removed';
  $('#snap').disabled = [...sel].filter(id => B.cards[id]).length < 2;
  search();
}

// ---------- saving (tools/cards/board.json, through the card server) ----------
const snap = () => JSON.stringify(B);
let saveT = null;
function save() { clearTimeout(saveT); saveT = setTimeout(push, 300); }
async function push() {
  saveT = null;
  try { const r = await fetch('/api/board', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: snap() }); if (!r.ok) throw 0; offline(false); }
  catch (e) { offline(true); saveT = setTimeout(push, 3000); }
}
addEventListener('beforeunload', () => { if (saveT) { clearTimeout(saveT); navigator.sendBeacon('/api/board', new Blob([snap()], { type: 'application/json' })); } });
function changed(before) { undo.push(before); if (undo.length > 200) undo.shift(); redo = []; draw(); save(); }
function restore(s) { B = JSON.parse(s); tidy(); sel.clear(); psel.clear(); draw(); save(); }
const fresh = () => ({ cards: {}, piles: [], gone: [] });
// the layout keeps only cards the game still has; a card new to the game takes a place
function tidy() {
  B.cards ||= {}; B.piles ||= []; B.gone ||= [];
  for (const id of Object.keys(B.cards)) if (!CARDS[id]) delete B.cards[id];
  for (const p of B.piles) p.rows = p.rows.map(r => r.filter(id => CARDS[id])).filter(r => r.length);
  B.gone = B.gone.filter(id => CARDS[id]);
  return placeNew();
}
function offline(bad) { $('#sync').textContent = bad ? 'The card server is not running: ./cards' : ''; }
// cards changed through the card table or hq.py show up here within a few seconds
setInterval(async () => {
  if (!B || document.hidden || act) return;
  try {
    const { stamp } = await (await fetch('/api/stamp')).json(); offline(false);
    if (stamp === stampSeen) return;
    await refresh();
  } catch (e) { offline(true); }
}, 2500);
async function refresh() {
  const d = await (await fetch('/api/board')).json();
  stampSeen = d.stamp; setData(d.cards, d.powers); buildCards();
  const before = snap(); tidy(); if (snap() !== before) save();
  draw(); if (edId) fillEd();
}

// ---------- camera ----------
const toWorld = (cx, cy) => { const r = view.getBoundingClientRect(); return { x: (cx - r.left - cam.x) / cam.z, y: (cy - r.top - cam.y) / cam.z }; };
function zoomAt(cx, cy, f) {
  const r = view.getBoundingClientRect(), z = Math.min(2, Math.max(0.05, cam.z * f));
  const wx = (cx - r.left - cam.x) / cam.z, wy = (cy - r.top - cam.y) / cam.z;
  cam = { x: cx - r.left - wx * z, y: cy - r.top - wy * z, z }; setCam();
}
function fit() {
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  const add = (x, y, w, h) => { x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x + w); y1 = Math.max(y1, y + h); };
  for (const id of ids()) { const q = posOf(id); if (q && !gone(id)) add(q.x, q.y, W, H); }
  for (const p of B.piles) { const s = pileSize(p); add(p.x, p.y, s.w, s.h); }
  if (x0 === Infinity) return;
