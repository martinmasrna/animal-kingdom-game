<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Position analyser</title>
<style>
  :root { --line: #d0d4da; --head: #f2f4f7; --took: #e6f4ea; --bad: #b3261e; --good: #137333; --muted: #5f6368; --sel: #e8f0fe; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #202124; background: #fff; }
  header { display: flex; gap: 8px; align-items: center; padding: 6px 10px; border-bottom: 1px solid var(--line); background: var(--head); }
  header select { max-width: 520px; }
  header input { width: 56px; }
  main { display: flex; height: calc(100vh - 37px); }
  #left { flex: 0 0 58%; display: flex; flex-direction: column; border-right: 1px solid var(--line); }
  #board { flex: 1; border: 0; width: 100%; background: #c9a46a; }
  #framebar { display: flex; gap: 8px; align-items: center; padding: 6px 10px; border-top: 1px solid var(--line); min-height: 36px; background: var(--head); }
  #framebar .cap { flex: 1; }
  #right { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #moves { height: 170px; overflow: auto; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
  #moves div { padding: 1px 10px; cursor: pointer; white-space: nowrap; }
  #moves div.sub { color: var(--muted); }
  #moves div.at { background: var(--sel); font-weight: 600; }
  #moves div:hover { background: #f1f3f4; }
  #panel { flex: 1; overflow: auto; padding: 8px 10px 40px; }
  button { font: inherit; padding: 2px 8px; cursor: pointer; }
  table { border-collapse: collapse; width: 100%; margin: 6px 0 10px; }
  th, td { border: 1px solid var(--line); padding: 3px 6px; text-align: left; vertical-align: top; }
  th { background: var(--head); font-weight: 600; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  tr.took td { background: var(--took); }
  tr.click { cursor: pointer; }
  tr.click:hover td { background: #f1f3f4; }
  tr.open td { background: var(--sel); }
  .neg { color: var(--bad); } .pos { color: var(--good); }
  .muted { color: var(--muted); }
  .dec { margin: 4px 0 4px 18px; }
  .dec table { width: auto; min-width: 60%; }
  h3 { margin: 12px 0 2px; font-size: 13px; }
  a.x { cursor: pointer; color: #1a73e8; text-decoration: underline; white-space: nowrap; }
  .build select { margin: 2px 0; max-width: 100%; }
  .wait { color: var(--muted); font-style: italic; }
  .err { color: var(--bad); white-space: pre-wrap; }
</style>
</head>
<body>
<header>
  <select id="game"></select>
  <label>seed <input id="seed" type="number" value="0" min="0"></label>
  <button id="go">Analyse this position</button>
  <span id="status" class="muted"></span>
</header>
<main>
  <section id="left">
    <iframe id="board" src="/#/lab/mid"></iframe>
    <div id="framebar"><span class="cap" id="cap">The position</span></div>
  </section>
  <section id="right">
    <div id="moves"></div>
    <div id="panel"></div>
  </section>
</main>
<script>
const $ = id => document.getElementById(id);
const S = { games: [], g: null, moves: [], ply: 0, pos: null, search: null, frames: null, fi: 0, ver: 1000, _txt: {} };
const fmt = x => x == null ? '—' : `<span class="${x < 0 ? 'neg' : x > 0 ? 'pos' : ''}">${x.toFixed(1)}</span>`;
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const seatName = (g, p) => g.seats[p] === 'human' || !g.seats[p] ? 'you' : g.seats[p];
const key = () => ({ src: S.g.src, id: S.g.id, n: S.g.n, ply: S.ply });

async function api(path, body) {
  const r = await fetch(path, body ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) } : {});
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}

// ---- the board: the game's own client in a frame, fed views through its test hook
// Ready once the frame's own lab view has loaded (it fetches one at start, and would draw over anything fed before it).
function boardReady() {
  const w = $('board').contentWindow;
  return w && w.__ak && w.__ak.feed && w.__ak.cards && Object.keys(w.__ak.cards() || {}).length && w.__ak().V;
}
async function show(view, caption) {
  for (let i = 0; i < 150 && !boardReady(); i++) await new Promise(r => setTimeout(r, 100));
  if (!boardReady()) return;
  const v = JSON.parse(JSON.stringify(view)); v.version = S.ver++; v.game.history = []; v.analysed = v.version;
  const w = $('board').contentWindow;
  w.__ak.feed(v);
  $('cap').textContent = caption || view.label || '';
  for (let i = 0; i < 10; i++) {   // and make sure it stayed: nothing else may have replaced it
    await new Promise(r => setTimeout(r, 200));
    if (S.ver - 1 !== v.version) return;   // a newer frame has been shown since
    if ((w.__ak().V || {}).analysed !== v.version) w.__ak.feed(v);
  }
}
function framebar() {
  const fb = $('framebar');
  if (!S.frames) { fb.innerHTML = `<span class="cap" id="cap">${S.pos ? posCaption() : ''}</span>`; return; }
  fb.innerHTML = `<button id="fp">◀</button><span class="muted">${S.fi + 1} / ${S.frames.length}</span><button id="fn">▶</button>
    <span class="cap" id="cap"></span><button id="fx">Back to the position</button>`;
  $('fp').onclick = () => step(-1); $('fn').onclick = () => step(1);
  $('fx').onclick = () => { S.frames = null; framebar(); show(S.pos.view, posCaption()); };
  show(S.frames[S.fi]);
}
function step(d) { if (!S.frames) return; S.fi = Math.max(0, Math.min(S.frames.length - 1, S.fi + d)); framebar(); }
function posCaption() { return `Turn ${S.pos.turn} · ${seatName(S.g, S.pos.me)} to act (seat ${S.pos.me}, at the bottom) · food ${S.pos.food.A}–${S.pos.food.B}${S.pos.over ? ' · game over' : ''}`; }

// ---- games and moves
async function loadGames() {
  S.games = await api('/api/analyse/games');
  $('game').innerHTML = S.games.map((g, i) => {
    const when = new Date(g.when * 1000).toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
    const tag = g.running ? 'running' : `${g.winner ? 'won by ' + g.winner : ''} ${g.reason || ''}`;
    return `<option value="${i}">${when} · ${g.id.replace(/^web_\d+T\d+_/, '')} game ${g.game} · A ${g.seats.A} vs B ${g.seats.B} · ${g.moves} moves · ${tag}</option>`;
  }).join('');
}
async function pickGame(i, ply) {
  S.g = S.games[i]; $('game').value = i;
  S.moves = await api(`/api/analyse/moves?src=${S.g.src}&id=${encodeURIComponent(S.g.id)}&n=${S.g.n}`);
  await setPly(ply == null ? S.moves.length : ply);
}
function renderMoves() {
  $('moves').innerHTML = S.moves.map(m => `<div data-ply="${m.ply}" class="${m.top ? '' : 'sub'}${m.ply === S.ply ? ' at' : ''}">T${m.turn} ${m.actor} (${seatName(S.g, m.actor)}): ${esc(m.text)}</div>`).join('')
    + `<div data-ply="${S.moves.length}" class="${S.ply === S.moves.length ? 'at' : ''}">— now —</div>`;
  $('moves').querySelectorAll('div').forEach(el => el.onclick = () => setPly(+el.dataset.ply));
  const at = $('moves').querySelector('.at'); if (at) at.scrollIntoView({ block: 'nearest' });
}
async function setPly(ply) {
  S.ply = ply; S.search = null; S.frames = null;
  location.hash = `${S.g.src}/${S.g.id}/${S.g.n}/${ply}`;
  renderMoves();
  $('panel').innerHTML = `<p class="muted">The board shows the position right before the highlighted move, from the seat to act; the other hand is face up. "Analyse this position" runs the Expert's full search on it (about half a minute).</p>`;
  S.pos = await api(`/api/analyse/position?src=${S.g.src}&id=${encodeURIComponent(S.g.id)}&n=${S.g.n}&ply=${ply}`);
  framebar(); show(S.pos.view, posCaption());
  if (!S.pos.over) renderBuild();
}

// ---- the search
async function analyse() {
  const seed = +$('seed').value || 0;
  $('status').textContent = 'searching…'; $('go').disabled = true;
  try { S.search = await api('/api/analyse/search', { ...key(), seed }); renderSearch(); $('status').textContent = ''; }
  catch (e) { $('panel').innerHTML = `<p class="err">${esc(e.message)}</p>`; $('status').textContent = ''; }
  finally { $('go').disabled = false; }
}
function renderSearch() {
  const s = S.search, played = S.moves[S.ply];
  let h = `<h3>The Expert picks: ${esc(s.chosen_text)}</h3>
    <div class="muted">Seed ${$('seed').value}: the seed sets the five hands it imagines for the opponent. ${s.legal} legal actions, ${s.stats.root_candidates} first actions kept for the search, ${s.stats.deepened_roots || 0} looked at one round deeper. ${s.seconds} s.${s.outs ? ' Every deep line read as lost, so the scores were re-ranked by how many of 20 fresh hands each survives (+500 a hand).' : ''}${played && played.actor === s.me ? ` In the game it played: ${esc(played.text)}.` : ''}</div>
    <table><tr><th>Turn it planned (first action, then the rest)</th><th class="num" title="Mean over the five imagined hands, after the opponent's reply and one more round: what the pick is made on">Deep</th><th class="num" title="Mean over the five hands after the opponent's reply only: what decided which first actions went deeper">Reply</th><th></th></tr>`;
  s.roots.forEach((r, i) => {
    const took = JSON.stringify(r.first) === JSON.stringify(s.chosen);
    h += `<tr class="click${took ? ' took' : ''}" data-r="${i}"><td>${r.text.map(esc).join(' · ')}</td><td class="num">${fmt(r.deep)}</td><td class="num">${fmt(r.shallow)}</td><td><a class="x" data-ex="${i}">explain</a></td></tr>
      <tr class="dect" data-d="${i}" style="display:none"><td colspan="4">${renderDecisions(r, i)}</td></tr>`;
  });
  h += `</table><div id="explain"></div>`;
  $('panel').innerHTML = h + buildHtml();
  $('panel').querySelectorAll('tr.click').forEach(tr => tr.onclick = e => {
    if (e.target.dataset.ex != null) return;
    const d = $('panel').querySelector(`tr[data-d="${tr.dataset.r}"]`); const open = d.style.display === 'none';
    d.style.display = open ? '' : 'none'; tr.classList.toggle('open', open);
  });
  $('panel').querySelectorAll('a[data-ex]').forEach(a => a.onclick = e => { e.stopPropagation(); explain(s.roots[+a.dataset.ex].turn); });
  $('panel').querySelectorAll('a[data-opt]').forEach(a => a.onclick = e => { e.stopPropagation(); const [r, d, o] = a.dataset.opt.split('.').map(Number); explain(s.roots[r].decisions[d].options[o].turn); });
  wireBuild();
}
function renderDecisions(r, ri) {
  if (!r.decisions.length) return '<span class="muted">No further decisions in this turn.</span>';
  return r.decisions.map((d, di) => `<div class="dec"><b>Decision ${di + 1}</b> <span class="muted">${d.options[0].reply ? 'scored after the opponent\'s imagined reply, mean of five hands' : 'scored on the board at the end of this turn, no reply'}</span>
    <table><tr><th>Option</th><th class="num">Score</th><th></th></tr>${d.options.map((o, oi) => `<tr class="${o.took ? 'took' : ''}"><td>${esc(o.text.trim())}${o.took ? ' <span class="muted">(taken)</span>' : ''}</td><td class="num">${fmt(o.score)}</td><td><a class="x" data-opt="${ri}.${di}.${oi}">explain</a></td></tr>`).join('')}</table></div>`).join('');
}

// ---- one turn, hand by hand
async function explain(turn) {
  const box = $('explain') || $('panel'); box.innerHTML = '<p class="wait">Scoring this turn hand by hand…</p>'; box.scrollIntoView({ block: 'nearest' });
  try {
    const e = await api('/api/analyse/explain', { ...key(), seed: +$('seed').value || 0, turn });
    const mean = a => a.reduce((x, y) => x + y, 0) / a.length;
    let h = `<h3>${e.turn.map(esc).join(' · ')}</h3><div class="muted">The same five hands the search imagined at this seed. Board after the turn (in hand 1's deal): ${fmt(e.board)}. Click a hand to play its line on the board.</div>
      <table><tr><th>#</th><th>Hand it imagined for the opponent</th><th class="num">After reply</th><th class="num">Deep</th><th>Ends</th></tr>`;
    e.hands.forEach((x, i) => { h += `<tr class="click" data-h="${i}"><td>${i + 1}</td><td>${x.hand.map(esc).join(', ')}</td><td class="num">${fmt(x.shallow)}${x.penalty ? ` <span class="muted" title="wasted Roar">−${x.penalty}</span>` : ''}</td><td class="num">${fmt(x.deep)}</td><td>${esc(x.after_reply)}</td></tr>`; });
    h += `<tr><th></th><th>Mean (what the search compares)</th><th class="num">${fmt(mean(e.shallow))}</th><th class="num">${fmt(mean(e.deep))}</th><th></th></tr></table>`;
    box.innerHTML = h;
    box.querySelectorAll('tr[data-h]').forEach(tr => tr.onclick = () => {
      box.querySelectorAll('tr[data-h]').forEach(t => t.classList.remove('open')); tr.classList.add('open');
      S.frames = e.hands[+tr.dataset.h].frames; S.fi = 0; framebar();
    });
  } catch (err) { box.innerHTML = `<p class="err">${esc(err.message)}</p>`; }
}

// ---- a turn of your own
let built = [];
function buildHtml() { return `<h3>Score a turn of your own</h3><div class="build" id="build"></div><div id="explain2"></div>`; }
function renderBuild() { if (!$('build')) $('panel').insertAdjacentHTML('beforeend', buildHtml()); built = []; wireBuild(); }
async function wireBuild() {
  const box = $('build'); if (!box) return;
  const opts = await api('/api/analyse/legal', { ...key(), after: built });
  const mine = opts.filter(o => o.actor === S.pos.me);
  box.innerHTML = built.map(a => `<div>· ${esc(S._txt[JSON.stringify(a)] || JSON.stringify(a))}</div>`).join('')
    + (mine.length && opts.length ? `<select id="bnext"><option value="">${built.length ? 'next action…' : 'first action…'}</option>${mine.map((o, i) => `<option value="${i}">${esc(o.text.trim())}</option>`).join('')}</select> ` : '<div class="muted">The turn is complete.</div>')
    + (built.length ? ` <button id="bundo">Undo</button> <button id="bgo">Explain this turn</button>` : '');
  if ($('bnext')) $('bnext').onchange = () => { const o = mine[+$('bnext').value]; if (!o) return; S._txt[JSON.stringify(o.action)] = o.text.trim(); built.push(o.action); wireBuild(); };
  if ($('bundo')) $('bundo').onclick = () => { built.pop(); wireBuild(); };
  if ($('bgo')) $('bgo').onclick = () => { const t = built.slice(); const ex = $('explain'); if (!ex) $('explain2').id = 'explain'; explain(t); };
}

// ---- start
$('go').onclick = analyse;
$('game').onchange = () => pickGame(+$('game').value);
document.addEventListener('keydown', e => { if (e.target.tagName === 'SELECT' || e.target.tagName === 'INPUT') return;
  if (e.key === 'ArrowRight') S.frames ? step(1) : setPly(Math.min(S.moves.length, S.ply + 1));
  if (e.key === 'ArrowLeft') S.frames ? step(-1) : setPly(Math.max(0, S.ply - 1)); });
(async () => {
  await loadGames();
  const [src, id, n, ply] = decodeURIComponent(location.hash.slice(1)).split('/');
  const i = S.games.findIndex(g => g.src === src && g.id === id && String(g.n) === n);
  await pickGame(i >= 0 ? i : 0, i >= 0 && ply !== undefined ? +ply : null);
})();
</script>
</body>
</html>
