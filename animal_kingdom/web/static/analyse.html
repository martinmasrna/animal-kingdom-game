<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Analysis board</title>
<style>
  :root { --line: #d0d4da; --head: #f2f4f7; --took: #e6f4ea; --bad: #b3261e; --good: #137333; --muted: #5f6368; --sel: #e8f0fe; --exp: #fef7e0; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #202124; background: #fff; overflow: hidden; }
  header { display: flex; gap: 8px; align-items: center; padding: 6px 10px; border-bottom: 1px solid var(--line); background: var(--head); height: 37px; }
  header select { max-width: 560px; }
  header input#seed { width: 52px; }
  #engbtn { font-weight: 600; min-width: 92px; }
  #engbtn.on { background: #1a73e8; color: #fff; border-color: #1a73e8; }
  main { display: flex; height: calc(100vh - 37px); }
  #left { flex: 0 0 60%; display: flex; flex-direction: column; border-right: 1px solid var(--line); }
  #board { flex: 1; border: 0; width: 100%; background: #c9a46a; }
  #nav { display: flex; gap: 6px; align-items: center; padding: 6px 10px; border-top: 1px solid var(--line); background: var(--head); min-height: 38px; }
  #nav .cap { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #nav button { min-width: 34px; }
  #right { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #eng { flex: 1; overflow: auto; padding: 4px 10px 10px; }
  #moves { height: 190px; overflow: auto; border-top: 1px solid var(--line); font-variant-numeric: tabular-nums; padding: 2px 0; }
  #moves div { padding: 1px 10px; cursor: pointer; white-space: nowrap; }
  #moves div.sub { color: var(--muted); }
  #moves div.off { font-style: italic; color: #1a73e8; }
  #moves div.at { background: var(--sel); font-weight: 600; }
  #moves div:hover { background: #f1f3f4; }
  button { font: inherit; padding: 2px 8px; cursor: pointer; }
  table { border-collapse: collapse; width: 100%; margin: 4px 0 10px; }
  th, td { border: 1px solid var(--line); padding: 3px 6px; text-align: left; vertical-align: top; }
  th { background: var(--head); font-weight: 600; position: sticky; top: 0; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; width: 58px; }
  td.r { width: 26px; color: var(--muted); text-align: right; }
  tr.exp td { background: var(--exp); }
  tr.took td { background: var(--took); }
  tr.click { cursor: pointer; }
  tr.click:hover td { background: #f1f3f4; }
  tr.open td { background: var(--sel); }
  td.dim { color: #b0b4ba; }
  .neg { color: var(--bad); } .pos { color: var(--good); }
  .muted { color: var(--muted); }
  .badge.new { background: #1e8e3e; color: #fff; }
  .badge { display: inline-block; padding: 0 5px; border-radius: 3px; background: #f9ab00; color: #202124; font-size: 11px; font-weight: 600; margin-left: 4px; }
  a.x { cursor: pointer; color: #1a73e8; text-decoration: underline; white-space: nowrap; margin-left: 6px; }
  h3 { margin: 10px 0 2px; font-size: 13px; }
  .status { color: var(--muted); }
  .err { color: var(--bad); white-space: pre-wrap; }
  .dec { margin: 4px 0 4px 18px; }
  .dec table { width: auto; min-width: 60%; }
  details > summary { cursor: pointer; margin: 8px 0 2px; font-weight: 600; }
</style>
</head>
<body>
<header>
  <select id="game" title="The game"></select>
  <label title="Sets the five hands the engine imagines for the opponent (as the Expert would at this seed)">seed <input id="seed" type="number" value="0" min="0"></label>
  <label title="Depth 1: this turn and the opponent's best reply. Depth 2: then this side's best next turn and the opponent's best reply to that">depth <select id="depth"><option value="1">1</option><option value="2" selected>2</option></select></label>
  <label title="Score against the real hidden cards and deck order (a look back at the game), instead of the hands the bot would imagine"><input id="real" type="checkbox"> real hands</label>
  <button id="engbtn" title="Start or stop the engine on the position on the board (it restarts by itself when the position changes)">Analyse</button>
  <span id="status" class="status"></span>
</header>
<main>
  <section id="left">
    <iframe id="board" src="/#/lab/mid"></iframe>
    <div id="nav"></div>
  </section>
  <section id="right">
    <div id="eng"><p class="muted">Play on the board as in a game: either side, both hands face up. Step through the game with ◀ ▶ (or the arrow keys) and click any move in the list below. "Analyse" ranks every whole turn the side to act can play, each scored against the opponent's best whole reply.</p></div>
    <div id="moves"></div>
  </section>
</main>
<script>
const $ = id => document.getElementById(id);
const S = { games: [], g: null, sid: null, b: null, moves: [], on: false, ver: 1000, frames: null, fi: 0, last: null, pollT: null, explainOf: null };
const fmt = x => x == null ? '' : `<span class="${x < 0 ? 'neg' : x > 0 ? 'pos' : ''}">${x.toFixed(1)}</span>`;
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const who = p => { const s = S.g && S.g.seats[p]; return !s || s === 'human' || /^Player/.test(s) ? 'you' : s; };
const seed = () => +$('seed').value || 0;

async function api(path, body) {
  const r = await fetch(path, body ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) } : {});
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}

// ---- the board: the game's own client in a frame. Moves made on it come back through its hook and are played here.
const frameWin = () => $('board').contentWindow;
function boardReady() {
  const w = frameWin();
  return w && w.__ak && w.__ak.feed && w.__ak.cards && Object.keys(w.__ak.cards() || {}).length && w.__ak().V;
}
async function untilReady() { for (let i = 0; i < 150 && !boardReady(); i++) await new Promise(r => setTimeout(r, 100)); return boardReady(); }
async function feed(view, animate) {
  if (!await untilReady()) return;
  const w = frameWin();
  w.__ak.onAct = action => onAct(action);
  if (!w.__akKeys) { w.__akKeys = true; w.document.addEventListener('keydown', keys); }   // the arrows work with the board focused too
  if (!w.__akRing) { w.__akRing = true; const st = w.document.createElement('style');
    st.textContent = `#board .cr.ahl::after { content: ''; position: absolute; inset: -10px; border-radius: 50%; border: 5px solid #f9ab00; pointer-events: none; z-index: 5; }
      #board .cr.ahl::before { content: attr(data-ahl); position: absolute; left: -14px; top: -14px; width: 26px; height: 26px; border-radius: 50%; background: #f9ab00; color: #202124; font: 700 15px/26px sans-serif; text-align: center; z-index: 6; pointer-events: none; }`;
    w.document.head.appendChild(st); }
  const v = JSON.parse(JSON.stringify(view)); v.version = S.ver++; v.analysed = v.version;
  if (!animate) { v.game.events = []; v.game.history = []; }
  w.__ak.feed(v);
  for (let i = 0; i < 10; i++) {   // the frame's own start-up view must not draw over this one
    await new Promise(r => setTimeout(r, 200));
    if (S.ver - 1 !== v.version) return;
    if ((w.__ak().V || {}).analysed !== v.version) w.__ak.feed(v);
  }
}
function ring(crs) {
  const w = frameWin(); if (!w || !w.document) return;
  unring();
  const seat = (S.frames ? S.frames[S.fi].you : S.b.view.you) || S.b.seat, cols = S.b.cols || 5;
  const flat = []; (crs || []).forEach(list => (list || []).forEach(cr => { if (!flat.includes(cr)) flat.push(cr); }));
  flat.forEach((cr, i) => {
    const [c, r] = cr.split(','), v = seat === 'A' ? cr : `${cols + 1 - Number(c)},${r}`;
    const el = w.document.querySelector(`#board [data-cr="${v}"]`);
    if (el) { el.classList.add('ahl'); el.dataset.ahl = flat.length > 1 ? i + 1 : ''; }
  });
}
function unring() { const w = frameWin(); if (w && w.document) w.document.querySelectorAll('#board .ahl').forEach(el => el.classList.remove('ahl')); }
function ringOnHover(root, sel, crsOf) {
  root.querySelectorAll(sel).forEach(el => { el.addEventListener('mouseenter', () => ring(crsOf(el))); el.addEventListener('mouseleave', unring); });
}
const animating = () => { const w = frameWin(); return w && w.__ak && w.__ak().PB && w.__ak().PB.busy; };

async function onAct(action) {
  if (S.frames) return;            // a still of an imagined line: nothing to play
  try {
    const r = await api('/api/analyse/play', { sid: S.sid, action });
    S.b = r; S.moves = r.moves;
    if (r.mover_view) {            // the move plays out from the mover's side, then the board turns to the side to act
      await feed(r.mover_view, true);
      for (let i = 0; i < 40 && animating(); i++) await new Promise(res => setTimeout(res, 100));
      await new Promise(res => setTimeout(res, 300));
      await feed(r.view, false);
    } else await feed(r.view, true);
    afterMove();
  } catch (e) { $('status').textContent = e.message; }
}
async function goto(k, game) {
  const r = await api('/api/analyse/goto', { sid: S.sid, k, game: !!game });
  S.b = r; S.moves = r.moves; S.frames = null;
  await feed(r.view, false);
  afterMove();
}
function afterMove() {
  location.hash = `${S.g.src}/${S.g.id}/${S.g.n}/${S.b.k}`;
  renderNav(); renderMoves();
  if (S.on) startEngine(); else renderIdle();
}

function renderNav() {
  const nav = $('nav');
  if (S.frames) {
    nav.innerHTML = `<button id="fp">◀</button><span class="muted">${S.fi + 1} / ${S.frames.length}</span><button id="fn">▶</button>
      <span class="cap">${esc(S.frames[S.fi].label || '')}</span><button id="fx">Back to the board</button>`;
    $('fp').onclick = () => frameStep(-1); $('fn').onclick = () => frameStep(1);
    $('fx').onclick = () => { S.frames = null; feed(S.b.view, false); renderNav(); };
    return;
  }
  const b = S.b;
  nav.innerHTML = `<button id="n0" title="Start">⏮</button><button id="np" title="Back (←)">◀</button><button id="nn" title="Forward (→)">▶</button><button id="ne" title="End of the line">⏭</button>
    <span class="cap">Turn ${b.turn} · ${b.over ? 'game over' : `${who(b.seat)} to act (seat ${b.seat}, at the bottom)`} · food A ${b.food.A} · B ${b.food.B}</span>
    ${b.stops != null ? `<span class="muted" title="A card changed since this game was played, so its move ${b.stops + 1} is no longer legal">replays to move ${b.stops}</span>` : ''}
    ${b.off_game ? '<button id="ng" title="Drop this line and go back to the moves of the game">Back to the game</button>' : ''}`;
  $('n0').onclick = () => goto(0); $('np').onclick = () => goto(b.k - 1); $('nn').onclick = () => goto(b.k + 1); $('ne').onclick = () => goto(b.n);
  if ($('ng')) $('ng').onclick = () => goto(Math.min(b.k, S.moves.filter(m => m.game).length), true);
}
function frameStep(d) { if (!S.frames) return; S.fi = Math.max(0, Math.min(S.frames.length - 1, S.fi + d)); feed(S.frames[S.fi], false); renderNav(); }

function renderMoves() {
  const k = S.b.k;
  $('moves').innerHTML = `<div data-k="0" class="${k === 0 ? 'at' : ''}">start</div>` + S.moves.map(m =>
    `<div data-k="${m.k + 1}" class="${m.top ? '' : 'sub'}${m.game ? '' : ' off'}${m.k + 1 === k ? ' at' : ''}">T${m.turn} ${m.actor} (${who(m.actor)}): ${esc(m.text)}</div>`).join('');
  $('moves').querySelectorAll('div').forEach(el => el.onclick = () => goto(+el.dataset.k));
  ringOnHover($('moves'), 'div[data-k]', el => { const m = S.moves[+el.dataset.k - 1]; return m ? [m.crs] : []; });
  const at = $('moves').querySelector('.at'); if (at) at.scrollIntoView({ block: 'nearest' });
}

// ---- the engine
function renderIdle() { if (!S.explainOf) $('eng').innerHTML = `<p class="muted">Press "Analyse" to rank every turn ${S.b.over ? '' : `${who(S.b.seat)} can play here`}.</p>`; $('status').textContent = ''; }
async function startEngine() {
  clearTimeout(S.pollT); S.last = null; S.explainOf = null;
  if (S.b.over) { $('eng').innerHTML = '<p class="muted">The game is over.</p>'; return; }
  $('eng').innerHTML = '<p class="muted">Starting…</p>';
  await api('/api/analyse/engine', { sid: S.sid, seed: seed(), depth: +$('depth').value, real: $('real').checked });
  poll();
}
async function stopEngine() { clearTimeout(S.pollT); await api('/api/analyse/engine/stop', { sid: S.sid }).catch(() => {}); $('status').textContent = 'stopped'; }
async function poll() {
  const j = await api(`/api/analyse/engine?sid=${S.sid}`).catch(() => null);
  if (!j || j.none) return;
  if (j.k !== S.b.k) return;      // a result for another position
  if (j.error) { $('eng').innerHTML = `<p class="err">${esc(j.error)}</p>`; return; }
  if (j.latest && !S.explainOf) { S.last = j.latest; renderEngine(j.latest, j.done); }
  if (!j.done && S.on) S.pollT = setTimeout(poll, 600);
  else if (j.done) $('status').textContent = S.last ? `done · ${S.last.seconds} s` : '';
}
const STAGES = { 2: 'depth 1 done', 3: 'depth 2 done', 4: 'the live bot\'s own search', 5: 'done' };
function renderEngine(L, done) {
  const next = L.stage === 2 && L.depth >= 2 ? ' · depth 2 running' : L.stage < 4 ? ' · the live bot\'s search running' : '';
  $('status').textContent = done ? `done · ${L.seconds} s${L.real ? ' · real hands' : ''}` : `${STAGES[L.stage] || ''}${next} · ${L.seconds} s`;
  const rows = L.rows;
  let h = `<table><tr><th class="r">#</th><th>Turn (${who(L.me)}, ${L.turns} possible)</th><th class="num" title="The board when the turn ends, mean over the imagined hands (every turn)">Board</th><th class="num" title="The live bot's score: after its GreedyBot reply, mean of the five hands (the best 20)">Old reply</th><th class="num" title="Depth 1: after the opponent's best whole reply turn, mean over the hands (the best 60 by Board)">Depth 1</th>${L.depth >= 2 ? '<th class="num" title="Depth 2: then this side\'s best next turn and the opponent\'s best reply to it (the best 20 by depth 1); ranks when shown">Depth 2</th>' : ''}<th></th></tr>`;
  rows.forEach((r, i) => {
    h += `<tr class="click${r.expert ? ' exp' : ''}" data-i="${i}"><td class="r">${i + 1}</td><td>${r.text.map(t => esc(t.trim())).join(' · ')}${i === 0 && (r.score2 ?? r.score) != null ? '<span class="badge new" title="The new whole-turn search plays this">New pick</span>' : ''}${r.expert ? '<span class="badge" title="What the live bot (the old search) plays here">Live bot</span>' : ''}</td>
      <td class="num${r.score != null ? ' dim' : ''}">${fmt(r.board)}</td><td class="num dim">${fmt(r.old)}</td><td class="num${r.score2 != null ? ' dim' : ''}">${fmt(r.score)}</td>${L.depth >= 2 ? `<td class="num">${fmt(r.score2)}</td>` : ''}
      <td style="white-space:nowrap"><a class="x" data-play="${i}" title="Play this turn on the board">play</a><a class="x" data-hands="${i}" title="The five imagined hands, each one's scores and its line">hands</a></td></tr>`;
  });
  h += '</table>';
  if (L.expert) h += expertHtml(L.expert);
  const scroll = $('eng').scrollTop;
  $('eng').innerHTML = h; $('eng').scrollTop = scroll;
  $('eng').querySelectorAll('a[data-play]').forEach(a => a.onclick = e => { e.stopPropagation(); playTurn(rows[+a.dataset.play].turn); });
  $('eng').querySelectorAll('a[data-hands]').forEach(a => a.onclick = e => { e.stopPropagation(); hands(rows[+a.dataset.hands].turn); });
  $('eng').querySelectorAll('tr.click').forEach(tr => tr.onclick = () => hands(rows[+tr.dataset.i].turn));
  ringOnHover($('eng'), 'tr.click[data-i]', el => rows[+el.dataset.i].crs);
  if (L.expert) ringOnHover($('eng'), 'tr[data-root]', el => L.expert.roots[+el.dataset.root].crs);
  $('eng').querySelectorAll('a[data-opt]').forEach(a => a.onclick = e => { e.stopPropagation(); const [r, d, o] = a.dataset.opt.split('.').map(Number); hands(L.expert.roots[r].decisions[d].options[o].turn); });
}
function expertHtml(x) {
  let h = `<details><summary>The live bot (the old search) plays: ${esc(x.planned_text.map(t => t.trim()).join(' · '))}</summary>
    <div class="muted">The first actions it scored (it looks one round deeper only at its best three by the reply score), the rest of the turn it planned with each, and every option it weighed at each decision.</div>
    <table><tr><th>Turn it planned</th><th class="num">Reply</th><th class="num">Deep</th></tr>`;
  x.roots.forEach((r, ri) => {
    h += `<tr data-root="${ri}"><td>${r.text.map(t => esc(t.trim())).join(' · ')}${r.decisions.map((d, di) => `<div class="dec"><b>Decision ${di + 1}</b> <span class="muted">${d.options[0].reply ? 'scored after the reply' : 'scored on the board when the turn ends, no reply'}</span>
      <table>${d.options.map((o, oi) => `<tr class="${o.took ? 'took' : ''}"><td>${esc(o.text.trim())}${o.took ? ' <span class="muted">(taken)</span>' : ''}</td><td class="num">${fmt(o.score)}</td><td><a class="x" data-opt="${ri}.${di}.${oi}">hands</a></td></tr>`).join('')}</table></div>`).join('')}</td>
      <td class="num">${fmt(r.reply)}</td><td class="num">${fmt(r.deep)}</td></tr>`;
  });
  return h + '</table></details>';
}
async function playTurn(turn) {   // a ranked turn played on the board, action by action, as if clicked
  for (const a of turn) { await onAct(a); await new Promise(r => setTimeout(r, 150)); }
}

// ---- one turn, hand by hand
async function hands(turn) {
  S.explainOf = turn; clearTimeout(S.pollT);
  $('eng').innerHTML = `<p><a class="x" id="hback" style="margin:0">← back to the ranking</a></p><p class="muted">Scoring this turn hand by hand…</p>`;
  $('hback').onclick = backToRanking;
  try {
    const e = await api('/api/analyse/explain', { sid: S.sid, seed: seed(), turn });
    if (S.explainOf !== turn) return;
    const mean = a => a.reduce((x, y) => x + y, 0) / a.length;
    let h = `<p><a class="x" id="hback" style="margin:0">← back to the ranking</a></p><h3>${e.turn.map(t => esc(t.trim())).join(' · ')}</h3>
      <div class="muted">The five hands imagined for the opponent at seed ${seed()} (the Expert's own five), and in each, their whole reply turn that is worst for this turn. Click a hand to play it on the board.</div>
      <table><tr><th class="r">#</th><th>Hand imagined for the opponent</th><th class="num">Board</th><th class="num" title="The old search: after its GreedyBot reply">Old reply</th><th class="num" title="After their best whole reply turn">Best reply</th><th>Their best reply</th></tr>`;
    e.hands.forEach((x, i) => { h += `<tr class="click" data-h="${i}"><td class="r">${i + 1}</td><td>${x.hand.map(esc).join(', ')}</td><td class="num">${fmt(x.board)}</td><td class="num dim">${fmt(x.reply)}</td><td class="num">${fmt(x.best)}</td><td>${x.reply_text.map(t => esc(t.trim())).join(' · ')}${x.ends ? ` <b>${esc(x.ends)}</b>` : ''}</td></tr>`; });
    h += `<tr><th></th><th>Mean</th><th class="num">${fmt(mean(e.board))}</th><th class="num">${fmt(mean(e.reply))}</th><th class="num">${fmt(mean(e.best))}</th><th></th></tr></table>`;
    $('eng').innerHTML = h; $('hback').onclick = backToRanking;
    $('eng').querySelectorAll('tr[data-h]').forEach(tr => tr.onclick = () => {
      $('eng').querySelectorAll('tr[data-h]').forEach(t => t.classList.remove('open')); tr.classList.add('open');
      S.frames = e.hands[+tr.dataset.h].frames; S.fi = 0; feed(S.frames[0], false); renderNav();
    });
  } catch (err) { $('eng').innerHTML = `<p><a class="x" id="hback" style="margin:0">← back</a></p><p class="err">${esc(err.message)}</p>`; $('hback').onclick = backToRanking; }
}
function backToRanking() {
  S.explainOf = null;
  if (S.frames) { S.frames = null; feed(S.b.view, false); renderNav(); }
  if (S.last) renderEngine(S.last, !S.on || S.last.stage === 5); else renderIdle();
  if (S.on && (!S.last || S.last.stage !== 5)) poll();
}

// ---- games
async function loadGames() {
  S.games = await api('/api/analyse/games');
  $('game').innerHTML = S.games.map((g, i) => {
    const when = new Date(g.when * 1000).toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
    const tag = g.running ? 'running' : `${g.winner ? g.winner + ' won' : ''} ${g.reason || ''}`;
    return `<option value="${i}">${when} · ${g.id.replace(/^web_\d+T\d+_/, '')} game ${g.game} · A ${g.seats.A} vs B ${g.seats.B} · ${tag}</option>`;
  }).join('');
}
async function openGame(i, k) {
  S.g = S.games[i]; $('game').value = i; S.frames = null; S.explainOf = null;
  const r = await api('/api/analyse/open', { src: S.g.src, id: S.g.id, n: S.g.n, k: k == null ? null : k });
  S.sid = r.sid; S.b = r; S.moves = r.moves;
  await feed(r.view, false);
  afterMove();
}

$('engbtn').onclick = () => {
  S.on = !S.on; $('engbtn').classList.toggle('on', S.on); $('engbtn').textContent = S.on ? 'Analysing' : 'Analyse';
  if (S.on) startEngine(); else stopEngine();
};
$('seed').onchange = $('depth').onchange = $('real').onchange = () => { if (S.on) startEngine(); };
$('game').onchange = () => openGame(+$('game').value);
function keys(e) {
  if (e.target.tagName === 'SELECT' || e.target.tagName === 'INPUT') return;
  if (e.key === 'ArrowRight') { e.preventDefault(); S.frames ? frameStep(1) : goto(S.b.k + 1); }
  if (e.key === 'ArrowLeft') { e.preventDefault(); S.frames ? frameStep(-1) : goto(S.b.k - 1); }
}
document.addEventListener('keydown', keys);
(async () => {
  await loadGames();
  const [src, id, n, k] = decodeURIComponent(location.hash.slice(1)).split('/');
  const i = S.games.findIndex(g => g.src === src && g.id === id && String(g.n) === n);
  await openGame(i >= 0 ? i : 0, i >= 0 && k !== undefined ? +k : null);
})();
</script>
</body>
</html>
