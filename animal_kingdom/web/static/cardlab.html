<!doctype html>
<html><head><meta charset="utf-8"><title>Card Lab</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/static/tokens.css">
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,500;0,700;1,500&display=swap" rel="stylesheet">
<style>
/* Card design lab: three directions on one sheet (?c=A|B|C), at hand size and at hover size, over the board. Code-only sketches. */
html, body { margin: 0; height: 100%; }
body { background: #1a1208 url(/static/kit/sav_D4.webp) center / cover; font-family: var(--font-text); overflow: auto; }
body::before { content: ''; position: fixed; inset: 0; background: rgba(15,10,4,.55); pointer-events: none; }
.bar { position: sticky; top: 0; z-index: 5; display: flex; gap: 6px; align-items: center; padding: 10px 16px; background: rgba(12,10,8,.9); color: #d8c8a8; font-size: 13px; }
.bar a { padding: 4px 10px; border-radius: 6px; border: 1px solid #5a4630; color: #d8c8a8; text-decoration: none; }
.bar a.on { background: #e0a040; color: #1a1006; border-color: #e0a040; }
.bar span { margin-left: 12px; opacity: .7; }
.row { position: relative; display: flex; flex-wrap: wrap; gap: 22px; padding: 26px 28px 8px; align-items: flex-start; }
h2 { position: relative; margin: 14px 28px 0; font: 600 12px var(--font-text); letter-spacing: .1em; text-transform: uppercase; color: #d8c8a8; }
.big .card { --w: 300px; }

/* ---------- shared: every card is --w wide, 5:7, all sizes in em of a --w/20 font ---------- */
.card { --w: 180px; position: relative; width: var(--w); height: calc(var(--w) * 1.4); font-size: calc(var(--w) / 20); flex: none; }
.card .gem { position: absolute; z-index: 5; left: -.6em; top: -.6em; width: 3.4em; height: 3.4em; }
.card .gem img { width: 100%; height: 100%; }
.card .gem span { position: absolute; inset: 0; display: grid; place-items: center; font: 1.85em/1 'Lilita One'; color: #fff8e6; paint-order: stroke fill; -webkit-text-stroke: .22em #2a1606; padding-bottom: .1em; }
.card .cost { position: absolute; z-index: 5; right: -.5em; top: -.5em; width: 3em; height: 3em; border-radius: 50%; display: grid; place-items: center;
  background: radial-gradient(circle at 35% 30%, #fff1a8, #f2b830 45%, #b8700c 90%); box-shadow: 0 .15em .3em rgba(0,0,0,.6), inset 0 0 0 .15em rgba(90,50,5,.5); font: 1.3em/1 'Lilita One'; color: #3a1c02; }
.art { background-size: cover; background-position: center; }
b.kw { font-weight: 700; }

/* ---------- 0: now ---------- */
.c0 .face { position: absolute; inset: 0; border-radius: .55em; overflow: hidden; padding: .17em; background: linear-gradient(160deg, #8a8f95, #3f4348); box-shadow: .2em .45em .7em rgba(0,0,0,.6); }
.c0.rare .face { padding: .22em; background: linear-gradient(160deg, #e3eef8, #6d8ca8 30%, #2b4258 65%, #a8c3db); }
.c0.legendary .face { padding: .33em; background: linear-gradient(135deg, #fff3c4, #e0b24c 18%, #8a6414 40%, #f3d27a 55%, #a8781c 72%, #fbe7a6 90%); }
.c0 .art { width: 100%; height: 100%; border-radius: .4em; }
.c0 .nm { position: absolute; left: .17em; right: .17em; top: .17em; padding: .4em .35em 1.1em 2.6em; font: 1em/1.05 'Lilita One'; color: #fff8e6; background: linear-gradient(rgba(10,6,2,.85), transparent); border-radius: .4em .4em 0 0; }
.c0 .tx { position: absolute; left: .17em; right: .17em; bottom: .17em; padding: 1.6em .5em .5em; font-size: .68em; line-height: 1.3; color: #f1e8d6; background: linear-gradient(transparent, rgba(10,6,2,.88) 38%); border-radius: 0 0 .4em .4em; }
.c0 .tg { display: none; }

/* ---------- A: framed plate. Art above in a carved wooden frame, parchment panel below. ---------- */
.cA .face { position: absolute; inset: 0; border-radius: .7em; padding: .45em; box-shadow: .25em .5em .8em rgba(0,0,0,.65);
  background: linear-gradient(135deg, #9a6a3a, #6a4420 40%, #8a5a2c 60%, #4a2c12), #6a4420; }
.cA .face::before { content: ''; position: absolute; inset: .12em; border-radius: .6em; box-shadow: inset 0 .08em 0 rgba(255,220,160,.45), inset 0 -.1em .2em rgba(0,0,0,.45); pointer-events: none; }
.cA .art { position: absolute; left: .45em; right: .45em; top: .45em; height: 64%; border-radius: .35em .35em .15em .15em; box-shadow: inset 0 0 0 .1em rgba(30,15,5,.7), inset 0 -1.2em 1.2em -1em rgba(0,0,0,.45); }
.cA .panel { position: absolute; left: .45em; right: .45em; bottom: .45em; top: calc(64% + .7em); display: flex; align-items: center; justify-content: center; border-radius: .15em .15em .35em .35em;
  background: radial-gradient(ellipse at 50% 30%, #f6ead0, #e6d3aa 70%, #d6be8c); box-shadow: inset 0 0 .5em rgba(120,80,30,.45); padding: .5em .7em 1em; text-align: center; }
.cA .nm { position: absolute; left: 50%; top: .05em; transform: translateX(-50%); z-index: 3; white-space: nowrap; padding: .28em .9em .32em; border-radius: .3em;
  background: linear-gradient(#7a4e26, #4e2e12); box-shadow: 0 .12em .25em rgba(0,0,0,.5), inset 0 .06em 0 rgba(255,220,160,.35); font: 700 1.22em/1 'Cinzel', serif; color: #fbeccd; letter-spacing: .02em; }
.cA .tx { font: 500 1.19em/1.14 'EB Garamond', serif; color: #3a2610; }
.cA .tg { position: absolute; left: 0; right: 0; bottom: .45em; text-align: center; font: 700 .52em/1 'Cinzel', serif; letter-spacing: .14em; color: rgba(90,60,25,.75); text-transform: uppercase; }
.cA.rare .face { background: linear-gradient(135deg, #9a6a3a, #6a4420 40%, #8a5a2c 60%, #4a2c12); }
.cA.rare .face::after { content: ''; position: absolute; inset: 0; border-radius: .7em; pointer-events: none;
  background: radial-gradient(circle at 1.1em 1.1em, #d8a868 .45em, #8a5a22 .6em, transparent .7em), radial-gradient(circle at calc(100% - 1.1em) 1.1em, #d8a868 .45em, #8a5a22 .6em, transparent .7em),
    radial-gradient(circle at 1.1em calc(100% - 1.1em), #d8a868 .45em, #8a5a22 .6em, transparent .7em), radial-gradient(circle at calc(100% - 1.1em) calc(100% - 1.1em), #d8a868 .45em, #8a5a22 .6em, transparent .7em); }
.cA.legendary .face { padding: .6em; background: linear-gradient(135deg, #fff3c4, #e0b24c 18%, #8a6414 40%, #f3d27a 55%, #a8781c 72%, #fbe7a6 90%); }
.cA.legendary .art { left: .6em; right: .6em; top: .6em; }
.cA.legendary .panel { left: .6em; right: .6em; bottom: .6em; }
.cA.legendary .nm { background: linear-gradient(#f3d27a, #a8781c); color: #3a2204; }

/* ---------- B: full-bleed art, name on a ribbon, text on a hide strip. ---------- */
.cB .face { position: absolute; inset: 0; border-radius: .6em; overflow: hidden; box-shadow: .25em .5em .8em rgba(0,0,0,.65); border: .22em solid #3e2a16; }
.cB .art { position: absolute; inset: 0; }
.cB .nm { position: absolute; left: 50%; top: .55em; transform: translateX(-50%); white-space: nowrap; padding: .3em 1.1em .36em; font: 700 1.19em/1 'Cinzel', serif; color: #2a1806;
  background: linear-gradient(#f3e6c6, #d8c49a); clip-path: polygon(0 0, 100% 0, 94% 50%, 100% 100%, 0 100%, 6% 50%); box-shadow: 0 .1em .2em rgba(0,0,0,.4); }
.cB .panel { position: absolute; left: .4em; right: .4em; bottom: .4em; padding: .55em .65em .75em; border-radius: .25em;
  background: radial-gradient(ellipse at 50% 20%, rgba(246,234,208,.97), rgba(226,208,170,.97)); box-shadow: 0 -.1em .4em rgba(0,0,0,.35); text-align: center; }
.cB .panel .ptg { margin-top: .35em; font: 700 .6em/1 'Cinzel', serif; letter-spacing: .16em; color: rgba(90,60,25,.8); text-transform: uppercase; }
.cB .panel .tx + .ptg { border-top: .06em solid rgba(90,60,25,.3); padding-top: .35em; }
.cB > .face > .tg { display: none; }
.cA .panel { flex-direction: column; }
.cA > .face > .tg { display: none; }
.cA .panel .ptg { margin-top: .45em; font: 700 .6em/1 'Cinzel', serif; letter-spacing: .16em; color: rgba(90,60,25,.8); text-transform: uppercase; }
.cA .panel .tx + .ptg { border-top: .06em solid rgba(90,60,25,.3); padding-top: .4em; }
.cB .tx { font: 500 1.16em/1.14 'EB Garamond', serif; color: #3a2610; }
.cB .tg { position: absolute; left: 0; right: 0; bottom: .1em; text-align: center; font: 700 .48em/1 'Cinzel', serif; letter-spacing: .14em; color: rgba(90,60,25,.7); text-transform: uppercase; }
.cB.rare .face { border: .3em solid #8a6a3a; box-shadow: .25em .5em .8em rgba(0,0,0,.65), inset 0 0 0 .12em #d8b070; }
.cB.legendary .face { border: .45em solid #c8962e; box-shadow: .25em .5em .8em rgba(0,0,0,.65), inset 0 0 0 .14em #fbe7a6, 0 0 0 .08em #6a4a0a; }

/* ---------- C: field guide page. Cream paper, the art as a plate, engraved caps, a book serif. ---------- */
.cC .face { position: absolute; inset: 0; border-radius: .35em; padding: .7em .7em .6em; box-shadow: .25em .5em .8em rgba(0,0,0,.6);
  background: radial-gradient(ellipse at 40% 30%, #fbf3e0, #efe2c2 75%, #e2cfa4); }
.cC .face::before { content: ''; position: absolute; inset: .35em; border: .06em solid rgba(90,60,25,.45); border-radius: .2em; pointer-events: none; }
.cC .nm { position: relative; text-align: center; padding: .3em 1.8em 0; font: 700 1em/1 'Cinzel', serif; letter-spacing: .06em; color: #2a1806; text-transform: uppercase; }
.cC .tg { position: relative; text-align: center; margin-top: .15em; font: italic 500 .62em/1 'EB Garamond', serif; color: rgba(90,60,25,.85); }
.cC .face { display: flex; flex-direction: column; }
.cC .art { position: relative; margin: .45em 0 .4em; flex: 1; min-height: 0; box-shadow: 0 0 0 .08em rgba(60,35,10,.6), .1em .2em .3em rgba(60,35,10,.35); }
.cC .panel { position: relative; text-align: center; padding: 0 .3em; min-height: 2.6em; display: flex; align-items: center; justify-content: center; }
.cC .tx { font: 500 .88em/1.18 'EB Garamond', serif; color: #2a1806; }
.cC .gem { left: -.7em; top: -.7em; }
.cC.rare .face::before { inset: .3em; border: .12em double rgba(90,60,25,.7); }
.cC.legendary .face { background: radial-gradient(ellipse at 40% 30%, #fbf3e0, #efe2c2 75%, #e2cfa4); box-shadow: .25em .5em .8em rgba(0,0,0,.6), inset 0 0 0 .3em #c8962e, inset 0 0 0 .38em #fbe7a6; }
.cC.legendary .face::before { inset: .6em; border: .06em solid rgba(140,100,20,.8); }
.cC.legendary .nm::before, .cC.legendary .nm::after { content: '❦'; color: #a8781c; margin: 0 .3em; font-size: .8em; }
</style></head>
<body>
<div class="bar" id="bar"></div>
<h2>Hand size (180 px)</h2><div class="row" id="small"></div>
<h2>Hover size (300 px)</h2><div class="row big" id="big"></div>
<script type="module">
import { hasArt, artUrl } from '/static/art.js';
const V = new URLSearchParams(location.search).get('c') || 'A';
const NAMES = { 0: 'Now', A: 'A framed plate', B: 'B full-bleed + strip', C: 'C field guide' };
document.getElementById('bar').innerHTML = Object.entries(NAMES).map(([k, n]) => `<a href="?c=${k}" class="${k === V ? 'on' : ''}">${n}</a>`).join('') + '<span>code-only sketches · rarity by form: common plain, rare fittings, legendary gilt</span>';
const pool = await fetch('/api/pool').then(r => r.json()), C = Object.fromEntries(pool.cards.map(c => [c.id, c]));
const IDS = ['lion', 'lynx', 'jaguar', 'snow_leopard', 'elephant', 'andean_condor', 'king_theron', 'methuselah'];
const text = c => (c.text || '').replace(/^(Battlecry|Immovable|Flight|Stealth|Apex Predator|Fragile)(:|\.)/, '<b class="kw">$1$2</b>');
const card = c => `<div class="card c${V} ${c.rarity}"><div class="face">
  <div class="art" style="background-image:url(${artUrl(c.id)})"></div>
  <div class="nm">${c.name}</div>
  <div class="panel">${c.text ? `<div class="tx">${text(c)}</div>` : ''}${V === 'B' || V === 'A' ? `<div class="ptg">${c.tags.join(' · ')}</div>` : ''}</div>
  <div class="tg">${c.tags.join(' · ')}</div></div>
  <div class="gem"><img src="/static/kit/gem_b.webp" alt=""><span>${c.str}</span></div>${c.cost ? `<div class="cost">${c.cost}</div>` : ''}</div>`;
// In C the name sits above the art: reorder.
const html = c => V === 'C' ? card(c).replace(/(<div class="art"[^>]*><\/div>)\s*(<div class="nm">[^<]*<\/div>)/, '$2<div class="tg">' + c.tags.join(' · ') + '</div>$1').replace(/<\/div>\s*<div class="tg">[^<]*<\/div><\/div>\s*<div class="gem">/, '</div></div><div class="gem">') : card(c);
document.getElementById('small').innerHTML = IDS.map(id => html(C[id])).join('');
document.getElementById('big').innerHTML = ['snow_leopard', 'king_theron', 'elephant', 'lion'].map(id => html(C[id])).join('');
</script>
</body></html>
