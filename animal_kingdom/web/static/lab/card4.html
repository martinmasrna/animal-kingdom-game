<!doctype html><html><head><meta charset="utf-8"><title>Card variants</title>
<link rel="stylesheet" href="/static/tokens.css"><link rel="stylesheet" href="/static/app.css"><link rel="stylesheet" href="/static/lab/card3.css">
<style>
html, body { overflow: auto !important; margin: 0; height: auto; background: #15120f; color: #c9b48f; }
section { padding: 16px 28px 22px; border-bottom: 1px solid #2a241e; }
h2 { font: 600 15px var(--font-text); color: #e8d8b8; margin: 0 0 12px; } h2 span { font-weight: 400; color: #8a7a62; margin-left: 10px; }
.row { display: flex; gap: 12px; align-items: flex-end; }
.row .card3 { --w: 200px; } .row .gap { width: 30px; } .row .card3.compact { --w: 118px; }
#pop { position: fixed; z-index: 50; pointer-events: none; display: none; } #pop .card3 { --w: 250px; }
</style></head><body>
<div id="out"></div><div id="pop"></div>
<script type="module">
import { cardHTML } from '/static/lab/card3.js';
const pool = await fetch('/api/pool').then(r => r.json()), C = Object.fromEntries(pool.cards.map(c => [c.id, c]));
const full = ['magpie', 'borealis', 'vesper'], cmp = ['king_theron', 'queen_adira', 'lynx', 'house_cat', 'groundhog', 'rat_king'];
const V = [['a', 'A · Name bar on top', 'strength tab hangs from the bar'], ['b', 'B · Name plate under the art', 'strength tab top-left; the top of the painting stays clear'], ['c', 'C · Everything at the bottom', 'strength in a stone block on the name plate; nothing covers the painting\'s top']];
document.getElementById('out').innerHTML = V.map(([v, t, sub]) => `<section class="v-${v}" data-v="${v}"><h2>${t}<span>${sub}</span></h2><div class="row">` +
  full.map(id => cardHTML(C[id])).join('') + '<div class="gap"></div>' + cmp.map(id => cardHTML(C[id], { cls: 'compact' }).replace('<div class="card3', `<div data-id="${id}" class="card3`)).join('') + '</div></section>').join('');
const pop = document.getElementById('pop');
document.querySelectorAll('[data-id]').forEach(e => { e.onmouseenter = () => { const r = e.getBoundingClientRect(); pop.className = 'v-' + e.closest('section').dataset.v; pop.innerHTML = cardHTML(C[e.dataset.id]);
  const w = 250, h = w * 1.467, x = r.right + 12 + w > innerWidth ? r.left - w - 12 : r.right + 12, y = Math.max(8, Math.min(innerHeight - h - 8, r.top + r.height / 2 - h / 2));
  pop.style.left = x + 'px'; pop.style.top = y + 'px'; pop.style.display = 'block'; }; e.onmouseleave = () => pop.style.display = 'none'; });
</script></body></html>
