<!doctype html><html><head><meta charset="utf-8"><title>Card materials</title>
<link rel="stylesheet" href="/static/tokens.css"><link rel="stylesheet" href="/static/app.css"><link rel="stylesheet" href="/static/lab/card3.css">
<link href="https://fonts.googleapis.com/css2?family=Fira+Sans+Condensed:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
html, body { overflow: auto !important; margin: 0; height: auto; background: #15120f; color: #c9b48f; }
h2 { font: 600 13px var(--font-text); letter-spacing: .06em; text-transform: uppercase; color: #8a7a62; margin: 18px 28px 0; }
.row { display: flex; gap: 16px; padding: 12px 28px 8px; } .row .card3 { --w: 212px; }
</style></head><body class="f-fira">
<div id="out"></div>
<script type="module">
import { cardHTML } from '/static/lab/card3.js';
const pool = await fetch('/api/pool').then(r => r.json()), C = Object.fromEntries(pool.cards.map(c => [c.id, c]));
const ids = ['skunk', 'sirocco', 'outrider', 'magpie', 'vesper', 'scrooge'];
const V = new URLSearchParams(location.search).get('v') ? [[new URLSearchParams(location.search).get('v'), '']] :
  [['m m-wood t', 'Proposal: painted driftwood frame'], ['s-guide', 'Now (flat)'], ['m m-bone t', 'Also tried: bone'], ['m m-sand t', 'Also tried: sandstone']];
document.getElementById('out').innerHTML = V.map(([cls, t]) => `<h2>${t}</h2><div class="row s-guide s-read ${cls}">${ids.map(id => cardHTML(C[id])).join('')}</div>`).join('');
</script></body></html>
