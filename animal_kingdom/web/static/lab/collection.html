<div class="gb" id="gb"></div><div id="modal"></div><div id="toast2"></div><div class="pop" id="pop"></div>

<script type="module">
import { cardHTML } from '/static/card.js';
import { CROP, artUrl } from '/static/art.js';
const pool = await fetch('/api/pool').then(r => r.json()), C = Object.fromEntries(pool.cards.map(c => [c.id, c]));
const decks = pool.decks.filter(d => d.id !== 'goodstuff');
const cards = pool.cards.filter(c => decks.some(d => d.id === c.deck));
const FAMILIES = [['Cat', 'lion'], ['Canine', 'gray_wolf'], ['Rodent', 'squirrel'], ['Colony', 'queen_bee'], ['Bird', 'eagle'], ['Snake', 'viper'], ['Bear', 'grizzly_bear'], ['Megafauna', 'elephant'], ['Lizard', 'chameleon']];
const RANK = { legendary: 0, rare: 1, common: 2 }, sv = c => c.str === '*' ? -1 : c.str, LIMIT = { legendary: 1, rare: 2, common: 3 };
// A round head crop of the card art, M px across (CROP: centre x, centre y, diameter as fractions of width, height, width).
const med = (id, M) => { const [cx, cy, D] = CROP[id], w = M / D, h = w * 1.5;
  return `background-image:url(${artUrl(id)});background-size:${w}px ${h}px;background-position:${M / 2 - cx * w}px ${M / 2 - cy * h}px`; };
// The decks: yours first, then the starters. Clicking one opens it in place in the left column; clicking it again closes it.
const coverOf = list => list.find(id => C[id].rarity === 'legendary' && CROP[id]) || list.find(id => CROP[id]) || 'lion';
const all = [{ id: 'mine1', name: 'Colony copy', list: [...decks.find(d => d.id === 'colony_food_swarm').list], cover: 'queen_honoria', own: true },
  ...decks.map(d => ({ ...d, list: [...d.list], cover: coverOf(d.list) }))];
const CAP = { legendary: 4, rare: 8 };
// Copies as dots: filled for the copies in the deck; with `max`, hollow for the ones still allowed.
const pips = (n, max = n) => Array.from({ length: max }, (_, i) => `<i class="${i < n ? 'on' : ''}"></i>`).join('');
const ICON = {
  back: '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
  copy: '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>',
  trash: '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>' };
let toastT;
const toast = t => { const e = document.getElementById('toast2'); e.textContent = t; e.style.opacity = 1; clearTimeout(toastT); toastT = setTimeout(() => e.style.opacity = 0, 2200); };
// Deck codes: readable lines for people and agents, then one compact line the game reads. Import takes either.
const byStr = list => Object.entries(list.reduce((o, id) => (o[id] = (o[id] || 0) + 1, o), {})).sort((a, b) => RANK[C[a[0]].rarity] - RANK[C[b[0]].rarity] || sv(C[a[0]]) - sv(C[b[0]]));
const deckCode = d => [`### ${d.name}`, ...byStr(d.list).map(([id, n]) => `# ${n}x (${C[id].str}) ${C[id].name}`), '#', 'AK1:' + btoa(byStr(d.list).map(([id, n]) => id + '.' + n).join(',')).replace(/=+$/, '')].join('\n');
function parseCode(t) {
  const m = t.match(/AK1:([A-Za-z0-9+/]+)/); let list = [];
  if (m) { try { atob(m[1]).split(',').forEach(x => { const [id, n] = x.split('.'); if (C[id]) for (let i = 0; i < +n; i++) list.push(id); }); } catch { } }
  if (!list.length) { const byName = Object.fromEntries(Object.values(C).map(c => [c.name.toLowerCase(), c.id]));
    for (const line of t.split('\n')) { const q = line.match(/(\d+)\s*x\s*(?:\(\S+\)\s*)?(.+)$/i); const id = q && byName[q[2].trim().toLowerCase()]; if (id) for (let i = 0; i < +q[1]; i++) list.push(id); } }
  const name = (t.match(/^###\s*(.+)$/m) || [])[1];
  return list.length ? { name: (name || 'Imported deck').trim(), list } : null;
}
// Editing a starter makes your copy of it first; the starter never changes.
function editable() { let d = all.find(x => x.id === st.open); if (!d || d.own) return d;
  const copy = { id: 'm' + Date.now(), name: d.name + ' copy', list: [...d.list], cover: d.cover, own: true };
  all.splice(all.filter(x => x.own).length, 0, copy); st.open = copy.id; toast(`Editing your copy: ${copy.name}`); return copy; }
const st = { open: 'mine1', family: null, rar: null, str: '' };
const familyCount = list => { const t = {}; list.forEach(id => C[id].tags.forEach(x => { if (FAMILIES.some(y => y[0] === x)) t[x] = (t[x] || 0) + 1; })); return Object.entries(t).sort((a, b) => b[1] - a[1]); };
function render() {
  const keep = [...document.querySelectorAll('.decks, .cgrid')].map(e => e.scrollTop);
  const open = all.find(d => d.id === st.open), counts = open ? open.list.reduce((o, id) => (o[id] = (o[id] || 0) + 1, o), {}) : {};
  const shown = cards.filter(c => (!st.family || c.tags.includes(st.family)) && (!st.rar || c.rarity === st.rar) && (st.str === '' || String(c.str) === st.str) && (!st.q || (c.name + ' ' + c.text + ' ' + c.tags.join(' ')).toLowerCase().includes(st.q.toLowerCase())))
    .sort((a, b) => sv(a) - sv(b) || RANK[a.rarity] - RANK[b.rarity] || a.name.localeCompare(b.name));
  const grid = '<div class="crow">' + shown.map(c => { const n = counts[c.id] || 0, max = open && n >= (c.copies || LIMIT[c.rarity]);
    return `<div class="tl${max ? ' max' : ''}" data-card="${c.id}">${cardHTML(c, { cls: 'compact' })}${n && c.rarity !== 'legendary' ? `<span class="pips">${pips(n, c.copies || LIMIT[c.rarity])}</span>` : ''}</div>`; }).join('') + '</div>';
  const tabs = `<div class="tab all${st.family ? '' : ' on'}" data-t="" data-tip="All families"><div class="med mosaic">${['lion', 'gray_wolf', 'eagle', 'elephant'].map(id => `<i style="${med(id, 19)}"></i>`).join('')}</div></div>` + FAMILIES.map(([t, id]) => `<div class="tab${st.family === t ? ' on' : ''}" data-t="${t}" data-tip="${t}"><div class="med" style="${med(id, 40)}"></div></div>`).join('');
  const seg = (k, o) => '<span class="seg">' + o.map(([v, l]) => `<span class="${(st[k] || '') === v ? 'on' : ''}" data-k="${k}" data-v="${v}">${l}</span>`).join('') + '</span>';
  const strip = id => `<div class="st" data-card="${id}"><div class="art" style="background-image:url(${artUrl(id)})"></div><span class="s">${C[id].str}</span><span class="n">${C[id].name}</span><span class="x">${C[id].rarity === 'legendary' ? '' : pips(counts[id])}</span></div>`;
  const byR = r => Object.keys(counts).filter(id => C[id].rarity === r).sort((a, b) => sv(C[a]) - sv(C[b])).map(strip).join('');
  const inR = r => open.list.filter(id => C[id].rarity === r).length;
  const head = (label, n, cap) => `<h4 class="rh"><span>${label}</span><span class="${cap && n >= cap ? 'full' : ''}">${n}${cap ? ' / ' + cap : ''}</span></h4>`;
  const body = d => `<div class="dbody">
      ${familyCount(d.list).length > 1 ? `<div class="families">${familyCount(d.list).map(([t, n]) => `<div><div class="med" style="${med(FAMILIES.find(x => x[0] === t)[1], 26)}"></div>${n}</div>`).join('')}</div>` : ''}
      ${head('Legendary', inR('legendary'), 4)}${byR('legendary')}${head('Rare', inR('rare'), 8)}${byR('rare')}${head('Common', inR('common'))}${byR('common')}
      <div class="pf"><div class="play">Play this deck</div></div></div>`;
  const tile = d => (d.id === st.open
    ? `<div class="dtile on" data-d="${d.id}" style="background-image:url(${artUrl(d.cover)})"><b${d.own ? ' class="nm-edit" title="Rename"' : ''}>${d.name}</b>${d.list.length === 30 ? '' : `<em>${d.list.length}<i> / 30</i></em>`}<div class="tacts"><button class="ic" id="dcopy" data-tip="Copy deck code">${ICON.copy}</button>${d.own ? `<button class="ic del" id="ddel" data-tip="Delete deck">${ICON.trash}</button>` : ''}</div></div>`
    : `<div class="dtile" data-d="${d.id}" style="background-image:url(${artUrl(d.cover)})"><b>${d.name}</b><span>${familyCount(d.list).slice(0, 2).map(([x, n]) => n + ' ' + x).join(' · ')}</span></div>`) + (d.id === st.open ? body(d) : '');
  const side = `<div class="decks">${all.filter(d => d.own).map(tile).join('')}<div class="dsep"></div>${all.filter(d => !d.own).map(tile).join('')}</div>`;
  document.getElementById('gb').innerHTML = `<div class="side">${side}<div class="sfoot"><button class="backbtn" id="back">${ICON.back}<span>Back</span></button></div></div><div class="bar"><div class="tabs">${tabs}</div><span class="gap"></span>
      <select class="strsel" id="strsel"><option value="">Any strength</option>${[...new Set(cards.map(c => String(c.str)))].sort((a, b) => (a === '*' ? -1 : +a) - (b === '*' ? -1 : +b)).map(v => `<option value="${v}"${st.str === v ? ' selected' : ''}>${v === '*' ? 'Variable' : 'Strength ' + v}</option>`).join('')}</select><select class="strsel" id="rarsel">${[['', 'Any rarity'], ['legendary', 'Legendary'], ['rare', 'Rare'], ['common', 'Common']].map(([v, l]) => `<option value="${v}"${(st.rar || '') === v ? ' selected' : ''}>${l}</option>`).join('')}</select><input class="search" id="q" placeholder="Search" value="${(st.q || '').replace(/"/g, '&quot;')}"></div>
    <div class="cgrid">${grid}</div>`;
  document.querySelectorAll('.decks, .cgrid').forEach((e, i) => { if (keep[i] != null) e.scrollTop = keep[i]; });
  document.getElementById('back').onclick = goBack;
  document.getElementById('strsel').onchange = e => { st.str = e.target.value; render(); };
  document.getElementById('rarsel').onchange = e => { st.rar = e.target.value || null; render(); };
  const q = document.getElementById('q'); q.oninput = () => { st.q = q.value; const at = q.selectionStart; render(); const n = document.getElementById('q'); n.focus(); n.setSelectionRange(at, at); };
  document.querySelectorAll('[data-t]').forEach(e => e.onclick = () => { const t = e.dataset.t || null; st.family = st.family === t ? null : t; render(); });   // the selected family again clears it
  document.querySelectorAll('[data-k]').forEach(e => e.onclick = () => { st[e.dataset.k] = e.dataset.v || null; render(); });
  document.querySelectorAll('[data-d]').forEach(e => e.onclick = ev => { if (ev.target.classList.contains('nm-edit') || ev.target.closest('.tacts')) return; st.open = st.open === e.dataset.d ? null : e.dataset.d; render(); });
  const nm = document.querySelector('.nm-edit'); if (nm) nm.onclick = () => { const d = all.find(x => x.id === st.open), inp = document.createElement('input'); inp.className = 'nm-in'; inp.value = d.name;
    nm.replaceWith(inp); inp.focus(); inp.select(); const done = () => { d.name = inp.value.trim() || d.name; render(); }; inp.onblur = done; inp.onkeydown = k => { if (k.key === 'Enter') inp.blur(); if (k.key === 'Escape') { inp.value = d.name; inp.blur(); } }; };
  const cp = document.getElementById('dcopy'); if (cp) cp.onclick = () => { const code = deckCode(all.find(x => x.id === st.open)); navigator.clipboard.writeText(code).then(() => toast('Deck code copied'), () => toast('Copy failed')); window.__lastCode = code; };
  const del = document.getElementById('ddel'); if (del) del.onclick = ev => { ev.stopPropagation(); confirmDelete(all.find(x => x.id === st.open)); };
  // Click a grid card to add a copy, a deck strip to take one out.
  document.querySelectorAll('.cgrid [data-card]').forEach(e => e.onclick = () => { const c = C[e.dataset.card]; if (!st.open) return toast('Open a deck to add cards');
    const d0 = all.find(x => x.id === st.open), n = d0.list.filter(x => x === c.id).length, inR = d0.list.filter(x => C[x].rarity === c.rarity).length;
    if (d0.list.length >= 30 || n >= (c.copies || LIMIT[c.rarity]) || (CAP[c.rarity] && inR >= CAP[c.rarity])) return;
    editable().list.push(c.id); document.getElementById('pop').style.display = 'none'; render(); });
  document.querySelectorAll('.side [data-card]').forEach(e => e.onclick = () => { const d = editable(); d.list.splice(d.list.indexOf(e.dataset.card), 1); document.getElementById('pop').style.display = 'none'; render(); });
  const pop = document.getElementById('pop');
  document.querySelectorAll('.gb [data-card]').forEach(e => { e.onmouseenter = () => { const r = e.getBoundingClientRect(); pop.className = 'pop'; pop.innerHTML = cardHTML(C[e.dataset.card]); pop.style.display = 'flex';
    const w = pop.offsetWidth, h = pop.offsetHeight, edge = e.closest('.side') ? r.left : document.querySelector('.side').getBoundingClientRect().left;
    pop.style.left = (e.closest('.side') ? r.left - w - 10 : r.right + 10 + w > edge ? r.left - w - 10 : r.right + 10) + 'px'; pop.style.top = Math.max(8, Math.min(r.top - 40, innerHeight - h - 10)) + 'px'; };
    e.onmouseleave = () => pop.style.display = 'none'; });
}
// Paste a deck code anywhere on the screen: it becomes your deck, open.
document.addEventListener('paste', e => { if (e.target.tagName === 'INPUT') return; const d = parseCode(e.clipboardData.getData('text')); if (!d) return toast('That is not a deck code');
  const nd = { id: 'm' + Date.now(), name: d.name, list: d.list, cover: coverOf(d.list), own: true }; all.splice(all.filter(x => x.own).length, 0, nd); st.open = nd.id; render(); toast(`Imported ${nd.name}`); });
// Delete asks first, in a dialog over the screen: Cancel (or Escape, or a click outside) keeps the deck.
function confirmDelete(d) {
  const m = document.getElementById('modal');
  m.innerHTML = `<div class="dlg"><h3>Delete “${d.name.replace(/</g, '&lt;')}”?</h3><p>This can’t be undone. Copy its deck code first if you might want it back.</p>
    <div class="dbtns"><button class="cancel">Cancel</button><button class="danger">Delete deck</button></div></div>`;
  m.style.display = 'grid'; m.querySelector('.cancel').focus();
  const close = () => { m.style.display = 'none'; document.removeEventListener('keydown', esc); }, esc = e => { if (e.key === 'Escape') close(); };
  document.addEventListener('keydown', esc);
  m.onclick = e => { if (e.target === m) close(); };
  m.querySelector('.cancel').onclick = close;
  m.querySelector('.danger').onclick = () => { close(); const i = all.findIndex(x => x.id === d.id); all.splice(i, 1); st.open = null; render(); toast(`Deleted ${d.name}`); };
}
// Back to the menu: the docked button, or Escape when no dialog is open.
const goBack = () => { location.href = '/#/'; };
document.addEventListener('keydown', e => { if (e.key === 'Escape' && document.getElementById('modal').style.display !== 'grid' && e.target.tagName !== 'INPUT') goBack(); });
render();
</script></body></html>
