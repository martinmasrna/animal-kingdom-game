<!doctype html><html><head><meta charset="utf-8"><title>Card readability</title>
<link rel="stylesheet" href="/static/tokens.css"><link rel="stylesheet" href="/static/app.css"><link rel="stylesheet" href="/static/lab/card3.css">
<link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;600;800&family=Fira+Sans+Condensed:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
html, body { overflow: auto !important; margin: 0; height: auto; background: #15120f; color: #c9b48f; }
.bar2 { display: flex; gap: 8px; align-items: center; padding: 14px 28px 4px; } .bar2 .lbl { margin-right: 6px; }
.row { display: flex; gap: 22px; align-items: flex-start; padding: 14px 28px; }
.row .card3 { --w: 320px; }
.col { display: flex; flex-direction: column; gap: 8px; } .col h2 { font: 600 13px var(--font-text); color: #8a7a62; margin: 0; letter-spacing: .06em; text-transform: uppercase; }
.ref { width: 320px; height: 469px; overflow: hidden; position: relative; background: #fff; border-radius: 12px; }
.ref img { position: absolute; width: 592px; left: -136px; top: -66px; }
</style></head><body class="f-fira">
<div class="bar2"><span class="lbl">Rules font</span><span class="chip on" data-f="f-fira">Fira Sans Condensed</span><span class="chip" data-f="f-franklin">Libre Franklin</span><span class="chip" data-f="">Source Serif 4</span></div>
<div class="row" id="r1"></div><div class="row" id="r2"></div>
<script type="module">
import { cardHTML } from '/static/lab/card3.js';
const pool = await fetch('/api/pool').then(r => r.json()), C = Object.fromEntries(pool.cards.map(c => [c.id, c]));
const col = (h, inner, cls = '') => `<div class="col ${cls}"><h2>${h}</h2>${inner}</div>`;
document.getElementById('r1').innerHTML = col('Hearthstone, same width', '<div class="ref"><img src="/static/lab/_ref/hs.png"></div>') +
  col('Ours now', cardHTML(C.magpie), 's-granite') + col('Readability pass', cardHTML(C.magpie), 's-guide s-read') + col('&nbsp;', cardHTML(C.vesper), 's-guide s-read');
document.getElementById('r2').innerHTML = ['hyena', 'borealis', 'chameleon', 'scrooge'].filter(id => C[id]).map(id => col('&nbsp;', cardHTML(C[id]), 's-guide s-read')).join('');
document.querySelectorAll('[data-f]').forEach(e => e.onclick = () => { document.body.className = e.dataset.f; document.querySelectorAll('[data-f]').forEach(x => x.classList.toggle('on', x === e)); });
</script></body></html>
