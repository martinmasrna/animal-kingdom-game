<!doctype html><html><head><meta charset="utf-8"><title>Font Lab</title>
<link rel="stylesheet" href="/static/tokens.css"><link rel="stylesheet" href="/static/app.css">
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700;800&family=Fira+Sans:wght@400;600;700;800&family=Alegreya+Sans:wght@400;700;800&family=Nunito+Sans:opsz,wght@6..12,400;6..12,700;6..12,800&display=swap" rel="stylesheet">
<style>
html, body { overflow: auto; height: auto; }
body { margin: 0; padding: 18px 24px; background: #1a1208 url(/static/kit/sav_D4.webp) center / cover; }
.row { display: flex; gap: 14px; align-items: flex-start; margin-bottom: 26px; }
.row h3 { width: 150px; flex: none; margin: 8px 0 0; font: 600 14px system-ui; color: #f3e3c0; text-shadow: 0 1px 2px #000; }
.row .card { --w: 176px; }
.f2 .card .cname, .f2 .card .cstr, .f2 .card .ctext p, .f2 .card .ctext i { font-family: 'Source Sans 3', sans-serif; }
.f3 .card .cname, .f3 .card .cstr, .f3 .card .ctext p, .f3 .card .ctext i { font-family: 'Fira Sans', sans-serif; }
.f4 .card .cname, .f4 .card .cstr, .f4 .card .ctext p, .f4 .card .ctext i { font-family: 'Alegreya Sans', sans-serif; }
.f5 .card .cname, .f5 .card .cstr, .f5 .card .ctext p, .f5 .card .ctext i { font-family: 'Nunito Sans', sans-serif; }
.f2 .card .ctext p, .f3 .card .ctext p, .f5 .card .ctext p { font-size: .88em; line-height: 1.16; }
.f4 .card .ctext p { font-size: .95em; line-height: 1.12; }
</style></head><body><div id="rows"></div>
<script type="module">
import { cardHTML } from '/static/card.js';
const pool = await fetch('/api/pool').then(r => r.json()), C = Object.fromEntries(pool.cards.map(c => [c.id, c]));
const IDS = ['cougar', 'princess_lea', 'snow_leopard', 'caracal', 'king_theron', 'elephant'];
const F = [['f1', '1 Source Serif (now)'], ['f2', '2 Source Sans'], ['f3', '3 Fira Sans'], ['f4', '4 Alegreya Sans'], ['f5', '5 Nunito Sans']];
document.getElementById('rows').innerHTML = F.map(([k, n]) => `<div class="row ${k}"><h3>${n}</h3>${IDS.map(id => cardHTML(C[id])).join('')}</div>`).join('');
</script></body></html>
