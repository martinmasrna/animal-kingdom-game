<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hero HS</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* one screen: history left; heroes, boards and hand in the middle; mana, deck and End turn; both deck lists right */
:root {
  --bg: #2a3340; --table: #3b4a5c; --table2: #34424f; --ink: #1b1b1b; --paper: #fbf7ee;
  --mana: #3d8bf2; --gold: #f2b632; --ok: #5fdc6f; --en: #45d49a; --en2: #1f9468;
  --me: #3d7fd6; --me2: #2a5ea8; --him: #8a62b8; --him2: #5d3f86; --spell: #e0673f; --spell2: #b8452a;
  --atk: #f2b632; --hp: #d8432e;
  --hP: #e8622c; --hP2: #9c2d10; --hA: #e9d9a8; --hA2: #b08a3a; --hM: #5a5fd6; --hM2: #2c2f86;
  --cardw: 108px; --cardh: 146px; --mw: 86px; --mh: 104px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: #fff; overflow: hidden; }
body { font: 15px/1.25 -apple-system, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
button { font: inherit; cursor: pointer; color: inherit; }

#game {
  position: relative; height: 100%; max-width: 1512px; margin: 0 auto;
  display: grid; grid-template-columns: 160px minmax(0, 1fr) 210px 190px;
  grid-template-rows: 40px auto minmax(0, 1fr) minmax(0, 1fr) auto auto; gap: 6px 18px;
  padding: 0 12px 6px;
}
#opphand { grid-row: 1; grid-column: 2; display: flex; justify-content: center; align-items: flex-start; padding-top: 6px; }
.back { width: 24px; height: 34px; border-radius: 4px; background: linear-gradient(135deg, var(--him), var(--him2)); border: 2px solid #c9b6e6; margin-left: -6px; box-shadow: 0 2px 4px rgba(0,0,0,.4);
  display: flex; align-items: center; justify-content: center; font-style: normal; font-weight: 900; font-size: 12px; }
.back:first-child { margin-left: 0; }
.back.herob { border-color: var(--gold); }
.back.herob.hP { background: linear-gradient(135deg, var(--hP), var(--hP2)); } .back.herob.hA { background: linear-gradient(135deg, var(--hA), var(--hA2)); } .back.herob.hM { background: linear-gradient(135deg, var(--hM), var(--hM2)); }
.back.fireb { background: linear-gradient(160deg, #ffb347, #d8401a); border-color: #ffd39a; }
.back.coinb { border-radius: 50%; width: 26px; height: 26px; margin-top: 4px; background: radial-gradient(circle at 35% 30%, #ffe08a, #d08a12); border-color: #fff3c4; }
#menu { position: absolute; top: 6px; right: 226px; z-index: 5; display: flex; gap: 12px; align-items: center; }
#menu button { min-height: 32px; padding: 4px 12px; border-radius: 6px; border: 1px solid #5b6a7a; background: rgba(0,0,0,.2); color: #dfe5eb; font-size: 14px; }
.tally { display: flex; gap: 6px; font-weight: 900; font-size: 18px; }
.tally b { min-width: 30px; height: 30px; padding: 0 8px; border-radius: 15px; display: flex; align-items: center; justify-content: center; }
.tally .t0 { background: var(--me2); } .tally .t1 { background: var(--him2); }

#hero1 { grid-row: 2; grid-column: 2; } #board1 { grid-row: 3; grid-column: 2; } #board0 { grid-row: 4; grid-column: 2; } #hero0 { grid-row: 5; grid-column: 2; }
#history { grid-row: 2 / 6; grid-column: 1; }
#res1 { grid-row: 2; grid-column: 3; } #turnbox { grid-row: 3 / 5; grid-column: 3; align-self: center; } #res0 { grid-row: 5; grid-column: 3; }
#track1 { grid-row: 1 / 4; grid-column: 4; padding-top: 6px; } #track0 { grid-row: 4 / 6; grid-column: 4; }
#hand { grid-row: 6; grid-column: 1 / -1; }

/* ---------------- heroes: energy bar, portrait, power */
.herorow { display: flex; justify-content: center; align-items: center; gap: 18px; }
.hero { position: relative; width: 88px; height: 88px; border-radius: 50%; border: 4px solid #fff; box-shadow: 0 4px 10px rgba(0,0,0,.45); flex: 0 0 auto; display: flex; align-items: center; justify-content: center; }
.hero.s0 { border-color: #9cc4f5; } .hero.s1 { border-color: #d2b8f0; }
.hP { --h1: var(--hP); --h2: var(--hP2); } .hA { --h1: var(--hA); --h2: var(--hA2); } .hM { --h1: var(--hM); --h2: var(--hM2); }
.hero { background: radial-gradient(circle at 35% 30%, var(--h1), var(--h2)); }
.hero .face, .htile .face, .otile .face { font-size: 40px; line-height: 1; filter: drop-shadow(0 2px 3px rgba(0,0,0,.4)); }
.hero.tgt { cursor: pointer; box-shadow: 0 0 0 4px var(--gold), 0 0 20px rgba(242,182,50,.8); animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 0 6px var(--gold), 0 0 26px rgba(242,182,50,.9); } }
.passive { display: none; position: absolute; z-index: 30; left: 50%; transform: translateX(-50%); width: 230px; padding: 8px 10px; border-radius: 8px; background: #141a22; border: 1px solid #5b6a7a;
  color: #e8edf2; font-size: 13px; font-weight: 500; line-height: 1.3; text-align: left; box-shadow: 0 6px 18px rgba(0,0,0,.5); pointer-events: none; }
.passive b { display: block; font-weight: 800; }
.hero.s1 .passive, .power.s1 .passive { top: calc(100% + 8px); } .hero.s0 .passive, .power .passive { bottom: calc(100% + 8px); }
#hero1 .passive { top: calc(100% + 8px); bottom: auto; }
.hero:hover .passive, .power:hover .passive { display: block; }
.ebar { display: flex; align-items: center; gap: 6px; width: 250px; }
.ebar .end { font-weight: 900; font-size: 13px; width: 22px; text-align: center; flex: 0 0 auto; }
.ebar .end.lo { color: #ff8a70; } .ebar .end.hi { color: var(--gold); }
.ebar .track { position: relative; flex: 1; height: 12px; border-radius: 6px; background: #1d2a38; box-shadow: inset 0 1px 3px rgba(0,0,0,.6);
  background-image: linear-gradient(90deg, rgba(216,67,46,.55) 0 16%, transparent 16% 84%, rgba(242,182,50,.45) 84%); }
.ebar .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 6px; background: linear-gradient(90deg, var(--en2), var(--en)); transition: width .4s; }
.ebar .start { position: absolute; top: -3px; bottom: -3px; width: 2px; margin-left: -1px; background: rgba(255,255,255,.35); }
.ebar .knob { position: absolute; top: 50%; transform: translate(-50%, -50%); min-width: 40px; height: 40px; padding: 0 4px; border-radius: 20px; border: 3px solid #fff;
  background: radial-gradient(circle at 35% 30%, #7ff0c0, var(--en2)); display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 19px; text-shadow: 0 1px 2px rgba(0,0,0,.6); transition: left .4s; }
.ebar.low .knob { background: radial-gradient(circle at 35% 30%, #ff7a5c, #c62d1c); }
.ebar.high .knob { background: radial-gradient(circle at 35% 30%, #ffe08a, #c98a0e); color: #2a1d00; text-shadow: none; }
.power { position: relative; width: 62px; height: 62px; border-radius: 50%; border: 3px solid #c9d3de; padding: 0; flex: 0 0 auto;
  background: radial-gradient(circle at 35% 30%, var(--h1), var(--h2)); box-shadow: 0 3px 8px rgba(0,0,0,.45); display: flex; align-items: center; justify-content: center; }
.power .cgem { top: -8px; left: -8px; width: 26px; height: 26px; font-size: 14px; }
.power .pg { font-weight: 900; font-size: 22px; text-shadow: 0 1px 3px rgba(0,0,0,.6); }
.power.hA .pg { color: #3a2a00; text-shadow: none; }
.power.ok { border-color: var(--ok); box-shadow: 0 0 0 2px var(--ok), 0 0 14px rgba(95,220,111,.8); }
.power.sel { border-color: var(--gold); box-shadow: 0 0 0 3px var(--gold), 0 0 18px rgba(242,182,50,.9); transform: translateY(-4px); }
.power.used { filter: grayscale(.9) brightness(.6); }
.power:disabled { cursor: default; }
.power .pips { position: absolute; bottom: -9px; left: 50%; transform: translateX(-50%); display: flex; gap: 3px; }
.power .pips i { width: 9px; height: 9px; border-radius: 50%; background: #1d2a38; border: 1px solid #c9d3de; }
.power .pips i.on { background: #ffb347; }

/* ---------------- boards and minions */
.board { display: flex; justify-content: center; align-items: center; gap: 24px; border-radius: 16px; background: radial-gradient(ellipse at center, var(--table), var(--table2)); box-shadow: inset 0 0 24px rgba(0,0,0,.3); min-height: 0; }
#board1 { border-bottom-left-radius: 0; border-bottom-right-radius: 0; } #board0 { border-top-left-radius: 0; border-top-right-radius: 0; }
.minion { position: relative; width: var(--mw); height: var(--mh); border-radius: 14px; border: 3px solid rgba(255,255,255,.85); box-shadow: 0 4px 8px rgba(0,0,0,.45); flex: 0 0 auto; transition: transform .12s; }
.minion.s0 { background: linear-gradient(160deg, var(--me), var(--me2)); } .minion.s1 { background: linear-gradient(160deg, var(--him), var(--him2)); }
.minion.taunt { border-radius: 8px 8px 40px 40px; border: 5px solid #c8ced6; outline: 3px solid #69737e; }
.minion.herocard { border-color: var(--gold); background: linear-gradient(160deg, var(--h1), var(--h2)); }
.minion.herocard.s0 { box-shadow: 0 0 0 3px var(--me), 0 4px 8px rgba(0,0,0,.45); } .minion.herocard.s1 { box-shadow: 0 0 0 3px var(--him), 0 4px 8px rgba(0,0,0,.45); }
.mg { position: absolute; top: -11px; left: 50%; transform: translateX(-50%); min-width: 24px; height: 24px; padding: 0 4px; border-radius: 12px; background: #1d2a38; border: 2px solid #fff;
  display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 12px; }
.mg.e { background: var(--en2); } .mg.gold { background: var(--gold); color: #2a1d00; }
.stat { position: absolute; bottom: -10px; width: 34px; height: 34px; border-radius: 50%; border: 2px solid #fff; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 17px; text-shadow: 0 1px 2px rgba(0,0,0,.5); }
.stat.a { left: -8px; background: radial-gradient(circle at 35% 30%, #ffd36b, #d08a12); color: #2a1d00; text-shadow: none; }
.stat.h { right: -8px; background: radial-gradient(circle at 35% 30%, #ff7a5c, #c62d1c); }
.stat.h.hurt { background: radial-gradient(circle at 35% 30%, #ffb19e, #e0553a); }
.stat.up { border-color: var(--ok); box-shadow: 0 0 6px var(--ok); }
.minion.sleep { filter: saturate(.55) brightness(.85); }
.minion.can { cursor: pointer; box-shadow: 0 0 0 3px var(--ok), 0 0 16px rgba(95,220,111,.8); }
.minion.sel { transform: translateY(-8px); box-shadow: 0 0 0 4px var(--gold), 0 0 20px rgba(242,182,50,.9); }
.minion.tgt { cursor: pointer; box-shadow: 0 0 0 4px var(--gold), 0 0 18px rgba(242,182,50,.85); animation: pulse 1.2s ease-in-out infinite; }
.minion.new { animation: pop .4s ease-out; }
.minion.buffed { animation: buffed .5s ease-out; }
@keyframes pop { 0% { transform: scale(.3); opacity: 0; } 70% { transform: scale(1.1); opacity: 1; } 100% { transform: scale(1); } }
@keyframes buffed { 40% { transform: scale(1.12); filter: brightness(1.4); } }
.shake { animation: shake .35s; }
@keyframes shake { 0%,100% { transform: translateX(0); } 20% { transform: translateX(-7px); } 40% { transform: translateX(6px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(2px); } }

/* ---------------- mana, deck, turn */
.res { display: flex; align-items: center; gap: 10px; align-self: center; }
.mana { display: flex; align-items: center; gap: 2px; flex-wrap: nowrap; }
.gemc { width: 11px; height: 16px; clip-path: polygon(50% 0, 100% 30%, 100% 70%, 50% 100%, 0 70%, 0 30%); background: #1d2a38; }
.gemc.on { background: linear-gradient(180deg, #8cc2ff, var(--mana)); }
.gemc.off { opacity: .4; }
.manatxt { font-weight: 800; font-size: 17px; margin-right: 4px; color: #bcd9ff; min-width: 38px; }
.pile { width: 32px; height: 44px; border-radius: 5px; border: 2px solid #c9d3de; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 15px; flex: 0 0 auto;
  box-shadow: 2px 2px 0 rgba(0,0,0,.3), 4px 4px 0 rgba(0,0,0,.2); }
.pile.s0 { background: linear-gradient(135deg, var(--me), var(--me2)); } .pile.s1 { background: linear-gradient(135deg, var(--him), var(--him2)); border-color: #c9b6e6; }
#endturn { width: 140px; min-height: 54px; border-radius: 10px; border: 0; font-weight: 800; font-size: 17px; background: var(--gold); color: #2a1d00; box-shadow: 0 3px 0 #a8770d; }
#endturn.done { background: var(--ok); box-shadow: 0 3px 0 #2c8a3a, 0 0 14px rgba(95,220,111,.7); color: #08300f; }
#endturn:disabled { background: #56616d; color: #8e98a3; box-shadow: none; cursor: default; }

/* ---------------- deck lists */
.decktrack { min-height: 0; overflow: hidden; display: flex; flex-direction: column; }
#track0 { justify-content: flex-end; }
.tlist { display: flex; flex-direction: column; gap: 1px; border-left: 4px solid; padding-left: 6px; }
.tlist.s0 { border-color: var(--me); } .tlist.s1 { border-color: var(--him); }
.trow { display: flex; align-items: center; gap: 6px; height: 18px; padding: 0 6px 0 0; border-radius: 4px; background: rgba(0,0,0,.25); font-size: 12.5px; font-weight: 700; border: 0; text-align: left; flex: 0 0 auto; }
.trow .tg { width: 19px; height: 19px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #8cc2ff, #1f62c4); display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 11.5px; flex: 0 0 auto; }
.trow .tn { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.trow .tk { color: var(--gold); font-weight: 900; }
.trow.Spell .tn { color: #ffb08f; }
.trow.thero { background: linear-gradient(90deg, var(--h2), rgba(0,0,0,.25)); }
.trow.thero .tn { color: #fff; }
.trow.gone { opacity: .32; }

/* ---------------- history */
#history { display: flex; flex-direction: column; justify-content: center; gap: 4px; overflow: hidden; }
.hist { display: flex; align-items: center; gap: 8px; padding: 3px 6px; border-radius: 6px; background: rgba(0,0,0,.22); border-left: 4px solid; }
.hist.s0 { border-color: var(--me); } .hist.s1 { border-color: var(--him); }
.chip { min-width: 34px; height: 28px; padding: 0 4px; border-radius: 5px; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 13px; flex: 0 0 auto; }
.chip.Minion.s0, .chip.Attack.s0 { background: linear-gradient(160deg, var(--me), var(--me2)); } .chip.Minion.s1, .chip.Attack.s1 { background: linear-gradient(160deg, var(--him), var(--him2)); }
.chip.Minion.herocard { background: linear-gradient(160deg, var(--h1), var(--h2)); box-shadow: inset 0 0 0 2px var(--gold); }
.chip.Spell { background: linear-gradient(160deg, #f08a5d, var(--spell2)); }
.chip.Spell.fire { background: linear-gradient(160deg, #ffb347, #d8401a); }
.chip.Spell.gainc { background: linear-gradient(160deg, var(--en), var(--en2)); }
.chip.Power { border-radius: 50%; min-width: 28px; background: radial-gradient(circle at 35% 30%, var(--h1), var(--h2)); font-size: 15px; }
.chip.Coin { background: radial-gradient(circle at 35% 30%, #ffe08a, #d08a12); color: #2a1d00; border-radius: 50%; min-width: 28px; }
.chip.Attack::before { content: '⚔'; margin-right: 3px; font-size: 12px; }
.ho { font-weight: 800; font-size: 14px; white-space: nowrap; }
.ho.dmg { color: #ff8a70; } .ho.kill { color: #ff6a4d; } .ho.face { color: #ffb36b; } .ho.gain { color: var(--en); }

/* ---------------- cards */
.card { position: relative; width: var(--cardw); height: var(--cardh); flex: 0 0 auto; border-radius: 10px; padding: 0; text-align: left;
  background: var(--paper); color: var(--ink); border: 3px solid #d5c39f; box-shadow: 0 4px 8px rgba(0,0,0,.4); display: flex; flex-direction: column; }
.card .art { margin: 4px 4px 0; border-radius: 6px; flex: 0 0 52%; display: flex; align-items: center; justify-content: center; color: #fff; position: relative; }
.card.Minion .art { background: linear-gradient(160deg, var(--me), var(--me2)); }
.card.Minion.s1 .art { background: linear-gradient(160deg, var(--him), var(--him2)); }
.card.Spell .art { background: linear-gradient(160deg, #f08a5d, var(--spell2)); }
.card.Spell.fire .art { background: radial-gradient(circle at 50% 70%, #ffe08a, #ff8a2a 45%, #c42f12); }
.card.Spell.gainc .art { background: linear-gradient(160deg, var(--en), var(--en2)); }
.cardic { display: inline-block; width: .5em; height: .7em; margin-left: 4px; border-radius: 3px; background: #fff; box-shadow: 3px -3px 0 rgba(255,255,255,.55); align-self: center; }
.card.Coin .art { background: radial-gradient(circle at 35% 30%, #ffe08a, #d08a12); color: #2a1d00; }
.card.herocard { border-color: var(--gold); background: linear-gradient(180deg, #fff6d8, var(--paper)); box-shadow: 0 0 0 2px #a8770d, 0 4px 8px rgba(0,0,0,.4); }
.card.herocard .art, .card.Power .art { background: radial-gradient(circle at 35% 30%, var(--h1), var(--h2)); }
.card .shield { position: absolute; left: 50%; top: 50%; width: 34px; height: 40px; transform: translate(-50%, -50%); background: #c8ced6; border: 3px solid #69737e; border-radius: 6px 6px 18px 18px; opacity: .9; }
.card .big { font-size: calc(var(--cardw) * .32); font-weight: 900; text-shadow: 0 2px 3px rgba(0,0,0,.35); line-height: 1; display: flex; align-items: baseline; }
.card .big small { font-size: .42em; margin-left: 2px; opacity: .9; }
.card .big.e { color: #d9ffe9; }
.card.Coin .big { text-shadow: none; }
.card .stat { bottom: -12px; width: 30px; height: 30px; font-size: 15px; }
.card .nm { font-weight: 800; font-size: calc(var(--cardw) * .105); padding: 4px 7px 0; line-height: 1.1; }
.card.Minion .nm { padding-top: 14px; }
.card .tx { font-size: calc(var(--cardw) * .105); padding: 2px 7px; color: #3a352c; line-height: 1.15; }
.card.Minion .nm + .tx { padding-top: 1px; }
.card.Minion .art + .tx { padding-top: 15px; }
.cgem { position: absolute; top: -9px; left: -9px; z-index: 2; width: 30px; height: 30px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #8cc2ff, #1f62c4); border: 2px solid #fff; color: #fff;
  display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 16px; text-shadow: 0 1px 2px rgba(0,0,0,.5); }
#hand { display: flex; justify-content: center; align-items: flex-end; gap: 10px; padding: 12px 0 2px; min-height: calc(var(--cardh) + 16px); }
#hand .card { transition: transform .12s, box-shadow .12s; }
#hand .card + .card { margin-left: calc(-1 * var(--squeeze, 0px)); }
#hand .card.ok { border-color: var(--ok); box-shadow: 0 0 12px rgba(95,220,111,.7), 0 4px 8px rgba(0,0,0,.4); }
#hand .card.ok:hover { transform: translateY(-8px); z-index: 3; }
#hand .card.sel { transform: translateY(-16px); border-color: var(--gold); box-shadow: 0 0 0 3px rgba(242,182,50,.6), 0 0 18px rgba(242,182,50,.8), 0 6px 12px rgba(0,0,0,.5); z-index: 3; }
#hand .card:disabled { cursor: default; }
#hand .card.no { filter: brightness(.62) saturate(.6); }
#hand .card.drawn { animation: drawin .45s ease-out; }
@keyframes drawin { from { transform: translateY(-60px) scale(.6); opacity: 0; } }

/* ---------------- spotlight, peek, floaters, banner, game over */
#spot { position: absolute; z-index: 20; pointer-events: none; }
#spot .card { --cardw: 150px; --cardh: 202px; position: absolute; left: calc(var(--cardw) / -2); top: calc(var(--cardh) / -2); box-shadow: 0 14px 40px rgba(0,0,0,.6); animation: fromtop .32s cubic-bezier(.2,.8,.3,1.1); }
#spot .card.out { animation: spotout .2s ease-in forwards; }
#peek { position: absolute; z-index: 22; pointer-events: none; }
#peek .card { --cardw: 128px; --cardh: 172px; box-shadow: 0 10px 30px rgba(0,0,0,.6); }
@keyframes fromtop { from { transform: translateY(-240px) scale(.4); opacity: .2; } }
@keyframes spotout { to { transform: scale(.5); opacity: 0; } }
.float { position: absolute; z-index: 30; pointer-events: none; font-weight: 900; font-size: 40px; color: #ff6a4d; text-shadow: 0 2px 0 rgba(0,0,0,.5), 0 0 10px rgba(0,0,0,.4); transform: translate(-50%, -50%); animation: floatup 1.1s ease-out forwards; white-space: nowrap; }
.float.g { color: var(--en); }
@keyframes floatup { 0% { opacity: 0; transform: translate(-50%, -30%) scale(.6); } 15% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); } 70% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -110%) scale(1); } }
.ghost { position: absolute; z-index: 15; pointer-events: none; animation: die .45s ease-in forwards; }
@keyframes die { to { transform: scale(.4) rotate(-8deg); opacity: 0; } }
#banner { position: absolute; left: 0; right: 0; top: 45%; transform: translateY(-50%); text-align: center; z-index: 25; pointer-events: none; font-size: 44px; font-weight: 900; opacity: 0; text-shadow: 0 3px 12px rgba(0,0,0,.7); }
#banner.show { animation: banner 1s ease-out; }
@keyframes banner { 0% { opacity: 0; transform: translateY(-50%) scale(.8); } 20% { opacity: 1; transform: translateY(-50%) scale(1); } 75% { opacity: 1; } 100% { opacity: 0; } }
#over { position: absolute; inset: 0; z-index: 40; display: none; align-items: center; justify-content: center; flex-direction: column; gap: 18px; background: rgba(10,14,20,.6); }

<body>
<div id="game">
  <div id="opphand"></div>
  <div id="menu"><span id="tally"></span><button id="todecks">Decks</button></div>
  <div id="history"></div>

  <div id="board0" class="board"></div>

<script>
(function () {
"use strict";
// ---- src/engine.js
// Hero HS: Vanilla HS's rules (mana 1 to 10, draw 1 a turn, opening hands 3 and 4 plus the
// Coin, 7 minions a side, attack from the turn after, fatigue) with energy instead of health
// (start 25, lose at 0, win at 50), a 30-card shared pool and three heroes. See RULES.md.
// Pure from the outside: transitions clone the state.

const START = 25, WIN = 50, MAX_MANA = 10, BOARD = 7, TURN_LIMIT = 100, DECK_SIZE = 20, COPIES = 2;

const M = (id, cost, atk, hp, x = {}) => ({ id, kind: 'Minion', cost, atk, hp, ...x });
const S = (id, cost, x) => ({ id, kind: 'Spell', cost, ...x });
// The pool, in RULES.md's order.
const POOL = [
  M('m1a', 1, 2, 1), M('m1b', 1, 1, 2), M('m2a', 2, 3, 2), M('m2b', 2, 2, 3), M('m3', 3, 3, 4), M('m4', 4, 4, 5), M('m6', 6, 6, 7), M('m7', 7, 7, 7),
  M('t3', 3, 2, 4, { taunt: 1 }), M('t4', 4, 3, 5, { taunt: 1 }), M('t6', 6, 5, 6, { taunt: 1 }),
  M('r3', 3, 3, 1, { rush: 1 }),
  M('d2a', 2, 1, 1, { bc: { draw: 1 } }), M('d2b', 2, 2, 1, { dies: { draw: 1 } }), M('d5', 5, 4, 4, { bc: { draw: 1 } }),
  M('h1', 1, 1, 1, { bc: { dmg: 1 } }), M('h4', 4, 2, 4, { bc: { dmg: 2 } }),
  M('g3', 3, 3, 3, { bc: { gain: 3 } }), M('e3', 3, 2, 3, { eot: { gain: 1 } }), M('g2', 2, 1, 3, { sot: { atk: 1 } }),
  S('s1', 1, { dmg: 2 }), S('s2', 2, { dmg: 3 }), S('s4', 4, { dmg: 6 }),
  S('a2', 2, { area: 1 }), S('a4', 4, { area: 2 }), S('a7', 7, { area: 4 }),
  S('c3', 3, { draw: 2 }), S('k5', 5, { destroy: 1 }),
  S('b2', 2, { buff: 2 }), S('j3', 3, { gain: 5 }),
];
const CARDS = { COIN: { id: 'COIN', kind: 'Coin', cost: 0 } };
for (const c of POOL) CARDS[c.id] = c;
// Hero cards; the Mage's becomes HM8 while its owner's deck is empty.
CARDS.HP = M('HP', 3, 3, 3, { bc: { upFire: 1 }, hero: 'P' });
CARDS.HA = M('HA', 6, 6, 6, { sot: { others: 1 }, hero: 'A' });
CARDS.HM = M('HM', 4, 4, 6, { hero: 'M' });
CARDS.HM8 = M('HM8', 8, 8, 8, { bc: { gain: 10 }, hero: 'M' });
// The Fireball ladder: level 0..3 (Baby, Young, Adult, Elder). An upgraded Fireball keeps its cost,
// so a Fireball is a (level, cost) pair: id F<level>_<cost>.
const FIRE = [{ dmg: 1, cost: 1 }, { dmg: 3, cost: 2 }, { dmg: 6, cost: 4 }, { dmg: 10, cost: 6 }];
const fireId = (l, c) => `F${l}_${c}`;
for (let l = 0; l < 4; l++) for (const f of FIRE) if (f.cost <= FIRE[l].cost) CARDS[fireId(l, f.cost)] = { id: fireId(l, f.cost), kind: 'Spell', cost: f.cost, dmg: FIRE[l].dmg, fire: l };

const HEROES = {
  P: { id: 'P', name: 'Pyromancer', card: 'HP', power: 2, passive: 'Your hero power upgrades after every 3 uses.', active: 'Add a Fireball to your hand.' },
  A: { id: 'A', name: 'Angel Warrior', card: 'HA', power: 1, target: true, passive: 'After your minion kills an enemy minion and survives, it gains +1/+1.', active: 'Give a friendly minion +2 attack.' },
  M: { id: 'M', name: 'Mage', card: 'HM', power: 3, passive: 'Fatigue gains you energy instead of losing it.', active: 'Draw a card.' },
};
const HERO_IDS = ['P', 'A', 'M'];

// Which targets a card needs: 'any' (minion or hero, either side), 'minion' (any minion), or none.
function targetKind(c) {
  if (c.kind === 'Spell') return c.dmg ? 'any' : (c.destroy || c.buff) ? 'minion' : null;
  if (c.kind === 'Minion' && c.bc && c.bc.dmg) return 'any';
  return null;
}

// Found by bot search (search.mjs), a starting point; see RULES.md.
let DEFAULT_DECKS = {
  P: ['a7', 'a7', 'd2b', 'h1', 'h1', 'h4', 'k5', 'k5', 'm2a', 'm3', 'm4', 'm4', 'r3', 's1', 's1', 's2', 's2', 's4', 's4', 't4'],
  A: ['a7', 'd2b', 'd2b', 'g2', 'h1', 'h1', 'm2b', 'm3', 'm3', 'm4', 'm4', 'm6', 'm6', 's1', 's2', 's4', 's4', 't3', 't4', 't6'],
  M: ['a7', 'a7', 'd2a', 'd2a', 'd2b', 'g3', 'g3', 'h1', 'h1', 'h4', 'h4', 'k5', 'm1a', 'm1a', 's1', 's2', 's2', 's4', 's4', 't4'],
};
function setDefaultDecks(d) { DEFAULT_DECKS = d; }
function deckOK(list) {
  if (list.length !== DECK_SIZE) return false;
  const n = {};
  for (const id of list) { if (!POOL.some(c => c.id === id)) return false; n[id] = (n[id] || 0) + 1; if (n[id] > COPIES) return false; }
  return true;
}

function rand(s) {
  let t = (s.seed = (s.seed + 0x6D2B79F5) | 0);
  t = Math.imul(t ^ (t >>> 15), t | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
function shuffleInPlace(s, a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rand(s) * (i + 1)); const x = a[i]; a[i] = a[j]; a[j] = x; } return a; }

let UID = 1;
function newPlayer(hero, deck) {
  return { hero, energy: START, mana: 0, maxMana: 0, fatigue: 0, hand: [HEROES[hero].card], deck: deck.slice(), board: [], played: [], uses: 0, powered: false };
}
function clone(s) {
  return { ...s, p: s.p.map(p => ({ ...p, hand: p.hand.slice(), deck: p.deck.slice(), played: p.played.slice(), board: p.board.map(m => ({ ...m })) })) };
}
function emit(s, ev, e) { if (ev) { e.round = s.turnNo; ev.push(e); } }
// While the Mage's deck is empty its hero card is the 8/8, in hand and on the board.
function mageCheck(s, side, ev) {
  const p = s.p[side];
  if (p.hero !== 'M' || p.deck.length) return;
  for (let i = 0; i < p.hand.length; i++) if (p.hand[i] === 'HM') { p.hand[i] = 'HM8'; emit(s, ev, { t: 'transform', side, where: 'hand' }); }
  for (const m of p.board) if (m.card === 'HM') { m.card = 'HM8'; m.atk = 8; m.hp = 8; m.max = 8; emit(s, ev, { t: 'transform', side, where: 'board', uid: m.uid }); }
}
function gain(s, side, n, ev) { s.p[side].energy += n; emit(s, ev, { t: 'gain', side, n, energy: s.p[side].energy }); }
function draw(s, side, ev) {
  const p = s.p[side];
  if (p.deck.length) { const c = p.deck.shift(); p.hand.push(c); emit(s, ev, { t: 'draw', side }); mageCheck(s, side, ev); return; }
  p.fatigue++;
  if (p.hero === 'M') { gain(s, side, p.fatigue, ev); return; }
  p.energy -= p.fatigue; emit(s, ev, { t: 'fatigue', side, n: p.fatigue, energy: p.energy });
}

// heroes: [hero of side 0, hero of side 1]; decks: the 20 pool cards of each (defaults if left out).
function newMatch({ seed, first, heroes = ['P', 'A'], decks }) {
  const ds = decks || heroes.map(h => DEFAULT_DECKS[h]);
  const s = { seed: (seed >>> 0) || 1, turnNo: 0, turn: 0, first: 0, winner: null, p: [newPlayer(heroes[0], ds[0]), newPlayer(heroes[1], ds[1])] };
  for (const p of s.p) shuffleInPlace(s, p.deck);
  s.first = rand(s) < 0.5 ? 0 : 1;
  if (first === 0 || first === 1) s.first = first;
  for (let i = 0; i < 3; i++) draw(s, s.first, null);
  for (let i = 0; i < 4; i++) draw(s, 1 - s.first, null);
  s.p[1 - s.first].hand.push('COIN');
  s.turn = s.first;
  mStartTurn(s, null);
  return s;
}

// Energy at 0 or less loses, at 50 or more wins; when both sides qualify, the player whose turn it is wins.
function checkWin(s, ev) {
  if (s.winner !== null) return true;
  const won = [0, 1].map(k => s.p[k].energy >= WIN || s.p[1 - k].energy <= 0);
  if (!won[0] && !won[1]) return false;
  s.winner = won[0] && won[1] ? s.turn : won[0] ? 0 : 1;
  emit(s, ev, { t: 'end', winner: s.winner, how: s.p[s.winner].energy >= WIN ? 'gain' : 'kill' });
  return true;
}

function buff(s, side, m, a, h, ev) { m.atk += a; m.hp += h; m.max += h; emit(s, ev, { t: 'buff', side, uid: m.uid, a, h }); }
function mStartTurn(s, ev) {
  const side = s.turn, p = s.p[side];
  s.turnNo++;
  emit(s, ev, { t: 'turn', side });
  p.maxMana = Math.min(MAX_MANA, p.maxMana + 1);
  p.mana = p.maxMana;
  p.powered = false;
  for (const m of p.board) m.ready = true;
  for (const m of p.board.slice()) {
    const sot = CARDS[m.card].sot;
    if (!sot) continue;
    if (sot.atk) buff(s, side, m, sot.atk, 0, ev);
    if (sot.others) for (const o of p.board) if (o !== m) buff(s, side, o, sot.others, sot.others, ev);
  }
  draw(s, side, ev);
  checkWin(s, ev);
}

const hasTaunt = (B) => B.some(m => CARDS[m.card].taunt);
// Actions: { t: 'play', card, target } (target { side, i }: i a board index, -1 for the hero)
//          { t: 'attack', from, to } (own board index; enemy board index or -1 for the hero)
//          { t: 'power', target } (target only for the Angel Warrior: { side: own, i })
function legalActions(s) {
  if (s.winner !== null) return [];
  const me = s.turn, P = s.p[me], O = s.p[1 - me], out = [];
  for (const id of new Set(P.hand)) {
    const c = CARDS[id];
    if (c.cost > P.mana) continue;
    if (c.kind === 'Minion' && P.board.length >= BOARD) continue;
    const tk = targetKind(c);
    if (!tk) { out.push({ t: 'play', card: id }); continue; }
    for (const side of [0, 1]) {
      if (tk === 'any') out.push({ t: 'play', card: id, target: { side, i: -1 } });
      for (let i = 0; i < s.p[side].board.length; i++) out.push({ t: 'play', card: id, target: { side, i } });
    }
  }
  const H = HEROES[P.hero];
  if (!P.powered && H.power <= P.mana) {
    if (H.target) P.board.forEach((m, i) => out.push({ t: 'power', target: { side: me, i } }));
    else out.push({ t: 'power' });
  }
  const taunt = hasTaunt(O.board);
  P.board.forEach((m, from) => {
    if (!m.ready) return;
    if (!taunt) out.push({ t: 'attack', from, to: -1 });
    for (let to = 0; to < O.board.length; to++) if (!taunt || CARDS[O.board[to].card].taunt) out.push({ t: 'attack', from, to });
  });
  return out;
}

function hit(s, side, i, n, ev) {
  if (i < 0) { s.p[side].energy -= n; emit(s, ev, { t: 'hit', side, i, n, energy: s.p[side].energy }); return; }
  const m = s.p[side].board[i]; m.hp -= n;
  emit(s, ev, { t: 'hit', side, i, n, hp: m.hp, uid: m.uid });
}
function sweep(s, ev) {
  const dead = [];
  for (const side of [s.turn, 1 - s.turn]) {
    const B = s.p[side].board;
    for (let i = B.length - 1; i >= 0; i--) if (B[i].hp <= 0) { emit(s, ev, { t: 'die', side, i, uid: B[i].uid, card: B[i].card }); dead.push([side, B[i]]); B.splice(i, 1); }
  }
  for (const [side, m] of dead) { const d = CARDS[m.card].dies; if (d && d.draw) for (let k = 0; k < d.draw; k++) draw(s, side, ev); }
}
function upgradeFire(p) {
  p.hand = p.hand.map(id => { const c = CARDS[id]; return c.fire !== undefined ? fireId(Math.min(3, c.fire + 1), c.cost) : id; });
}

function mAct(s, a, ev) {
  const me = s.turn, P = s.p[me], O = s.p[1 - me];
  if (a.t === 'play') {
    const c = CARDS[a.card];
    if (!P.hand.includes(a.card) || c.cost > P.mana) throw new Error('illegal play ' + a.card);
    const tk = targetKind(c);
    if (tk) {
      if (!a.target) throw new Error('play needs a target ' + a.card);
      const { side, i } = a.target;
      if (i >= s.p[side].board.length || (i < 0 && tk !== 'any')) throw new Error('bad target');
    }
    if (c.kind === 'Minion' && P.board.length >= BOARD) throw new Error('board full');
    P.mana -= c.cost; P.hand.splice(P.hand.indexOf(a.card), 1); P.played.push(a.card);
    emit(s, ev, { t: 'play', side: me, card: a.card, target: a.target, mana: P.mana, tuid: a.target && a.target.i >= 0 ? s.p[a.target.side].board[a.target.i].uid : null });
    if (c.kind === 'Minion') {
      // the when-played effect first (its target index refers to the boards before the summon), then the body
      const m = { uid: UID++, card: a.card, atk: c.atk, hp: c.hp, max: c.hp, ready: !!c.rush };
      if (c.bc) {
        if (c.bc.dmg) { hit(s, a.target.side, a.target.i, c.bc.dmg, ev); }
        if (c.bc.gain) gain(s, me, c.bc.gain, ev);
        if (c.bc.upFire) { upgradeFire(P); emit(s, ev, { t: 'upfire', side: me }); }
      }
      P.board.push(m); emit(s, ev, { t: 'summon', side: me, uid: m.uid });
      if (c.bc && c.bc.draw) for (let k = 0; k < c.bc.draw; k++) draw(s, me, ev);
      sweep(s, ev);
    } else if (c.kind === 'Coin') { P.mana = Math.min(MAX_MANA, P.mana + 1); emit(s, ev, { t: 'coin', side: me, mana: P.mana }); }
    else if (c.dmg) { hit(s, a.target.side, a.target.i, c.dmg, ev); sweep(s, ev); }
    else if (c.area) { for (let i = 0; i < O.board.length; i++) hit(s, 1 - me, i, c.area, ev); sweep(s, ev); }
    else if (c.destroy) { const m = s.p[a.target.side].board[a.target.i]; m.hp = 0; emit(s, ev, { t: 'destroy', side: a.target.side, uid: m.uid }); sweep(s, ev); }
    else if (c.buff) buff(s, a.target.side, s.p[a.target.side].board[a.target.i], c.buff, c.buff, ev);
    else if (c.gain) gain(s, me, c.gain, ev);
    else if (c.draw) for (let k = 0; k < c.draw; k++) draw(s, me, ev);
  } else if (a.t === 'power') {
    const H = HEROES[P.hero];
    if (P.powered || H.power > P.mana) throw new Error('illegal power');
    P.mana -= H.power; P.powered = true;
    emit(s, ev, { t: 'power', side: me, hero: P.hero, target: a.target, tuid: a.target ? P.board[a.target.i].uid : null });
    if (P.hero === 'P') { const l = Math.min(3, Math.floor(P.uses / 3)); P.hand.push(fireId(l, FIRE[l].cost)); emit(s, ev, { t: 'fire', side: me, level: l }); }
    else if (P.hero === 'A') { const m = P.board[a.target.i]; if (!m || a.target.side !== me) throw new Error('bad power target'); buff(s, me, m, 2, 0, ev); }
    else draw(s, me, ev);
    P.uses++;
  } else {
    const m = P.board[a.from];
    if (!m || !m.ready) throw new Error('illegal attack');
    if (hasTaunt(O.board) && (a.to < 0 || !CARDS[O.board[a.to].card].taunt)) throw new Error('taunt in the way');
    m.ready = false;
    emit(s, ev, { t: 'attack', side: me, from: a.from, to: a.to, uid: m.uid, tuid: a.to >= 0 ? O.board[a.to].uid : null });
    if (a.to < 0) hit(s, 1 - me, -1, m.atk, ev);
    else {
      const d = O.board[a.to], da = d.atk;

  if (c.dies) return '<span class="mg">▮</span>';
  return '';
}
function boardHTML(side, T) {
  return ui.view.p[side].board.map((m, i) => {
    const c = CARDS[m.card];
    let cls = '';
    if (side === ME && ui.sel && ui.sel.kind === 'minion' && ui.sel.i === i) cls += ' sel';
    else if (side === ME && !ui.sel && canAttack(i)) cls += ' can';
    if (T.minions.has(side + ':' + i)) cls += ' tgt';
    if (side === ui.view.turn && !m.ready) cls += ' sleep';
    if (c.taunt) cls += ' taunt';
    if (c.hero) cls += ' herocard h' + c.hero;
    if (ui.fx['m' + m.uid]) cls += ' ' + ui.fx['m' + m.uid];
    return `<div class="minion s${side}${cls}" id="m${m.uid}" data-side="${side}" data-i="${i}" data-card="${m.card}">${minionGlyph(c)}<span class="stat a${m.atk > c.atk ? ' up' : ''}">${m.atk}</span><span class="stat h${m.hp < m.max ? ' hurt' : m.max > c.hp ? ' up' : ''}">${m.hp}</span></div>`;
  }).join('');
}
function resHTML(side) {
  const p = ui.view.p[side];
  let gems = '';
  for (let i = 0; i < MAX_MANA; i++) gems += `<i class="gemc${i < p.mana ? ' on' : i < p.maxMana ? '' : ' off'}"></i>`;
  return `<div class="mana"><span class="manatxt">${p.mana}/${p.maxMana}</span>${gems}</div><div class="pile s${side}">${p.deck.length}</div>`;
}
// The deck lists: for me, what is left in my deck; for him, what he has not shown yet (deck and hand).
function trackHTML(side) {
  const p = ui.view.p[side], list = ui.lists[side], n = {}, left = {};
  for (const id of list) n[id] = (n[id] || 0) + 1;
  if (side === ME) for (const id of p.deck) left[id] = (left[id] || 0) + 1;
  else { for (const id in n) left[id] = n[id]; for (const id of p.played) if (left[id]) left[id]--; }
  const ids = Object.keys(n).sort((a, b) => CARDS[a].cost - CARDS[b].cost || short(CARDS[a]).localeCompare(short(CARDS[b])));
  const hc = HEROES[p.hero].card, heroDone = side === ME ? true : !p.hand.includes(hc) && !p.hand.includes('HM8');
  const head = `<div class="trow thero h${p.hero}${heroDone ? ' gone' : ''}"><span class="tg">${CARDS[hc].cost}</span><span class="tn">${HEROES[p.hero].name}</span></div>`;
  return `<div class="tlist s${side}">` + (side === ME ? '' : head) + ids.map(id => {
    const c = CARDS[id], k = left[id] || 0;
    return `<div class="trow ${c.kind}${k ? '' : ' gone'}" data-card="${id}"><span class="tg">${c.cost}</span><span class="tn">${short(c)}</span><span class="tk">${k > 1 ? '×' + k : ''}</span></div>`;
  }).join('') + '</div>';
}
function handHTML() {
  const p = ui.view.p[ME], legal = myTurn() ? legalActions(ui.view) : [];
  const R = { Coin: 0, Minion: 1, Spell: 2 };
  const order = p.hand.map((_, i) => i).sort((a, b) => {
    const A = CARDS[p.hand[a]], B = CARDS[p.hand[b]];
    return (B.hero ? 1 : 0) - (A.hero ? 1 : 0) || R[A.kind] - R[B.kind] || A.cost - B.cost;
  });
  return order.map(i => {
    const id = p.hand[i], ok = legal.some(a => a.t === 'play' && a.card === id);
    let cls = ok ? 'ok' : (myTurn() ? 'no' : '');
    if (ok && ui.sel && ui.sel.kind === 'card' && ui.sel.hand === i) cls += ' sel';
    if (ui.fresh && i >= p.hand.length - ui.fresh) cls += ' drawn';
    return cardHTML(id, ME, { cls, attrs: `data-hand="${i}"${ok ? '' : ' disabled'}` });
  }).join('');
}
function histHTML(h) { return `<div class="hist s${h.side}">${h.chip}<span class="ho ${h.cls || ''}">${h.out || ''}</span></div>`; }
function oppHandHTML() {
  return ui.view.p[BOT].hand.map(id => {
    const c = CARDS[id];
    if (c.hero) return `<i class="back herob h${c.hero}"></i>`;
    if (c.fire !== undefined) return `<i class="back fireb">${c.dmg}</i>`;
    if (c.kind === 'Coin') return `<i class="back coinb"></i>`;
    return '<i class="back"></i>';
  }).join('');
}
function render() {
  if (!ui.view) return;
  const s = ui.view, T = targetsNow();
  const t = tallies[pairKey()] || [0, 0];
  $('tally').innerHTML = `<span class="tally"><b class="t0">${t[0]}</b><b class="t1">${t[1]}</b></span>`;
  $('opphand').innerHTML = oppHandHTML();
  for (const side of [0, 1]) { $('hero' + side).innerHTML = heroHTML(side, T); $('board' + side).innerHTML = boardHTML(side, T); $('res' + side).innerHTML = resHTML(side); $('track' + side).innerHTML = trackHTML(side); }
  const hand = $('hand'); hand.innerHTML = handHTML();
  hand.style.setProperty('--squeeze', Math.max(0, s.p[ME].hand.length - 10) * 9 + 'px');
  const mine = !ui.over && s.turn === ME, canAct = mine && !ui.busy && legalActions(s).some(a => a.t === 'attack' || a.t === 'power' || (a.t === 'play' && !(a.target && a.target.side === ME && !CARDS[a.card].buff)));
  $('turnbox').innerHTML = `<button id="endturn" class="${mine && !canAct ? 'done' : ''}"${mine && !ui.busy ? '' : ' disabled'}>End turn</button>`;
  $('history').innerHTML = ui.hist.slice(-15).map(histHTML).join('');
  ui.fresh = 0; ui.fx = {};
}

// ------------------------------------------------------------------ effects
function centerOf(el) { const a = $('game').getBoundingClientRect(), r = el.getBoundingClientRect(); return { x: r.left - a.left + r.width / 2, y: r.top - a.top + r.height / 2 }; }
function floatAt(p, text, cls = '') { const f = document.createElement('div'); f.className = 'float ' + cls; f.textContent = text; f.style.left = p.x + 'px'; f.style.top = p.y + 'px'; $('game').appendChild(f); setTimeout(() => f.remove(), 1200); }
function banner(text) { const b = $('banner'); b.textContent = text; b.classList.remove('show'); void b.offsetWidth; b.classList.add('show'); }
function snapshot() { const out = {}; document.querySelectorAll('.minion, .hero').forEach(el => { out[el.id] = { c: centerOf(el), html: el.outerHTML, rect: el.getBoundingClientRect() }; }); return out; }
async function spotlight(html) {
  const g = $('game').getBoundingClientRect(), b = $('board1').getBoundingClientRect();
  $('spot').style.left = (b.left - g.left + b.width / 2) + 'px'; $('spot').style.top = (b.bottom - g.top) + 'px';
  $('spot').innerHTML = html;
  await wait(750);
  const c = $('spot').querySelector('.card'); if (c) c.classList.add('out');
  await wait(180); $('spot').innerHTML = '';
}
async function lunge(fromEl, toEl) {
  if (!fromEl || !toEl) return;
  const a = fromEl.getBoundingClientRect(), b = toEl.getBoundingClientRect();
  const dx = (b.left + b.width / 2) - (a.left + a.width / 2), dy = (b.top + b.height / 2) - (a.top + a.height / 2);
  fromEl.style.zIndex = 10;
  await fromEl.animate([{ transform: 'translate(0,0)' }, { transform: `translate(${dx * .8}px, ${dy * .8}px)`, offset: .55 }, { transform: 'translate(0,0)' }], { duration: 420, easing: 'ease-in-out' }).finished;
}
function ghost(snap) {
  const g = $('game').getBoundingClientRect(), d = document.createElement('div');
  d.className = 'ghost'; d.innerHTML = snap.html; d.style.left = (snap.rect.left - g.left) + 'px'; d.style.top = (snap.rect.top - g.top) + 'px';
  $('game').appendChild(d); setTimeout(() => d.remove(), 500);
}
function chipFor(card, side) {
  const c = CARDS[card];
  if (c.kind === 'Coin') return '<span class="chip Coin"></span>';
  if (c.kind === 'Minion') return `<span class="chip Minion s${side}${c.hero ? ' herocard h' + c.hero : ''}">${c.atk}/${c.hp}</span>`;
  return `<span class="chip Spell${c.fire !== undefined ? ' fire' : ''}${c.gain ? ' gainc' : ''}">${c.dmg || c.area || (c.draw ? '+' + c.draw : c.destroy ? '✕' : c.buff ? '+' + c.buff : c.gain ? '+' + c.gain : '')}</span>`;
}
function outcome(ev, side) {
  const kills = ev.filter(e => e.t === 'die' && e.side !== side).length;
  const face = ev.filter(e => e.t === 'hit' && e.i < 0 && e.side !== side).reduce((n, e) => n + e.n, 0);
  const gained = ev.filter(e => e.t === 'gain' && e.side === side).reduce((n, e) => n + e.n, 0);
  const parts = [];
  if (kills) parts.push('✕'.repeat(kills));
  if (face) parts.push('−' + face + ' face');
  if (gained) parts.push('+' + gained);
  return { out: parts.join(' '), cls: gained && !face && !kills ? 'gain' : kills ? 'kill' : face ? 'face' : 'dmg' };
}

// ------------------------------------------------------------------ playback
async function apply(fn) {
  const prev = ui.s, ev = [];
  const next = fn(prev, ev);
  ui.s = next;
  const playE = ev.find(e => e.t === 'play'), atkE = ev.find(e => e.t === 'attack'), powE = ev.find(e => e.t === 'power');
  if (playE && (playE.side === BOT || CARDS[playE.card].kind === 'Spell')) await spotlight(cardHTML(playE.card, playE.side, { tag: 'div' }));
  if (powE && powE.side === BOT) await spotlight(powerCardHTML(powE.hero, BOT));
  if (atkE) await lunge($('m' + atkE.uid), atkE.to < 0 ? $('hero' + (1 - atkE.side) + 'x') : $('m' + atkE.tuid));
  const before = snapshot();
  for (const e of ev) {
    if (e.t === 'turn') { ui.sel = null; if (e.side === ME) banner('Your turn'); }
    if (e.t === 'summon') ui.fx['m' + e.uid] = 'new';
    if (e.t === 'buff' || e.t === 'transform') ui.fx['m' + e.uid] = 'buffed';
    if (e.t === 'hit' && e.i >= 0 && e.hp > 0) ui.fx['m' + e.uid] = 'shake';
    if (e.t === 'hit' && e.i < 0) ui.fx['hero' + e.side] = 'shake';
    if ((e.t === 'draw' || e.t === 'fire') && e.side === ME) ui.fresh++;
  }
  ui.view = next; render();
  for (const e of ev) {
    if (e.t === 'hit') { const id = e.i < 0 ? 'hero' + e.side + 'x' : 'm' + e.uid; const p = before[id]; if (p) floatAt(p.c, '−' + e.n); }
    if (e.t === 'die') { const p = before['m' + e.uid]; if (p) ghost(p); }
    if (e.t === 'fatigue') { const p = before['hero' + e.side + 'x']; if (p) floatAt(p.c, '−' + e.n); }
    if (e.t === 'gain') { const p = before['hero' + e.side + 'x']; if (p) floatAt(p.c, '+' + e.n, 'g'); }
  }
  if (playE) ui.hist.push({ side: playE.side, chip: chipFor(playE.card, playE.side), ...outcome(ev, playE.side) });
  if (powE) ui.hist.push({ side: powE.side, chip: `<span class="chip Power h${powE.hero}">${PORTRAIT[powE.hero]}</span>`, ...outcome(ev, powE.side) });
  if (atkE) {
    const atk = prev.p[atkE.side].board[atkE.from].atk, o = outcome(ev, atkE.side);
    ui.hist.push({ side: atkE.side, chip: `<span class="chip Attack s${atkE.side}">${atk}</span>`, out: o.out || '−' + atk, cls: o.cls });
  }
  const eot = ev.filter(e => e.t === 'gain' && !playE && !powE && !atkE);
  if (eot.length) { const n = eot.reduce((k, e) => k + e.n, 0); ui.hist.push({ side: eot[0].side, chip: '<span class="chip Spell gainc">⟳</span>', out: '+' + n, cls: 'gain' }); }
  if (ev.some(e => e.t === 'turn')) await wait(next.turn === ME ? 600 : 250);
  if (next.winner !== null) finish();
  render();
}

function pairKey() { return ui.heroes ? ui.heroes.join('') : ''; }
function finish() {
  if (ui.over) return;
  ui.over = true;
  const w = ui.s.winner, k = pairKey();
  if (w === 0 || w === 1) { const t = tallies[k] || [0, 0]; t[w]++; tallies[k] = t; remember(); }
  const how = w === 'draw' ? '' : ui.s.p[w].energy >= WIN ? `<span class="how e">${WIN}</span>` : `<span class="how">0</span>`;
  const t = w === 'draw' ? ['Draw', ''] : w === ME ? ['Victory', 'win'] : ['Defeat', 'lose'];
  $('over').innerHTML = `<h2 class="${t[1]}">${t[0]}</h2>${how}<div class="obtn"><button id="rematch">Play again</button><button id="todecks2" class="ghostb">Decks</button></div>`;
  $('over').classList.add('show');
}

// ------------------------------------------------------------------ flow
async function startMatch() {
  const tok = ++ui.token;
  const opp = setup.opp === '?' ? HERO_IDS[Math.floor(Math.random() * 3)] : setup.opp;
  ui.heroes = [setup.me, opp];
  ui.lists = [setup.decks[setup.me].slice(), DEFAULT_DECKS[opp].slice()];
  const t = tallies[pairKey()] || [0, 0];
  ui.s = newMatch({ seed: (Math.random() * 4294967296) >>> 0, first: (t[0] + t[1]) % 2 === 0 ? ME : BOT, heroes: ui.heroes, decks: ui.lists });
  ui.view = ui.s; ui.over = false; ui.hist = []; ui.sel = null;
  $('over').classList.remove('show'); $('start').classList.remove('show');
  ui.busy = true; render();
  if (ui.s.first === ME) banner('Your turn');
  await wait(900);
  if (tok !== ui.token) return;
  if (ui.s.turn === BOT) await botMove(tok); else { ui.busy = false; render(); }
}
async function botMove(tok) {
  ui.busy = true; render();
  await wait(350);
  const acts = expert(ui.s, ui.rng);
  for (const a of acts) {
    if (tok !== ui.token || ui.over) return;
    await wait(250);
    await apply((s, ev) => act(s, a, ev));
  }
  if (tok !== ui.token || ui.over) return;
  await wait(300);
  await apply((s, ev) => endTurn(s, ev));
  if (tok !== ui.token || ui.over) return;
  ui.busy = false; render();
}
async function doAct(a) {
  if (!myTurn()) return;
  ui.busy = true; ui.sel = null;
  await apply((s, ev) => act(s, a, ev));
  ui.busy = false; render();
}
async function myEndTurn() {
  if (!myTurn()) return;
  const tok = ui.token;
  ui.busy = true; ui.sel = null; render();
  await apply((s, ev) => endTurn(s, ev));
  if (tok !== ui.token || ui.over) return;
  await botMove(tok);
}

// ------------------------------------------------------------------ the start screen
function heroTile(h, which) {
  const H = HEROES[h], on = (which === 'me' ? setup.me : setup.opp) === h;
  if (which === 'opp') return `<button class="otile h${h}${on ? ' on' : ''}" data-opp="${h}"><span class="face">${PORTRAIT[h]}</span></button>`;
  return `<button class="htile h${h}${on ? ' on' : ''}" data-me="${h}"><span class="face">${PORTRAIT[h]}</span><span class="hn">${H.name}</span><span class="hcard">${cardHTML(H.card, ME, { tag: 'span' })}</span>
    <span class="hl">${H.passive}</span><span class="hl"><i class="pgem">${H.power}</i>${H.active}</span></button>`;
}
function renderStart() {
  const deck = setup.decks[setup.me], n = {};
  for (const id of deck) n[id] = (n[id] || 0) + 1;
  const pool = POOL.slice().sort((a, b) => a.cost - b.cost || (a.kind === b.kind ? 0 : a.kind === 'Minion' ? -1 : 1));
  const grid = pool.map(c => {
    const k = n[c.id] || 0, full = k >= COPIES;
    return `<div class="slot">${cardHTML(c.id, ME, { cls: (full ? 'full' : '') + (k ? ' indeck' : ''), attrs: `data-add="${c.id}"` })}${k ? `<span class="copies">${'●'.repeat(k)}</span>` : ''}</div>`;
  }).join('');
  const ids = Object.keys(n).sort((a, b) => CARDS[a].cost - CARDS[b].cost || short(CARDS[a]).localeCompare(short(CARDS[b])));
  const hc = HEROES[setup.me].card;
  const list = `<div class="trow thero h${setup.me}"><span class="tg">${CARDS[hc].cost}</span><span class="tn">${HEROES[setup.me].name}</span></div>` +
    ids.map(id => `<button class="trow ${CARDS[id].kind}" data-remove="${id}"><span class="tg">${CARDS[id].cost}</span><span class="tn">${short(CARDS[id])}</span><span class="tk">${n[id] > 1 ? '×' + n[id] : ''}</span></button>`).join('');
  const ok = deck.length === DECK_SIZE;
  $('start').innerHTML = `
    <div class="pick">
      <div class="mine">${HERO_IDS.map(h => heroTile(h, 'me')).join('')}</div>
      <div class="vs">vs</div>
      <div class="theirs">${HERO_IDS.map(h => heroTile(h, 'opp')).join('')}<button class="otile rnd${setup.opp === '?' ? ' on' : ''}" data-opp="?"><span class="face">?</span></button></div>
    </div>
    <div class="build">
      <div class="pool">${grid}</div>
      <div class="decklist">
        <div class="dhead"><span class="count${ok ? ' full' : ''}">${deck.length}/${DECK_SIZE}</span><button id="defdeck" class="ghostb">Default</button></div>
        <div class="tlist s0">${list}</div>
        <button id="play"${ok ? '' : ' disabled'}>Play</button>
      </div>
    </div>`;
}
function showStart() { ++ui.token; ui.over = true; $('over').classList.remove('show'); renderStart(); $('start').classList.add('show'); }

// ------------------------------------------------------------------ input
document.addEventListener('click', (e) => {
  if ($('start').classList.contains('show')) {
    const b = e.target.closest('[data-me], [data-opp], [data-add], [data-remove], button');
    if (!b) return;
    const deck = setup.decks[setup.me];
    if (b.dataset.me) setup.me = b.dataset.me;
    else if (b.dataset.opp) setup.opp = b.dataset.opp;
    else if (b.dataset.add) { const id = b.dataset.add; if (deck.length < DECK_SIZE && deck.filter(x => x === id).length < COPIES) deck.push(id); }
    else if (b.dataset.remove) deck.splice(deck.indexOf(b.dataset.remove), 1);
    else if (b.id === 'defdeck') setup.decks[setup.me] = DEFAULT_DECKS[setup.me].slice();
    else if (b.id === 'play' && !b.disabled) { remember(); startMatch(); return; }
    remember(); renderStart(); return;
  }
  const tgt = e.target.closest('.minion, .hero');
  if (tgt && myTurn()) {
    const side = +tgt.dataset.side, i = +tgt.dataset.i;
    if (ui.sel && tgt.classList.contains('tgt')) {
      if (ui.sel.kind === 'card') return doAct({ t: 'play', card: ui.sel.id, target: { side, i } });
      if (ui.sel.kind === 'power') return doAct({ t: 'power', target: { side, i } });
      return doAct({ t: 'attack', from: ui.sel.i, to: i });
    }
    if (side === ME && i >= 0 && canAttack(i)) { ui.sel = ui.sel && ui.sel.kind === 'minion' && ui.sel.i === i ? null : { kind: 'minion', i }; render(); return; }
  }
  const b = e.target.closest('button');
  if (b && !b.disabled && b.dataset.hand !== undefined && myTurn()) {
    const i = +b.dataset.hand, id = ui.view.p[ME].hand[i], c = CARDS[id];
    if (targetKind(c)) { ui.sel = ui.sel && ui.sel.kind === 'card' && ui.sel.hand === i ? null : { kind: 'card', id, hand: i }; render(); return; }
    return doAct({ t: 'play', card: id });
  }
  if (b && !b.disabled && b.dataset.power === String(ME) && myTurn()) {
    if (HEROES[ui.view.p[ME].hero].target) { ui.sel = ui.sel && ui.sel.kind === 'power' ? null : { kind: 'power' }; render(); return; }
    return doAct({ t: 'power' });
  }
  if (b && !b.disabled) {
    if (b.id === 'rematch') return startMatch();
    if (b.id === 'todecks' || b.id === 'todecks2') return showStart();
    if (b.id === 'endturn') return myEndTurn();
  }
  if (ui.sel) { ui.sel = null; render(); }
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && ui.sel) { ui.sel = null; render(); } });
// a minion on the board shows its card while the pointer rests on it
document.addEventListener('mouseover', (e) => {
  const m = e.target.closest('.minion[data-card], .trow[data-card]'), pk = $('peek');
  if (!m || $('start').classList.contains('show')) { pk.innerHTML = ''; return; }
  const g = $('game').getBoundingClientRect(), r = m.getBoundingClientRect();
  const left = m.classList.contains('trow') ? r.left - g.left - 140 : r.right - g.left + 12;
  pk.style.left = left + 'px'; pk.style.top = Math.max(8, Math.min(r.top - g.top - 20, g.height - 220)) + 'px';
  pk.innerHTML = cardHTML(m.dataset.card, +(m.dataset.side || 0), { tag: 'div' });
});
showStart();

})();
</script>
