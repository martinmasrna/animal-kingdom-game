<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vanilla HS</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* one screen: history left; heroes, boards and hand in the middle; mana, deck and End turn right */
:root {
  --bg: #2a3340; --table: #3b4a5c; --table2: #34424f; --ink: #1b1b1b; --paper: #fbf7ee;
  --mana: #3d8bf2; --gold: #f2b632; --ok: #5fdc6f;
  --me: #3d7fd6; --me2: #2a5ea8; --him: #8a62b8; --him2: #5d3f86; --spell: #e0673f; --spell2: #b8452a;
  --atk: #f2b632; --hp: #d8432e;
  --cardw: 108px; --cardh: 146px; --mw: 86px; --mh: 104px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: #fff; overflow: hidden; }
body { font: 15px/1.25 -apple-system, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
button { font: inherit; cursor: pointer; }

#game {
  position: relative; height: 100%; max-width: 1300px; margin: 0 auto;
  display: grid; grid-template-columns: 170px minmax(0, 1fr) 230px;
  grid-template-rows: 40px auto minmax(0, 1fr) minmax(0, 1fr) auto auto; gap: 6px 20px;
  padding: 0 max(12px, env(safe-area-inset-right, 0px)) max(6px, env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px));
}
#opphand { grid-row: 1; grid-column: 2; display: flex; justify-content: center; align-items: flex-start; padding-top: 6px; }
.back { width: 24px; height: 34px; border-radius: 4px; background: linear-gradient(135deg, var(--him), var(--him2)); border: 2px solid #c9b6e6; margin-left: -6px; box-shadow: 0 2px 4px rgba(0,0,0,.4); }
.back:first-child { margin-left: 0; }
#menu { position: absolute; top: 6px; right: max(12px, env(safe-area-inset-right, 0px)); z-index: 5; display: flex; gap: 12px; align-items: center; }
#menu button { min-height: 32px; padding: 4px 12px; border-radius: 6px; border: 1px solid #5b6a7a; background: rgba(0,0,0,.2); color: #dfe5eb; font-size: 14px; }
.tally { display: flex; gap: 6px; font-weight: 900; font-size: 18px; }
.tally b { min-width: 30px; height: 30px; padding: 0 8px; border-radius: 15px; display: flex; align-items: center; justify-content: center; }
.tally .t0 { background: var(--me2); } .tally .t1 { background: var(--him2); }

#hero1 { grid-row: 2; grid-column: 2; } #board1 { grid-row: 3; grid-column: 2; } #board0 { grid-row: 4; grid-column: 2; } #hero0 { grid-row: 5; grid-column: 2; }
#history { grid-row: 2 / 6; grid-column: 1; }
#res1 { grid-row: 2; grid-column: 3; } #turnbox { grid-row: 3 / 5; grid-column: 3; align-self: center; } #res0 { grid-row: 5; grid-column: 3; }
#hand { grid-row: 6; grid-column: 1 / -1; }

/* ---------------- heroes */
.herorow { display: flex; justify-content: center; }
.hero { position: relative; width: 92px; height: 92px; border-radius: 50%; border: 4px solid #fff; box-shadow: 0 4px 10px rgba(0,0,0,.45); }
.hero.s0 { background: radial-gradient(circle at 35% 30%, #7db3f5, var(--me2)); }
.hero.s1 { background: radial-gradient(circle at 35% 30%, #c09ae8, var(--him2)); }
.hero .hp { position: absolute; right: -10px; bottom: -6px; width: 42px; height: 42px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #ff7a5c, #c62d1c); border: 3px solid #fff;
  display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 19px; text-shadow: 0 1px 2px rgba(0,0,0,.5); }
.hero.tgt { cursor: pointer; box-shadow: 0 0 0 4px var(--gold), 0 0 20px rgba(242,182,50,.8); animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 0 6px var(--gold), 0 0 26px rgba(242,182,50,.9); } }

/* ---------------- boards and minions */
.board { display: flex; justify-content: center; align-items: center; gap: 26px; border-radius: 16px; background: radial-gradient(ellipse at center, var(--table), var(--table2)); box-shadow: inset 0 0 24px rgba(0,0,0,.3); min-height: 0; }
#board1 { border-bottom-left-radius: 0; border-bottom-right-radius: 0; } #board0 { border-top-left-radius: 0; border-top-right-radius: 0; }
.minion { position: relative; width: var(--mw); height: var(--mh); border-radius: 14px; border: 3px solid rgba(255,255,255,.85); box-shadow: 0 4px 8px rgba(0,0,0,.45); flex: 0 0 auto; transition: transform .12s; }
.minion.s0 { background: linear-gradient(160deg, var(--me), var(--me2)); } .minion.s1 { background: linear-gradient(160deg, var(--him), var(--him2)); }
.stat { position: absolute; bottom: -10px; width: 34px; height: 34px; border-radius: 50%; border: 2px solid #fff; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 17px; text-shadow: 0 1px 2px rgba(0,0,0,.5); }
.stat.a { left: -8px; background: radial-gradient(circle at 35% 30%, #ffd36b, #d08a12); color: #2a1d00; text-shadow: none; }
.stat.h { right: -8px; background: radial-gradient(circle at 35% 30%, #ff7a5c, #c62d1c); }
.stat.h.hurt { background: radial-gradient(circle at 35% 30%, #ffb19e, #e0553a); }
.minion.sleep { filter: saturate(.55) brightness(.85); }
.minion.can { cursor: pointer; box-shadow: 0 0 0 3px var(--ok), 0 0 16px rgba(95,220,111,.8); }
.minion.sel { transform: translateY(-8px); box-shadow: 0 0 0 4px var(--gold), 0 0 20px rgba(242,182,50,.9); }
.minion.tgt { cursor: pointer; box-shadow: 0 0 0 4px var(--gold), 0 0 18px rgba(242,182,50,.85); animation: pulse 1.2s ease-in-out infinite; }
.minion.new { animation: pop .4s ease-out; }
@keyframes pop { 0% { transform: scale(.3); opacity: 0; } 70% { transform: scale(1.1); opacity: 1; } 100% { transform: scale(1); } }
.shake { animation: shake .35s; }
@keyframes shake { 0%,100% { transform: translateX(0); } 20% { transform: translateX(-7px); } 40% { transform: translateX(6px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(2px); } }

/* ---------------- mana, deck, turn */
.res { display: flex; align-items: center; gap: 12px; align-self: center; }
.mana { display: flex; align-items: center; gap: 3px; flex-wrap: nowrap; }
.gemc { width: 13px; height: 17px; clip-path: polygon(50% 0, 100% 30%, 100% 70%, 50% 100%, 0 70%, 0 30%); background: #1d2a38; }
.gemc.on { background: linear-gradient(180deg, #8cc2ff, var(--mana)); }
.gemc.off { opacity: .4; }
.manatxt { font-weight: 800; font-size: 18px; margin-right: 6px; color: #bcd9ff; min-width: 40px; }
.pile { width: 34px; height: 46px; border-radius: 5px; border: 2px solid #c9d3de; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 15px; flex: 0 0 auto;
  box-shadow: 2px 2px 0 rgba(0,0,0,.3), 4px 4px 0 rgba(0,0,0,.2); }
.pile.s0 { background: linear-gradient(135deg, var(--me), var(--me2)); } .pile.s1 { background: linear-gradient(135deg, var(--him), var(--him2)); border-color: #c9b6e6; }
#endturn { width: 140px; min-height: 54px; border-radius: 10px; border: 0; font-weight: 800; font-size: 17px; background: var(--gold); color: #2a1d00; box-shadow: 0 3px 0 #a8770d; }
#endturn.done { background: var(--ok); box-shadow: 0 3px 0 #2c8a3a, 0 0 14px rgba(95,220,111,.7); color: #08300f; }
#endturn:disabled { background: #56616d; color: #8e98a3; box-shadow: none; cursor: default; }

/* ---------------- history */
#history { display: flex; flex-direction: column; justify-content: center; gap: 4px; overflow: hidden; }
.hist { display: flex; align-items: center; gap: 8px; padding: 3px 6px; border-radius: 6px; background: rgba(0,0,0,.22); border-left: 4px solid; }
.hist.s0 { border-color: var(--me); } .hist.s1 { border-color: var(--him); }
.chip { min-width: 34px; height: 30px; padding: 0 4px; border-radius: 5px; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 13px; flex: 0 0 auto; }
.chip.Minion.s0, .chip.Attack.s0 { background: linear-gradient(160deg, var(--me), var(--me2)); } .chip.Minion.s1, .chip.Attack.s1 { background: linear-gradient(160deg, var(--him), var(--him2)); }
.chip.Spell { background: linear-gradient(160deg, #f08a5d, var(--spell2)); }
.chip.Coin { background: radial-gradient(circle at 35% 30%, #ffe08a, #d08a12); color: #2a1d00; border-radius: 50%; min-width: 30px; }
.chip.Attack::before { content: '⚔'; margin-right: 3px; font-size: 12px; }
.ho { font-weight: 800; font-size: 15px; }
.ho.dmg { color: #ff8a70; } .ho.kill { color: #ff6a4d; } .ho.face { color: #ffb36b; }

/* ---------------- cards */
.card { position: relative; width: var(--cardw); height: var(--cardh); flex: 0 0 auto; border-radius: 10px; padding: 0; text-align: left;
  background: var(--paper); color: var(--ink); border: 3px solid #d5c39f; box-shadow: 0 4px 8px rgba(0,0,0,.4); display: flex; flex-direction: column; }
.card .art { margin: 4px 4px 0; border-radius: 6px; flex: 0 0 56%; display: flex; align-items: center; justify-content: center; color: #fff; position: relative; }
.card.Minion .art { background: linear-gradient(160deg, var(--me), var(--me2)); }
.card.Minion.s1 .art { background: linear-gradient(160deg, var(--him), var(--him2)); }
.card.Spell .art { background: linear-gradient(160deg, #f08a5d, var(--spell2)); }
.card.Coin .art { background: radial-gradient(circle at 35% 30%, #ffe08a, #d08a12); color: #2a1d00; }
.card .big { font-size: calc(var(--cardw) * .34); font-weight: 900; text-shadow: 0 2px 3px rgba(0,0,0,.35); line-height: 1; }
.card.Coin .big { text-shadow: none; }
.card .stat { bottom: -12px; width: 30px; height: 30px; font-size: 15px; }
.card .nm { font-weight: 800; font-size: calc(var(--cardw) * .14); padding: 14px 8px 0; }
.card.Spell .nm, .card.Coin .nm { padding-top: 5px; }
.card .tx { font-size: calc(var(--cardw) * .115); padding: 1px 8px; color: #3a352c; line-height: 1.15; }
.cgem { position: absolute; top: -9px; left: -9px; z-index: 2; width: 30px; height: 30px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #8cc2ff, #1f62c4); border: 2px solid #fff; color: #fff;
  display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 16px; text-shadow: 0 1px 2px rgba(0,0,0,.5); }
#hand { display: flex; justify-content: center; align-items: flex-end; gap: 10px; padding: 12px 0 2px; min-height: calc(var(--cardh) + 16px); }
#hand .card { transition: transform .12s, box-shadow .12s; }
#hand .card.ok { border-color: var(--ok); box-shadow: 0 0 12px rgba(95,220,111,.7), 0 4px 8px rgba(0,0,0,.4); }
#hand .card.ok:hover { transform: translateY(-8px); }
#hand .card.sel { transform: translateY(-16px); border-color: var(--gold); box-shadow: 0 0 0 3px rgba(242,182,50,.6), 0 0 18px rgba(242,182,50,.8), 0 6px 12px rgba(0,0,0,.5); }
#hand .card:disabled { cursor: default; }
#hand .card.no { filter: brightness(.62) saturate(.6); }
#hand .card.drawn { animation: drawin .45s ease-out; }
@keyframes drawin { from { transform: translateY(-60px) scale(.6); opacity: 0; } }

/* ---------------- spotlight, floaters, banner, game over */
#spot { position: absolute; z-index: 20; pointer-events: none; }
#spot .card { --cardw: 150px; --cardh: 202px; position: absolute; left: calc(var(--cardw) / -2); top: calc(var(--cardh) / -2); box-shadow: 0 14px 40px rgba(0,0,0,.6); animation: fromtop .32s cubic-bezier(.2,.8,.3,1.1); }
#spot .card.out { animation: spotout .2s ease-in forwards; }
@keyframes fromtop { from { transform: translateY(-240px) scale(.4); opacity: .2; } }
@keyframes spotout { to { transform: scale(.5); opacity: 0; } }
.float { position: absolute; z-index: 30; pointer-events: none; font-weight: 900; font-size: 40px; color: #ff6a4d; text-shadow: 0 2px 0 rgba(0,0,0,.5), 0 0 10px rgba(0,0,0,.4); transform: translate(-50%, -50%); animation: floatup 1.1s ease-out forwards; white-space: nowrap; }
@keyframes floatup { 0% { opacity: 0; transform: translate(-50%, -30%) scale(.6); } 15% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); } 70% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -110%) scale(1); } }
.ghost { position: absolute; z-index: 15; pointer-events: none; animation: die .45s ease-in forwards; }
@keyframes die { to { transform: scale(.4) rotate(-8deg); opacity: 0; } }
#banner { position: absolute; left: 0; right: 0; top: 45%; transform: translateY(-50%); text-align: center; z-index: 25; pointer-events: none; font-size: 44px; font-weight: 900; opacity: 0; text-shadow: 0 3px 12px rgba(0,0,0,.7); }
#banner.show { animation: banner 1s ease-out; }
@keyframes banner { 0% { opacity: 0; transform: translateY(-50%) scale(.8); } 20% { opacity: 1; transform: translateY(-50%) scale(1); } 75% { opacity: 1; } 100% { opacity: 0; } }
#over { position: absolute; inset: 0; z-index: 40; display: none; align-items: center; justify-content: center; flex-direction: column; gap: 18px; background: rgba(10,14,20,.6); }
#over.show { display: flex; }
#over h2 { margin: 0; font-size: 64px; font-weight: 900; text-shadow: 0 4px 16px rgba(0,0,0,.7); }
#over h2.win { color: #ffd36b; } #over h2.lose { color: #ff8a70; }
#over button { min-height: 50px; padding: 0 22px; border-radius: 10px; border: 0; font-weight: 800; font-size: 17px; background: var(--gold); color: #2a1d00; }

/* ---------------- phone */
@media (max-width: 760px) {
  :root { --cardw: 62px; --cardh: 86px; --mw: 46px; --mh: 58px; }
  #game { grid-template-columns: minmax(0, 1fr) auto; grid-template-rows: 30px auto minmax(0, 1fr) minmax(0, 1fr) auto auto; gap: 6px 8px; }
  #history { display: none; }
  #opphand { grid-column: 1 / -1; justify-content: flex-start; }
  .back { width: 16px; height: 24px; }
  #menu { top: 2px; } #menu button { min-height: 24px; padding: 2px 10px; font-size: 13px; }
  .tally { font-size: 14px; } .tally b { min-width: 24px; height: 24px; }
  #hero1, #board1, #board0, #hero0 { grid-column: 1 / -1; }
  #hero1 { justify-content: flex-start; } #hero0 { justify-content: flex-start; }
  #res1 { grid-row: 2; grid-column: 2; } #res0 { grid-row: 5; grid-column: 2; }
  #turnbox { grid-row: 5; grid-column: 1; justify-self: center; align-self: center; }
  .hero { width: 58px; height: 58px; border-width: 3px; } .hero .hp { width: 30px; height: 30px; font-size: 14px; }
  .board { gap: 14px; }
  .minion { border-radius: 9px; border-width: 2px; } .stat { width: 22px; height: 22px; font-size: 12px; bottom: -7px; } .stat.a { left: -5px; } .stat.h { right: -5px; }
  .gemc { display: none; } .manatxt { font-size: 15px; margin: 0; min-width: 0; }
  .pile { width: 24px; height: 32px; font-size: 12px; }
  #endturn { width: auto; min-height: 38px; padding: 0 12px; font-size: 14px; }
  .card .nm { font-size: 11px; padding-top: 11px; } .card .tx { display: none; } .card .stat { width: 20px; height: 20px; font-size: 11px; bottom: -8px; }
  .cgem { width: 20px; height: 20px; font-size: 12px; top: -6px; left: -6px; }
  #hand { gap: 5px; flex-wrap: wrap; padding-top: 8px; }
  #spot .card { --cardw: 110px; --cardh: 148px; }
}

</style>
</head>
<body>
<div id="game">
  <div id="opphand"></div>
  <div id="menu"><span id="tally"></span><button id="newmatch">Restart</button></div>
  <div id="history"></div>
  <div id="hero1" class="herorow"></div>
  <div id="board1" class="board"></div>
  <div id="board0" class="board"></div>
  <div id="hero0" class="herorow"></div>
  <div id="res1" class="res"></div>
  <div id="turnbox"></div>
  <div id="res0" class="res"></div>
  <div id="hand"></div>
  <div id="spot"></div>
  <div id="banner"></div>
  <div id="over"></div>
</div>
<script>
(function () {
"use strict";
// ---- src/engine.js
// Vanilla HS: a card duel with only text-less minions and damage spells, run on the usual
// rules of the genre: 30 health, mana 1 to 10, draw 1 a turn, opening hands 3 and 4 plus the
// Coin for the second player, 7 minions a side, a minion attacks from the turn after it is
// played, attacks hit any enemy minion or the enemy hero, fatigue on an empty deck.
// Pure from the outside: transitions clone the state.

const HP = 30, MAX_MANA = 10, BOARD = 7, TURN_LIMIT = 100;

// The ten cards Martin reviewed (2026-11-26: "This looks great"), three copies each.
const CARDS = {
  M1: { id: 'M1', kind: 'Minion', cost: 1, atk: 2, hp: 1 },
  M2a: { id: 'M2a', kind: 'Minion', cost: 2, atk: 3, hp: 2 },
  M2b: { id: 'M2b', kind: 'Minion', cost: 2, atk: 2, hp: 3 },
  M3: { id: 'M3', kind: 'Minion', cost: 3, atk: 3, hp: 4 },
  M4: { id: 'M4', kind: 'Minion', cost: 4, atk: 4, hp: 5 },
  M5: { id: 'M5', kind: 'Minion', cost: 5, atk: 5, hp: 5 },
  M6: { id: 'M6', kind: 'Minion', cost: 6, atk: 6, hp: 7 },
  S1: { id: 'S1', kind: 'Spell', cost: 1, dmg: 2 },
  S2: { id: 'S2', kind: 'Spell', cost: 2, dmg: 3 },
  S4: { id: 'S4', kind: 'Spell', cost: 4, dmg: 6 },
  COIN: { id: 'COIN', kind: 'Coin', cost: 0 },
};
const DECK = { M1: 3, M2a: 3, M2b: 3, M3: 3, M4: 3, M5: 3, M6: 3, S1: 3, S2: 3, S4: 3 };
let COIN = true;
function setCoin(v) { COIN = v; }

function deckList() { const out = []; for (const [id, k] of Object.entries(DECK)) for (let i = 0; i < k; i++) out.push(id); return out; }
function rand(s) {
  let t = (s.seed = (s.seed + 0x6D2B79F5) | 0);
  t = Math.imul(t ^ (t >>> 15), t | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
function shuffleInPlace(s, a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rand(s) * (i + 1)); const x = a[i]; a[i] = a[j]; a[j] = x; } return a; }

let UID = 1;
function newPlayer() { return { hp: HP, mana: 0, maxMana: 0, fatigue: 0, hand: [], deck: deckList(), board: [], played: [] }; }
function clone(s) {
  return { ...s, p: s.p.map(p => ({ ...p, hand: p.hand.slice(), deck: p.deck.slice(), played: p.played.slice(), board: p.board.map(m => ({ ...m })) })) };
}
function emit(s, ev, e) { if (ev) { e.round = s.turnNo; ev.push(e); } }
function draw(s, side, ev) {
  const p = s.p[side];
  if (p.deck.length) { const c = p.deck.shift(); p.hand.push(c); emit(s, ev, { t: 'draw', side }); return; }
  p.fatigue++; p.hp -= p.fatigue; emit(s, ev, { t: 'fatigue', side, n: p.fatigue, hp: p.hp });
}

function newMatch({ seed, first }) {
  const s = { seed: (seed >>> 0) || 1, turnNo: 0, turn: 0, first: 0, winner: null, p: [newPlayer(), newPlayer()] };
  for (const p of s.p) shuffleInPlace(s, p.deck);
  s.first = rand(s) < 0.5 ? 0 : 1;
  if (first === 0 || first === 1) s.first = first;
  for (let i = 0; i < 3; i++) draw(s, s.first, null);
  for (let i = 0; i < 4; i++) draw(s, 1 - s.first, null);
  if (COIN) s.p[1 - s.first].hand.push('COIN');
  s.turn = s.first;
  mStartTurn(s, null);
  return s;
}

function checkWin(s, ev) {
  if (s.winner !== null) return true;
  const a = s.p[0].hp <= 0, b = s.p[1].hp <= 0;
  if (!a && !b) return false;
  s.winner = a && b ? 'draw' : a ? 1 : 0;
  emit(s, ev, { t: 'end', winner: s.winner });
  return true;
}

function mStartTurn(s, ev) {
  const side = s.turn, p = s.p[side];
  s.turnNo++;
  emit(s, ev, { t: 'turn', side });
  p.maxMana = Math.min(MAX_MANA, p.maxMana + 1);
  p.mana = p.maxMana;
  for (const m of p.board) m.ready = true;
  draw(s, side, ev);
  checkWin(s, ev);
}

// Actions: { t: 'play', card, target } (target for spells: { side, i } with i a board index or -1 for the hero)
//          { t: 'attack', from, to } (from: own board index; to: enemy board index or -1 for the hero)
function legalActions(s) {
  if (s.winner !== null) return [];
  const me = s.turn, P = s.p[me], O = s.p[1 - me], out = [];
  for (const id of new Set(P.hand)) {
    const c = CARDS[id];
    if (c.cost > P.mana) continue;
    if (c.kind === 'Minion') { if (P.board.length < BOARD) out.push({ t: 'play', card: id }); }
    else if (c.kind === 'Coin') out.push({ t: 'play', card: id });
    else for (const side of [0, 1]) { const B = s.p[side].board; out.push({ t: 'play', card: id, target: { side, i: -1 } }); for (let i = 0; i < B.length; i++) out.push({ t: 'play', card: id, target: { side, i } }); }
  }
  P.board.forEach((m, from) => { if (m.ready) { out.push({ t: 'attack', from, to: -1 }); for (let to = 0; to < O.board.length; to++) out.push({ t: 'attack', from, to }); } });
  return out;
}

function hit(s, side, i, n, ev) {

// Bots for the Vanilla HS, simplest first. None reads a hidden card: the play-out bot

  ui.s = newMatch({ seed: (Math.random() * 4294967296) >>> 0, first: (t[0] + t[1]) % 2 === 0 ? ME : BOT });
  ui.view = ui.s; ui.over = false; ui.hist = []; ui.sel = null;
  $('over').classList.remove('show');
  ui.busy = true; render();
  if (ui.s.first === ME) banner('Your turn');
  await wait(900);
  if (tok !== ui.token) return;
  if (ui.s.turn === BOT) await botMove(tok); else { ui.busy = false; render(); }
}
async function botMove(tok) {
  ui.busy = true; render();
  await wait(350);
  const acts = expert(ui.s, ui.rng);
  for (const a of acts) {
    if (tok !== ui.token || ui.over) return;
    await wait(250);
    await apply((s, ev) => act(s, a, ev));
  }
  if (tok !== ui.token || ui.over) return;
  await wait(300);
  await apply((s, ev) => endTurn(s, ev));
  if (tok !== ui.token || ui.over) return;
  ui.busy = false; render();
}
async function doAct(a) {
  if (!myTurn()) return;
  ui.busy = true; ui.sel = null;
  await apply((s, ev) => act(s, a, ev));
  ui.busy = false; render();
}
async function myEndTurn() {
  if (!myTurn()) return;
  const tok = ui.token;
  ui.busy = true; ui.sel = null; render();
  await apply((s, ev) => endTurn(s, ev));
  if (tok !== ui.token || ui.over) return;
  await botMove(tok);
}

// ------------------------------------------------------------------ input
document.addEventListener('click', (e) => {
  const tgt = e.target.closest('.minion, .hero');
  if (tgt && myTurn()) {
    const side = +tgt.dataset.side, i = +tgt.dataset.i;
    if (ui.sel && tgt.classList.contains('tgt')) {
      if (ui.sel.kind === 'card') return doAct({ t: 'play', card: ui.sel.id, target: { side, i } });
      return doAct({ t: 'attack', from: ui.sel.i, to: i });
    }
    if (side === ME && i >= 0 && canAttack(i)) { ui.sel = ui.sel && ui.sel.kind === 'minion' && ui.sel.i === i ? null : { kind: 'minion', i }; render(); return; }
  }
  const b = e.target.closest('button');
  if (b && !b.disabled && b.dataset.hand !== undefined) {
    const i = +b.dataset.hand, id = ui.view.p[ME].hand[i], c = CARDS[id];
    if (c.kind === 'Spell') { ui.sel = ui.sel && ui.sel.kind === 'card' && ui.sel.hand === i ? null : { kind: 'card', id, hand: i }; render(); return; }
    return doAct({ t: 'play', card: id });
  }
  if (b && !b.disabled) {
    if (b.id === 'rematch' || b.id === 'newmatch') return startMatch();
    if (b.id === 'endturn') return myEndTurn();
  }
  if (ui.sel) { ui.sel = null; render(); }
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && ui.sel) { ui.sel = null; render(); } });
startMatch();

})();
</script>
