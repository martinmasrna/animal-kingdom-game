<title>Duel Toy 6</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
:root {
  --bg: #2a3340; --table: #3b4a5c; --paper: #fbf7ee; --ink: #1b1b1b;
  --me: #4f8fe8; --him: #e0673f; --dmg: #ff6a4d; --gold: #f2b632;
  --F: #6c9bd1; --B: #8a7cc0; --S: #d2483c; --G: #5f7891;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: #fff; overflow: hidden; }
body { font: 15px/1.25 -apple-system, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; user-select: none; -webkit-user-select: none; }
button { font: inherit; cursor: pointer; }

#app { height: 100%; display: grid; grid-template-columns: 200px minmax(0, 1fr) 200px; gap: 16px; padding: 12px max(16px, env(safe-area-inset-right, 0px)) 12px max(16px, env(safe-area-inset-left, 0px)); }
#game { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 14px; min-height: 0; }

/* hands */
.hand { display: flex; justify-content: center; gap: 14px; }
.card { position: relative; width: 120px; height: 150px; border-radius: 12px; border: 3px solid #d5c39f; background: var(--paper); color: var(--ink); padding: 0; display: flex; flex-direction: column; box-shadow: 0 4px 10px rgba(0,0,0,.4); transition: transform .12s, opacity .25s, filter .25s; }
.card .art { margin: 5px 5px 0; height: 66px; border-radius: 8px; display: flex; align-items: center; justify-content: center; gap: 4px; color: #fff; }
.card .art svg { width: 38px; height: 38px; }
.card .art b { font-size: 34px; font-weight: 900; text-shadow: 0 2px 3px rgba(0,0,0,.35); }
.card .nm { font-weight: 800; font-size: 16px; padding: 5px 8px 0; text-align: left; }
.card .tx { font-size: 13px; padding: 2px 8px; text-align: left; color: #3a352c; line-height: 1.2; }
.card.F .art { background: var(--F); } .card.B .art { background: var(--B); } .card.S .art { background: var(--S); } .card.G .art { background: var(--G); }
.card.spent { opacity: .28; filter: grayscale(1); }
#myhand .card.ok { border-color: #5fdc6f; box-shadow: 0 0 12px rgba(95,220,111,.6), 0 4px 10px rgba(0,0,0,.4); }
#myhand .card.ok:hover { transform: translateY(-8px); }
#myhand .card:disabled { cursor: default; }
#opphand .card { width: 100px; height: 126px; }
#opphand .card .art { height: 52px; }
#opphand .card .tx { display: none; }
.card.played { animation: played .5s ease-out; }
@keyframes played { 0% { transform: scale(1.12); box-shadow: 0 0 24px rgba(242,182,50,.9); } }

/* the line */
#arena { display: flex; align-items: center; justify-content: center; min-height: 0; }
#line { position: relative; width: min(760px, 100%); height: 170px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.cell { border-radius: 14px; background: var(--table); box-shadow: inset 0 0 20px rgba(0,0,0,.35); }
.fighter { position: absolute; top: 50%; width: 112px; height: 112px; margin: -56px 0 0 -56px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 40px; font-weight: 900; color: #fff; text-shadow: 0 2px 3px rgba(0,0,0,.4); border: 5px solid #fff; transition: left .35s cubic-bezier(.3,.8,.3,1); box-shadow: 0 6px 16px rgba(0,0,0,.5); }
.fighter.me { background: radial-gradient(circle at 35% 30%, #8cbcff, var(--me)); }
.fighter.him { background: radial-gradient(circle at 35% 30%, #ffb08a, var(--him)); }
.fighter.turn { box-shadow: 0 0 0 6px rgba(242,182,50,.55), 0 6px 16px rgba(0,0,0,.5); }
.fighter .shield { position: absolute; top: -18px; right: -14px; width: 44px; height: 50px; }
.fighter.hit { animation: hit .35s; }
@keyframes hit { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-10px); } 50% { transform: translateX(8px); } 75% { transform: translateX(-4px); } }
.float { position: absolute; z-index: 30; pointer-events: none; font-weight: 900; font-size: 40px; transform: translate(-50%, -50%); animation: floatup 1.1s ease-out forwards; text-shadow: 0 2px 0 rgba(0,0,0,.5); white-space: nowrap; }
.float.dmg { color: var(--dmg); } .float.block { color: #dfe9f3; font-size: 28px; } .float.miss { color: #9fb0c2; font-size: 26px; }
@keyframes floatup { 0% { opacity: 0; transform: translate(-50%, -20%) scale(.6); } 15% { opacity: 1; transform: translate(-50%, -60%) scale(1.1); } 70% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -130%); } }
.think { position: absolute; left: 50%; bottom: -34px; transform: translateX(-50%); display: flex; gap: 6px; }
.think i { width: 9px; height: 9px; border-radius: 50%; background: #cfd6de; animation: dot 1s infinite; }
.think i:nth-child(2) { animation-delay: .15s; } .think i:nth-child(3) { animation-delay: .3s; }
@keyframes dot { 0%,100% { opacity: .2; } 50% { opacity: 1; } }

/* sides */
#history { display: flex; flex-direction: column; justify-content: flex-end; gap: 4px; overflow: hidden; min-height: 0; }
.hist { display: flex; align-items: center; gap: 6px; padding: 5px 8px; border-radius: 6px; background: rgba(0,0,0,.25); font-size: 14px; border-left: 4px solid; }
.hist.me { border-color: var(--me); } .hist.him { border-color: var(--him); }
.hist .hn { font-weight: 700; flex: 1; } .hist .ho { font-weight: 800; }
.ho.dmg { color: #ff8a70; } .ho.block { color: #c6d4e2; } .ho.miss { color: #8d9aa8; }
#side { display: flex; flex-direction: column; gap: 10px; align-items: stretch; }
#levels { display: flex; flex-direction: column; gap: 6px; }
#levels button, #restart { min-height: 40px; border-radius: 8px; border: 2px solid #5b6a7a; background: transparent; color: #dfe5eb; font-weight: 700; }
#levels button.on { background: #fff; color: var(--ink); border-color: #fff; }

#over { position: fixed; inset: 0; z-index: 40; display: none; align-items: center; justify-content: center; flex-direction: column; gap: 18px; background: rgba(10,14,20,.6); }
#over.show { display: flex; }
#over h2 { margin: 0; font-size: 64px; font-weight: 900; }
#over h2.win { color: #ffd36b; } #over h2.lose { color: #ff8a70; }
#over button { min-height: 50px; padding: 0 22px; border-radius: 10px; border: 0; font-weight: 800; font-size: 17px; background: var(--gold); color: #2a1d00; }

/* Toy 6 */
.card { width: 112px; }
.card.T .art { background: #b07a2a; } .card.Z .art { background: #3f8f53; }
.cost { position: absolute; top: -9px; left: -9px; z-index: 2; width: 28px; height: 28px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #8cc2ff, #1f62c4); border: 2px solid #fff; color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 15px; }
.card.picked { opacity: 1 !important; filter: none !important; transform: translateY(-6px) scale(1.06); border-color: #f2b632; box-shadow: 0 0 20px rgba(242,182,50,.8), 0 4px 10px rgba(0,0,0,.4); }
#opphand .card { width: 92px; }
#opphand .card.picked { transform: translateY(6px) scale(1.08); }
.fighter .stam { position: absolute; bottom: -30px; left: 50%; transform: translateX(-50%); display: flex; gap: 2px; }
.fighter .stam i { width: 9px; height: 12px; clip-path: polygon(50% 0, 100% 30%, 100% 70%, 50% 100%, 0 70%, 0 30%); background: #1d2a38; }
.fighter .stam i.on { background: linear-gradient(180deg, #ffe08a, #f2b632); }
.fighter.off { transform: rotate(-14deg); filter: saturate(.5) brightness(.85); }
.fighter.him.off { transform: rotate(14deg); }
.hist.sep { height: 0; padding: 0; margin: 3px 0; border: 0; border-top: 1px solid rgba(255,255,255,.12); background: none; }

</style>

<div id="app">
  <aside id="history"></aside>
  <main id="game">
    <div id="opphand" class="hand"></div>
    <div id="arena"><div id="line"></div></div>
    <div id="myhand" class="hand"></div>
  </main>
  <aside id="side">
    <div id="levels"></div>
    <button id="restart">Restart</button>
  </aside>
  <div id="over"></div>
</div>
<script>
(function () {
"use strict";
// ---- src/engine.js
// Toy 6: the stamina duel, both choosing at once.
// Two fighters on a line, health and stamina. Each round both pick one action in secret,
// then reveal. Everything happens at the same moment: steps settle first, then blows land.
//   Step forward / Step back: 1 stamina. Two steps into the same tile: neither moves.
//   Strike: 3 stamina, 3 damage if adjacent after the steps. Stopped by a guard.
//   Guard: 2 stamina, stops the other's strike this round.
//   Rest: free; you recover double this round.
// At the end of every round both recover REGEN stamina (Rest: twice that), never above the cap.
// Pure from the outside: resolve() returns a new state.

const R = { recovery: false, grab: false, grabCost: 2, grabDmg: 3, lunge: false, lungeCost: 4, len: 5, hp: 20, stamina: 10, cap: 10, regen: 2, strike: 3, strikeCost: 3, guardCost: 2, stepCost: 1, roundLimit: 60 };
function setRules(o) { Object.assign(R, o); }

const ACTIONS_BASE = ['F', 'B', 'S', 'G', 'Z']; // forward, back, strike, guard, rest; L = lunge (step in and strike)
const actions = () => ACTIONS_BASE.concat(R.lunge ? ['L'] : [], R.grab ? ['T'] : []);
const COST = (a) => ({ F: R.stepCost, B: R.stepCost, S: R.strikeCost, G: R.guardCost, Z: 0, L: R.lungeCost, T: R.grabCost })[a];

function newMatch() {
  return { pos: [0, R.len - 1], hp: [R.hp, R.hp], st: [R.stamina, R.stamina], off: [0, 0], round: 1, winner: null };
}
function legal(s, side) { return actions().filter(a => COST(a) <= s.st[side] && !(s.off && s.off[side] && !['F', 'B', 'Z'].includes(a))); }

function resolve(s, acts, ev) {
  const t = { pos: s.pos.slice(), hp: s.hp.slice(), st: s.st.slice(), off: [0, 0], round: s.round + 1, winner: null };
  const e = (x) => { ev && ev.push(x); if (R.recovery && ['miss', 'blocked', 'grabfail', 'grabclash'].includes(x.t)) t.off[x.side] = 1; };
  for (const i of [0, 1]) t.st[i] -= COST(acts[i]);
  // steps: player 0 faces right (+1), player 1 faces left (-1)
  const dir = [1, -1];
  const want = [0, 1].map(i => (acts[i] === 'F' || acts[i] === 'L') ? t.pos[i] + dir[i] : acts[i] === 'B' ? t.pos[i] - dir[i] : t.pos[i]);
  for (const i of [0, 1]) if (want[i] < 0 || want[i] >= R.len) { want[i] = t.pos[i]; if (acts[i] === 'B') e({ t: 'wall', side: i }); }
  if (want[0] === want[1]) { e({ t: 'clash' }); want[0] = t.pos[0]; want[1] = t.pos[1]; } // both into one tile: neither moves
  else if (want[0] > want[1]) { want[0] = t.pos[0]; want[1] = t.pos[1]; }                 // can't pass through
  else {
    // a step into the tile the other is standing on (and not leaving) is stopped
    if (want[0] === t.pos[1] && want[1] === t.pos[1]) want[0] = t.pos[0];
    if (want[1] === t.pos[0] && want[0] === t.pos[0]) want[1] = t.pos[1];
  }
  for (const i of [0, 1]) if (want[i] !== t.pos[i]) { e({ t: 'step', side: i, from: t.pos[i], to: want[i] }); t.pos[i] = want[i]; }
  // blows
  const adj = t.pos[1] - t.pos[0] === 1;
  for (const i of [0, 1]) if (acts[i] === 'S' || acts[i] === 'L') {
    const o = 1 - i;
    if (!adj) e({ t: 'miss', side: i });
    else if (acts[o] === 'G') e({ t: 'blocked', side: i });
    else { t.hp[o] -= R.strike; e({ t: 'hit', side: i, dmg: R.strike }); }
  }
  // grabs: work only when adjacent; a strike beats a grab (the grabber is hit and the grab fails); two grabs cancel
  for (const i of [0, 1]) if (acts[i] === 'T') {
    const o = 1 - i;
    if (!adj) e({ t: 'miss', side: i });
    else if (acts[o] === 'S' || acts[o] === 'L') e({ t: 'grabfail', side: i });
    else if (acts[o] === 'T') e({ t: 'grabclash', side: i });
    else { t.hp[o] -= R.grabDmg; e({ t: 'grab', side: i, dmg: R.grabDmg }); }
  }
  for (const i of [0, 1]) if (acts[i] === 'G' && acts[1 - i] !== 'S') e({ t: 'idleguard', side: i });
  // recovery
  for (const i of [0, 1]) t.st[i] = Math.min(R.cap, t.st[i] + (acts[i] === 'Z' ? 2 * R.regen : R.regen));
  const a = t.hp[0] <= 0, b = t.hp[1] <= 0;
  if (a || b) t.winner = a && b ? 'draw' : a ? 1 : 0;
  else if (t.round > R.roundLimit) t.winner = R.timeDecides ? (t.hp[0] === t.hp[1] ? 'draw' : t.hp[0] > t.hp[1] ? 0 : 1) : 'draw';
  if (t.winner !== null) e({ t: 'end', winner: t.winner });
  return t;
}

// ---- src/bot.js
// Toy 6 bots. A round is a small simultaneous game (up to 5 actions each), so a bot
// fills the table of every pair of actions with the value of where that pair leads,
// and plays the mixed strategy that table calls for. Depth is how many rounds ahead
// the table looks. Everything is visible except the choice itself, so no sampling.

function makeRng(seed) {
  let a = (seed >>> 0) || 0x9e3779b9;
  return function () {
    let t = (a = (a + 0x6D2B79F5) | 0);
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

const W = { st: 0.4 };
function evaluate(s, side) {
  if (s.winner !== null) return s.winner === 'draw' ? 0 : s.winner === side ? 1000 : -1000;
  const v = (s.hp[side] - s.hp[1 - side]) + W.st * (s.st[side] - s.st[1 - side]);
  // with a time limit, a health lead is worth more the closer the end is
  return R.timeDecides ? v * (1 + 2 * Math.min(1, (s.round - 1) / R.roundLimit)) : v;
}

// Zero-sum matrix game by regret matching: returns the row mix, the column mix and the value.
function solve(A, R_, C, iters = 300) {
  const rr = new Float64Array(R_), cr = new Float64Array(C), rs = new Float64Array(R_), cs = new Float64Array(C);
  const x = new Float64Array(R_), y = new Float64Array(C);
  const mix = (reg, out) => { let s = 0; for (let i = 0; i < reg.length; i++) s += reg[i] > 0 ? reg[i] : 0; for (let i = 0; i < reg.length; i++) out[i] = s > 0 ? (reg[i] > 0 ? reg[i] / s : 0) : 1 / reg.length; };
  for (let it = 0; it < iters; it++) {
    mix(rr, x); mix(cr, y);
    let v = 0;
    const ur = new Float64Array(R_), uc = new Float64Array(C);
    for (let r = 0; r < R_; r++) for (let c = 0; c < C; c++) { const a = A[r * C + c]; ur[r] += a * y[c]; uc[c] -= a * x[r]; }
    for (let r = 0; r < R_; r++) v += x[r] * ur[r];
    for (let r = 0; r < R_; r++) { rr[r] = Math.max(0, rr[r] + ur[r] - v); rs[r] += x[r]; }
    for (let c = 0; c < C; c++) { cr[c] = Math.max(0, cr[c] + uc[c] + v); cs[c] += y[c]; }
  }
  let ts = 0, tc = 0; for (const a of rs) ts += a; for (const a of cs) tc += a;
  const X = Array.from(rs, a => a / ts), Y = Array.from(cs, a => a / tc);
  let val = 0; for (let r = 0; r < R_; r++) for (let c = 0; c < C; c++) val += X[r] * Y[c] * A[r * C + c];
  return { x: X, y: Y, v: val };
}

function table(s, side, depth) {
  const mine = legal(s, side), his = legal(s, 1 - side);
  const A = new Float64Array(mine.length * his.length);
  for (let r = 0; r < mine.length; r++) for (let c = 0; c < his.length; c++) {
    const acts = side === 0 ? [mine[r], his[c]] : [his[c], mine[r]];
    A[r * his.length + c] = value(resolve(s, acts), side, depth - 1);
  }
  return { mine, his, A };
}
function value(s, side, depth) {
  if (s.winner !== null || depth === 0) return evaluate(s, side);
  const { mine, his, A } = table(s, side, depth);
  return solve(A, mine.length, his.length, 120).v;
}
function sample(rng, xs, ps) { let r = rng(); for (let i = 0; i < xs.length; i++) { r -= ps[i]; if (r <= 0) return xs[i]; } return xs[xs.length - 1]; }

const randomBot = (s, side, rng) => { const l = legal(s, side); return l[Math.floor(rng() * l.length)]; };
// Weak: the best action against an opponent who picks at random, one round ahead.
const weakBot = (s, side, rng) => {
  const { mine, his, A } = table(s, side, 1);
  let best = [], bv = -Infinity;
  mine.forEach((m, r) => { let v = 0; for (let c = 0; c < his.length; c++) v += A[r * his.length + c] / his.length; if (v > bv + 1e-9) { bv = v; best = [m]; } else if (Math.abs(v - bv) <= 1e-9) best.push(m); });
  return best[Math.floor(rng() * best.length)];
};
// Normal and expert: the equilibrium mix, looking `depth` rounds ahead.
const mixBot = (depth) => (s, side, rng) => {
  const { mine, his, A } = table(s, side, depth);
  const { x } = solve(A, mine.length, his.length, 400);
  return sample(rng, mine, x);
};

// ---- src/ui.js
// Toy 6 as a page: both pick one action at once; the round resolves (steps first, then blows).


setRules({ recovery: true, grab: true, len: 4 });
const L = R.len, ME = 0, BOT = 1;
const bot = mixBot(2);
const ui = { s: null, busy: false, hist: [], shown: null, rng: makeRng((Date.now() ^ (Math.random() * 1e9)) >>> 0), token: 0, picks: [null, null] };
const $ = (id) => document.getElementById(id);
const wait = (ms) => new Promise(r => setTimeout(r, ms));

const ORDER = ['F', 'B', 'S', 'G', 'T', 'Z'];
const ICON = {
  F: '<svg viewBox="0 0 24 24" fill="#fff"><path d="M4 10h10V5l7 7-7 7v-5H4z"/></svg>',
  B: '<svg viewBox="0 0 24 24" fill="#fff"><path d="M20 10H10V5l-7 7 7 7v-5h10z"/></svg>',
  S: '<svg viewBox="0 0 24 24" fill="#fff"><path d="M14.5 2.5 21.5 2.5 21.5 9.5 10 21l-2-2-2.6 2.6-2.8-2.8L5.2 16.2l-2-2Z"/></svg>',
  G: '<svg viewBox="0 0 24 24" fill="#fff"><path d="M12 2 20 5v6c0 5-3.5 9-8 11-4.5-2-8-6-8-11V5Z"/></svg>',
  T: '<svg viewBox="0 0 24 24" fill="#fff"><path d="M7 3h3v8h1V2h3v9h1V4h3v11c0 4-3 7-7 7s-7-3-7-7v-4h3v3h1V3z"/></svg>',
  Z: '<svg viewBox="0 0 24 24" fill="#fff"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z"/></svg>',
};
const FACE = {
  F: ['Forward', 'Step 1 closer.'],
  B: ['Back', 'Step 1 away.'],
  S: ['Strike', `${R.strike} damage up close. Beats a grab.`],
  G: ['Guard', 'Stops his strike this round.'],
  T: ['Grab', `${R.grabDmg} damage up close. Beats a guard.`],
  Z: ['Rest', `Recover ${2 * R.regen} stamina instead of ${R.regen}.`],
};
const shieldSVG = '<svg class="shield" viewBox="0 0 46 54"><path d="M23 2 43 9v15c0 13-9 22-20 28C12 46 3 37 3 24V9Z" fill="#5f7891" stroke="#fff" stroke-width="3"/></svg>';

function cardHTML(a, { cls = '', attrs = '' } = {}) {
  const big = a === 'S' ? `<b>${R.strike}</b>` : a === 'T' ? `<b>${R.grabDmg}</b>` : '';
  return `<button class="card ${a} ${cls}" ${attrs}><span class="cost">${COST(a)}</span><div class="art">${ICON[a]}${big}</div><div class="nm">${FACE[a][0]}</div><div class="tx">${FACE[a][1]}</div></button>`;
}

function render() {
  const s = ui.shown;
  const mine = ui.busy || s.winner !== null ? [] : legal(s, ME);
  $('myhand').innerHTML = ORDER.map(a => cardHTML(a, { cls: (mine.includes(a) ? 'ok' : (ui.busy ? '' : 'spent')) + (ui.picks[ME] === a ? ' picked' : ''), attrs: `data-a="${a}"${mine.includes(a) ? '' : ' disabled'}` })).join('');
  $('opphand').innerHTML = ORDER.map(a => cardHTML(a, { cls: (ui.picks[BOT] === a ? 'picked' : ui.picks[BOT] ? 'spent' : (legal(s, BOT).includes(a) ? '' : 'spent')), attrs: 'disabled' })).join('');
  let line = '';
  for (let k = 0; k < L; k++) line += '<div class="cell"></div>';
  for (const side of [ME, BOT]) {
    const left = ((s.pos[side] + 0.5) / L) * 100;
    let gems = ''; for (let i = 0; i < R.cap; i++) gems += `<i class="${i < s.st[side] ? 'on' : ''}"></i>`;
    const off = s.off && s.off[side] ? ' off' : '';
    const guard = ui.guardUp && ui.guardUp[side] ? shieldSVG : '';
    line += `<div class="fighter ${side === ME ? 'me' : 'him'}${off}" id="f${side}" style="left:${left}%">${Math.max(0, s.hp[side])}${guard}<div class="stam">${gems}</div></div>`;
  }
  $('line').innerHTML = line;
  $('history').innerHTML = ui.hist.slice(-22).map(h => h.sep ? '<div class="hist sep"></div>' : `<div class="hist ${h.who}"><span class="hn">${FACE[h.a][0]}</span><span class="ho ${h.cls}">${h.out}</span></div>`).join('');
  $('levels').innerHTML = '';
}

function floatAt(side, text, cls) {
  const f = $('f' + side); if (!f) return;
  const a = $('line').getBoundingClientRect(), r = f.getBoundingClientRect();
  const el = document.createElement('div');
  el.className = 'float ' + cls; el.textContent = text;
  el.style.left = (r.left - a.left + r.width / 2) + 'px'; el.style.top = (r.top - a.top - 10) + 'px';
  $('line').appendChild(el);
  setTimeout(() => el.remove(), 1200);
}
function hit(side) { const f = $('f' + side); if (f) { f.classList.remove('hit'); void f.offsetWidth; f.classList.add('hit'); } }

async function play(a) {
  if (ui.busy || ui.s.winner !== null) return;
  const tok = ui.token;
  ui.busy = true; ui.picks = [a, null]; render();
  await wait(250);
  const b = bot(ui.s, BOT, ui.rng);
  if (tok !== ui.token) return;
  ui.picks = [a, b]; render();               // reveal
  await wait(700);
  const prev = ui.s, ev = [];
  const next = resolve(prev, [a, b], ev);
  // 1. steps
  ui.shown = { ...prev, pos: next.pos.slice(), st: prev.st.map((x, i) => x - COST([a, b][i])), off: [0, 0] };
  ui.guardUp = [a === 'G' ? 1 : 0, b === 'G' ? 1 : 0];
  render();
  for (const e of ev) if (e.t === 'clash') { floatAt(ME, 'Bump', 'miss'); floatAt(BOT, 'Bump', 'miss'); }
  await wait(450);
  // 2. blows
  const out = [{ out: '', cls: '' }, { out: '', cls: '' }];
  ui.shown = { ...ui.shown, hp: next.hp.slice() };
  render();
  for (const e of ev) {
    const o = 1 - e.side;
    if (e.t === 'hit' || e.t === 'grab') { floatAt(o, '−' + e.dmg, 'dmg'); hit(o); out[e.side] = { out: '−' + e.dmg, cls: 'dmg' }; }
    if (e.t === 'blocked') { floatAt(o, 'Blocked', 'block'); out[e.side] = { out: 'blocked', cls: 'block' }; }
    if (e.t === 'miss') { floatAt(o, 'Miss', 'miss'); out[e.side] = { out: 'miss', cls: 'miss' }; }
    if (e.t === 'grabfail') { floatAt(e.side, 'Grab stopped', 'miss'); out[e.side] = { out: 'stopped', cls: 'miss' }; }
    if (e.t === 'grabclash') out[e.side] = { out: 'clash', cls: 'miss' };
  }
  ui.hist.push({ who: 'me', a, ...out[ME] }, { who: 'him', a: b, ...out[BOT] }, { sep: true });
  await wait(900);
  // 3. recovery, next round
  ui.s = next; ui.shown = next; ui.picks = [null, null]; ui.guardUp = [0, 0];
  ui.busy = false;
  render();
  if (next.winner !== null) finish();
}

function finish() {
  const w = ui.s.winner;
  const t = w === 'draw' ? ['Draw', ''] : w === ME ? ['Victory', 'win'] : ['Defeat', 'lose'];
  $('over').innerHTML = `<h2 class="${t[1]}">${t[0]}</h2><button id="again">Play again</button>`;
  $('over').classList.add('show');
}

function start() {
  ui.token++;
  ui.s = newMatch(); ui.shown = ui.s; ui.hist = []; ui.busy = false; ui.picks = [null, null]; ui.guardUp = [0, 0];
  $('over').classList.remove('show');
  render();
}

document.addEventListener('click', (e) => {
  const t = e.target.closest('button');
  if (!t || t.disabled) return;
  if (t.dataset.a) { play(t.dataset.a); return; }
  if (t.id === 'restart' || t.id === 'again') start();
});
start();

})();
</script>
