<title>Duel Toy 1</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
:root {
  --bg: #2a3340; --table: #3b4a5c; --table2: #34424f; --ink: #1b1b1b; --paper: #fbf7ee; --mute: #6b6457;
  --mana: #3d8bf2; --dmg: #e5482f; --heal: #3fae5a; --guard: #8fa6bd; --wind: #f0a830;
  --light: #e0673f; --heavy: #9e2328; --defence: #5f7891; --setup: #3f8f53;
  --cardw: 120px; --cardh: 170px;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: #fff; overflow: hidden; }
body { font: 15px/1.25 -apple-system, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
button { font: inherit; cursor: pointer; }
#app { position: relative; height: 100%; }

/* ---------------- start */
#start { max-width: 460px; margin: 0 auto; padding: 40px max(16px, env(safe-area-inset-left, 0px)); }
#start h1 { margin: 0 0 22px; font-size: 32px; }
.grp { margin-bottom: 16px; }
.lbl { font-weight: 600; margin-bottom: 8px; color: #cfd6de; }
.seg { display: flex; gap: 8px; }
.seg button { flex: 1; min-height: 48px; border-radius: 8px; border: 2px solid #5b6a7a; background: transparent; color: #fff; font-weight: 600; }
.seg button.on { background: #fff; color: var(--ink); border-color: #fff; }
.herodesc { color: #cfd6de; font-size: 14px; margin: 4px 0 18px; }
.herodesc b { color: #fff; }
.go { width: 100%; min-height: 56px; border: 0; border-radius: 10px; background: #f2b632; color: #2a1d00; font-size: 20px; font-weight: 800; }
body:not(.playing) #game { display: none; }
body.playing #start { display: none; }

/* ---------------- game grid */
#game {
  position: relative; height: 100%; max-width: 1100px; margin: 0 auto;
  display: grid; grid-template-rows: 44px auto minmax(150px, 1fr) auto auto;
  grid-template-columns: minmax(0, 1fr);
  padding: 0 max(12px, env(safe-area-inset-right, 0px)) max(8px, env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px));
  row-gap: 8px;
}
#opphand { grid-row: 1; display: flex; justify-content: center; align-items: flex-start; gap: 0; padding-top: 6px; }
.back { width: 26px; height: 36px; border-radius: 4px; background: linear-gradient(135deg, #7a5b9e, #4b3770); border: 2px solid #c9b6e6; margin-left: -6px; box-shadow: 0 2px 4px rgba(0,0,0,.4); }
.back:first-child { margin-left: 0; }
#menu { position: absolute; top: 6px; right: max(12px, env(safe-area-inset-right, 0px)); display: flex; gap: 6px; z-index: 5; }
#menu button { min-height: 32px; padding: 4px 12px; border-radius: 6px; border: 1px solid #5b6a7a; background: rgba(0,0,0,.2); color: #dfe5eb; font-size: 14px; }
#hero1 { grid-row: 2; } #table { grid-row: 3; } #hero0 { grid-row: 4; } #hand { grid-row: 5; }

/* ---------------- hero zone */
.herozone { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 16px; }
.herozone .left { justify-self: end; display: flex; gap: 8px; align-items: center; }
.herozone .right { justify-self: start; display: flex; flex-direction: column; gap: 6px; }
.plate { position: relative; width: 250px; height: 96px; border-radius: 14px; padding: 10px 14px; color: var(--ink);
  background: linear-gradient(180deg, #fffaf0, #eadfc8); border: 3px solid #d5c39f; box-shadow: 0 4px 10px rgba(0,0,0,.35); }
.plate.active { border-color: #f2b632; box-shadow: 0 0 0 3px rgba(242,182,50,.45), 0 4px 10px rgba(0,0,0,.35); }
.hname { font-size: 22px; font-weight: 800; }
.hpass { font-size: 14px; color: var(--mute); margin-top: 2px; line-height: 1.2; padding-right: 34px; }
.hp { position: absolute; right: -16px; bottom: -14px; width: 56px; height: 56px; border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #ff7a5c, #c62d1c); border: 3px solid #fff; color: #fff;
  display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 800; text-shadow: 0 1px 2px rgba(0,0,0,.5); }
.hp.low { animation: lowpulse 1.2s ease-in-out infinite alternate; }
@keyframes lowpulse { to { box-shadow: 0 0 0 5px rgba(229,72,47,.45); } }
.hpmax { display: none;  position: absolute; right: 44px; bottom: 6px; font-size: 14px; color: var(--mute); }
.atk { position: absolute; left: -16px; bottom: -14px; width: 48px; height: 48px; border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #ffd36b, #d08a12); border: 3px solid #fff; color: #2a1d00;
  display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 800; }
.shake { animation: shake .35s; }
@keyframes shake { 0%,100% { transform: translateX(0); } 20% { transform: translateX(-8px); } 40% { transform: translateX(7px); } 60% { transform: translateX(-5px); } 80% { transform: translateX(3px); } }

.guards { display: flex; gap: 6px; min-width: 10px; }
.shield { width: 46px; height: 54px; position: relative; display: flex; align-items: center; justify-content: center; }
.shield svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.shield span { position: relative; font-size: 14px; font-weight: 800; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.6); margin-top: -4px; }
.shield.pop { animation: pop .4s ease-out; }
@keyframes pop { 0% { transform: scale(.3); opacity: 0; } 70% { transform: scale(1.15); opacity: 1; } 100% { transform: scale(1); } }

.mana { display: flex; align-items: center; gap: 3px; }
.gemc { width: 14px; height: 18px; clip-path: polygon(50% 0, 100% 30%, 100% 70%, 50% 100%, 0 70%, 0 30%); background: #1d2a38; }
.gemc.on { background: linear-gradient(180deg, #8cc2ff, var(--mana)); }
.gemc.spend { background: linear-gradient(180deg, #ffe08a, #f2b632); }
.manatxt { font-weight: 800; font-size: 18px; margin-left: 6px; color: #bcd9ff; }
.manatxt small { font-weight: 500; font-size: 14px; color: #9fb0c2; }
.counts { font-size: 14px; color: #b9c4cf; }

/* basics (hero powers) */
.basic { position: relative; width: 62px; height: 62px; border-radius: 50%; border: 3px solid #d5c39f; color: var(--ink);
  background: linear-gradient(180deg, #fffaf0, #e6d9bd); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0; }
.basic b { font-size: 14px; line-height: 1; }
.basic .bn { font-size: 20px; font-weight: 800; line-height: 1; }
.basic .bgem { position: absolute; top: -6px; left: -6px; }
.basic.ok { border-color: #5fdc6f; box-shadow: 0 0 10px rgba(95,220,111,.6); }
.basic:disabled { filter: grayscale(1) brightness(.6); cursor: default; }

/* ---------------- table */
#table { position: relative; border-radius: 18px; background: radial-gradient(ellipse at center, var(--table), var(--table2)); box-shadow: inset 0 0 30px rgba(0,0,0,.35);
  display: grid; grid-template-rows: 1fr 2px 1fr; padding: 6px 150px; min-height: 0; }
#midline { background: rgba(255,255,255,.08); }
.windrow { display: flex; justify-content: center; align-items: center; gap: 10px; min-height: 0; }
.wind { display: flex; align-items: center; gap: 10px; padding: 6px 12px 6px 6px; border-radius: 12px; background: rgba(240,168,48,.14); border: 2px solid var(--wind); box-shadow: 0 0 16px rgba(240,168,48,.35); }
.wind .card { --cardw: 66px; --cardh: 92px; }
.wind .wt { font-size: 14px; color: #ffe2a8; line-height: 1.3; }
.wind .wt b { color: #fff; font-size: 16px; }
.wind.in { animation: pop .45s ease-out; }
#turnbox { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; align-items: center; gap: 8px; }
.pips { display: flex; gap: 6px; }
.pip { width: 14px; height: 14px; border-radius: 50%; border: 2px solid #f2b632; }
.pip.on { background: #f2b632; }
#endturn { width: 124px; min-height: 52px; border-radius: 10px; border: 0; font-weight: 800; font-size: 17px; background: #f2b632; color: #2a1d00; box-shadow: 0 3px 0 #a8770d; }
#endturn.done { background: #5fdc6f; box-shadow: 0 3px 0 #2c8a3a, 0 0 14px rgba(95,220,111,.7); color: #08300f; }
#endturn:disabled { background: #56616d; color: #a9b3bd; box-shadow: none; cursor: default; }

/* ---------------- cards */
.card { position: relative; width: var(--cardw); height: var(--cardh); flex: 0 0 auto; border-radius: 10px; padding: 0; text-align: left;
  background: var(--paper); color: var(--ink); border: 3px solid #d5c39f; box-shadow: 0 4px 8px rgba(0,0,0,.4);
  display: flex; flex-direction: column; overflow: visible; }
.card .art { margin: 4px 4px 0; border-radius: 6px; flex: 0 0 42%; display: flex; align-items: center; justify-content: center; gap: 4px; color: #fff; position: relative; overflow: hidden; }
.card.k-Light .art { background: linear-gradient(160deg, #f08a5d, var(--light)); }
.card.k-Heavy .art { background: linear-gradient(160deg, #c8403f, var(--heavy)); }
.card.k-Defence .art { background: linear-gradient(160deg, #8aa0b6, var(--defence)); }
.card.k-Setup .art { background: linear-gradient(160deg, #6cba7d, var(--setup)); }
.card .art svg { width: 34%; height: auto; opacity: .9; }
.card .big { font-size: calc(var(--cardw) * .3); font-weight: 900; text-shadow: 0 2px 3px rgba(0,0,0,.35); line-height: 1; }
.card .big.up { color: #fff3a0; }
.card .nm { font-weight: 800; font-size: calc(var(--cardw) * .13); padding: 3px 7px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex-shrink: 0; }
.card .tx { font-size: calc(var(--cardw) * .112); padding: 1px 7px; color: #3a352c; line-height: 1.15; flex: 1 1 auto; min-height: 0; overflow: hidden; }
.card .sp { font-size: calc(var(--cardw) * .105); font-weight: 700; padding: 2px 7px 5px; flex-shrink: 0; white-space: nowrap; }
.card .sp.Slow { color: #b06d00; } .card .sp.Fast { color: #2f6fd6; }
.cgem, .bgem { width: 30px; height: 30px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #8cc2ff, #1f62c4); border: 2px solid #fff; color: #fff;
  display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 16px; text-shadow: 0 1px 2px rgba(0,0,0,.5); }
.cgem { position: absolute; top: -9px; left: -9px; z-index: 2; }
.cgem.cheap { background: radial-gradient(circle at 35% 30%, #a9f5b5, #2c9a44); }
.wind .cgem, .hist .cgem { display: none; }
.wind .card .tx, .wind .card .sp { display: none; }

#hand { display: flex; justify-content: center; align-items: flex-end; gap: 8px; padding: 10px 140px 2px; min-height: calc(var(--cardh) + 14px); }
#hand .card { transition: transform .12s; }
#hand .card.ok { border-color: #5fdc6f; box-shadow: 0 0 12px rgba(95,220,111,.7), 0 4px 8px rgba(0,0,0,.4); }
#hand .card.ok:hover { transform: translateY(-10px); }
#hand .card:disabled { cursor: default; }
#hand .card.no { filter: brightness(.62) saturate(.6); }
#hand .card.drawn { animation: drawin .45s ease-out; }
@keyframes drawin { from { transform: translateY(-60px) scale(.6); opacity: 0; } }

/* ---------------- spotlight, floaters, banner */
#spot { position: absolute; left: 50%; top: 40%; z-index: 20; pointer-events: none; }
#spot .card { --cardw: 170px; --cardh: 236px; position: absolute; left: calc(var(--cardw) / -2); top: calc(var(--cardh) / -2); box-shadow: 0 14px 40px rgba(0,0,0,.6); }
#spot .card.from1 { animation: fromtop .32s cubic-bezier(.2,.8,.3,1.1); }
#spot .card.from0 { animation: frombot .32s cubic-bezier(.2,.8,.3,1.1); }
#spot .card.lands { border-color: var(--wind); box-shadow: 0 0 30px rgba(240,168,48,.8), 0 14px 40px rgba(0,0,0,.6); }
#spot .card.out { animation: spotout .22s ease-in forwards; }
#spot .owner { position: absolute; left: -100px; width: 200px; text-align: center; font-weight: 800; font-size: 16px; text-shadow: 0 2px 4px rgba(0,0,0,.7); }
@keyframes fromtop { from { transform: translateY(-260px) scale(.4); opacity: .2; } }
@keyframes frombot { from { transform: translateY(260px) scale(.4); opacity: .2; } }
@keyframes spotout { to { transform: scale(.5); opacity: 0; } }

.float { position: absolute; z-index: 30; pointer-events: none; font-weight: 900; font-size: 34px; text-shadow: 0 2px 0 rgba(0,0,0,.5), 0 0 10px rgba(0,0,0,.4); transform: translate(-50%, -50%); animation: floatup 1.1s ease-out forwards; white-space: nowrap; }
.float.dmg { color: #ff6a4d; font-size: 44px; }
.float.heal { color: #7dff95; }
.float.mana { color: #9fd0ff; }
.float.block { color: #dfe9f3; font-size: 26px; }
.float.warn { color: var(--wind); font-size: 26px; }
.float.gold { color: #ffd36b; font-size: 26px; }
@keyframes floatup { 0% { opacity: 0; transform: translate(-50%, -30%) scale(.6); } 15% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); } 70% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -110%) scale(1); } }

#banner { position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%); text-align: center; z-index: 25; pointer-events: none; font-size: 44px; font-weight: 900; opacity: 0; text-shadow: 0 3px 12px rgba(0,0,0,.7); }
#banner.show { animation: banner 1s ease-out; }
@keyframes banner { 0% { opacity: 0; transform: translateY(-50%) scale(.8); } 20% { opacity: 1; transform: translateY(-50%) scale(1); } 75% { opacity: 1; } 100% { opacity: 0; } }

/* ---------------- history */
#history { position: absolute; left: max(12px, env(safe-area-inset-left, 0px)); top: 52px; bottom: 190px; width: 150px; display: flex; flex-direction: column; justify-content: flex-end; gap: 4px; overflow: hidden; pointer-events: none; }
#peek { position: absolute; z-index: 35; pointer-events: none; }
#peek .card { --cardw: 160px; --cardh: 224px; box-shadow: 0 10px 30px rgba(0,0,0,.6); }
.hist { pointer-events: auto; cursor: default;  display: flex; align-items: center; gap: 6px; padding: 4px 6px; border-radius: 6px; background: rgba(0,0,0,.25); font-size: 14px; border-left: 4px solid; }
.hist.s0 { border-color: #7fb4ff; } .hist.s1 { border-color: #c9b6e6; }
.hist .hn { font-weight: 700; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hist .ho { font-weight: 800; }
.ho.dmg { color: #ff8a70; } .ho.heal { color: #7dff95; } .ho.block { color: #c6d4e2; } .ho.warn { color: var(--wind); } .ho.mana { color: #9fd0ff; }
.hist.sep { background: none; border: 0; padding: 2px 0 0; color: #8d9aa8; font-size: 14px; }

/* ---------------- game over, decks */
#over { position: absolute; inset: 0; z-index: 40; display: none; align-items: center; justify-content: center; flex-direction: column; gap: 18px; background: rgba(10,14,20,.6); }
#over.show { display: flex; }
#over h2 { margin: 0; font-size: 64px; font-weight: 900; text-shadow: 0 4px 16px rgba(0,0,0,.7); }
#over h2.win { color: #ffd36b; } #over h2.lose { color: #ff8a70; }
#over .row { display: flex; gap: 10px; }
#over button { min-height: 50px; padding: 0 22px; border-radius: 10px; border: 0; font-weight: 800; font-size: 17px; background: #f2b632; color: #2a1d00; }
#over button.sec { background: #dfe5eb; color: var(--ink); }

#decks { position: absolute; inset: 0; z-index: 50; display: none; background: rgba(10,14,20,.88); overflow-y: auto; padding: 50px 16px 20px; }
#decks.show { display: block; }
#decks .wrap { max-width: 760px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
#decks h3 { margin: 0 0 2px; }
#decks p { margin: 0 0 8px; color: #b9c4cf; font-size: 14px; }
#decks table { width: 100%; border-collapse: collapse; font-size: 14px; }
#decks th, #decks td { padding: 4px 4px; border-bottom: 1px solid rgba(255,255,255,.12); text-align: right; }
#decks th:first-child, #decks td:first-child { text-align: left; }
#decks th { color: #b9c4cf; font-weight: 600; }
#decks td.z { color: #66717d; }
#decks .x { position: absolute; top: 10px; right: 16px; min-height: 36px; padding: 0 14px; border-radius: 6px; border: 1px solid #5b6a7a; background: transparent; color: #fff; }

/* ---------------- phone */
@media (max-width: 760px) {
  :root { --cardw: 74px; --cardh: 106px; }
  #game { grid-template-rows: 40px auto minmax(110px, 1fr) auto auto; row-gap: 6px; }
  #history { display: none; }
  #table { padding: 6px 8px 6px 8px; }
  #turnbox { right: 8px; }
  #endturn { width: 92px; min-height: 46px; font-size: 15px; }
  #hand { padding: 10px 0 2px; gap: 4px; flex-wrap: wrap; }
  .herozone { gap: 10px; grid-template-columns: auto 1fr; }
  .herozone .left { justify-self: start; grid-row: 1; grid-column: 1; }
  .herozone .mid { grid-row: 1; grid-column: 1; }
  .plate { width: 150px; height: 80px; padding: 8px 10px; }
  .hname { font-size: 18px; }
  .hpass { display: none; }
  .hp { width: 46px; height: 46px; font-size: 20px; right: -12px; bottom: -10px; }
  .hpmax { display: none;  right: 36px; }
  .basic { width: 52px; height: 52px; }
  .gemc { width: 10px; height: 14px; }
  .card .tx { display: none; }
  .card .sp { padding-bottom: 2px; }
  .cgem { width: 24px; height: 24px; font-size: 14px; top: -7px; left: -7px; }
  #spot .card { --cardw: 140px; --cardh: 196px; }
  .wind .card { --cardw: 52px; --cardh: 74px; }
  #decks .wrap { grid-template-columns: 1fr; }
  #menu button { padding: 2px 8px; }
  #opphand { justify-content: flex-start; }
}

/* Toy 1 */
.gemc.off { opacity: .3; }
.plate { height: 80px; display: flex; align-items: center; }
.card .sp { display: none; }
.card .tx { padding-bottom: 6px; }
#start { display: none !important; }
#menu #showdecks { display: inline-block; }

/* deck trackers, left (his) and right (yours), on wide screens */
.trk { display: none; }
@media (min-width: 1100px) {
  #app { display: grid; grid-template-columns: 220px minmax(0, 1fr) 220px; }
  #game { max-width: none; width: 100%; }
  .trk { display: flex; flex-direction: column; gap: 3px; padding: 12px 10px; min-height: 0; overflow-y: auto; }
  #trk1 { padding-left: max(12px, env(safe-area-inset-left, 0px)); }
  #trk0 { padding-right: max(12px, env(safe-area-inset-right, 0px)); }
  #menu #showdecks { display: none; }
}
.trk h3 { margin: 0 0 6px; font-size: 16px; color: #dfe5eb; display: flex; justify-content: space-between; align-items: baseline; }
.trk h3 small { font-size: 14px; font-weight: 500; color: #9fb0c2; }
.trow { display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 8px 0 4px; border-radius: 6px; font-size: 15px; font-weight: 700; color: #fff; }
.trow.Strike { background: linear-gradient(90deg, rgba(224,103,63,.55), rgba(224,103,63,.18)); }
.trow.Guard { background: linear-gradient(90deg, rgba(95,120,145,.75), rgba(95,120,145,.25)); }
.trow .tg { width: 22px; height: 22px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #8cc2ff, #1f62c4); border: 2px solid #fff; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 900; flex: 0 0 auto; }
.trow .tn { flex: 1; }
.trow .tc { color: #ffd36b; font-variant-numeric: tabular-nums; }
.trow.gone { opacity: .3; }
.trk .tsub { margin: 10px 0 4px; font-size: 14px; color: #9fb0c2; }

.swordb { width: 46px; height: 54px; border-radius: 10px; background: linear-gradient(160deg, #c8403f, #9e2328); border: 3px solid #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; animation: pop .4s ease-out; }
.swordb svg { width: 24px; height: 24px; }
.swordb span { font-weight: 900; font-size: 15px; color: #fff; }
.trow.Sword { background: linear-gradient(90deg, rgba(158,35,40,.8), rgba(158,35,40,.3)); }
.ho.gold { color: #ffd36b; }

</style>

<div id="app">
  <div id="start"></div>
  <aside id="trk1" class="trk"></aside>
  <div id="game">
    <div id="opphand"></div>
    <div id="menu"><button id="showdecks">Decks</button><button id="newmatch">Restart</button></div>
    <div id="hero1" class="herozone opp"></div>
    <div id="table">
      <div id="wind1" class="windrow"></div>
      <div id="midline"></div>
      <div id="wind0" class="windrow"></div>
      <div id="turnbox"></div>
    </div>
    <div id="hero0" class="herozone me"></div>
    <div id="hand"></div>
    <div id="history"></div>
    <div id="peek"></div>
    <div id="spot"></div>
    <div id="banner"></div>
    <div id="over"></div>
    <div id="decks"></div>
  </div>
  <aside id="trk0" class="trk"></aside>
</div>
<script>
(function () {
"use strict";
// ---- src/engine.js
// Toy 1: the smallest duel. Two identical characters, 30 health, Hearthstone mana,
// one shared deck list of two kinds of card: Strike (deal N) and Guard (absorb N
// until your next turn). Pure from the outside: transitions clone the state.

const HP = 30, MAX_MANA = 10, TURN_LIMIT = 80;
// Energy: both start full at 10; unspent energy is kept; each turn you regain REGEN, never above 10.
let REGEN = 4;
function setRegen(r) { REGEN = r; }

// A Strike deals what it costs; a Guard absorbs twice what it costs (Martin, 2026-11-26).
const CARDS = {};
for (let c = 1; c <= 6; c++) CARDS['S' + c] = { id: 'S' + c, kind: 'Strike', cost: c, n: c };
for (let c = 1; c <= 4; c++) CARDS['G' + c] = { id: 'G' + c, kind: 'Guard', cost: c, n: 2 * c };
// Investments under test, each costing 3, three copies replacing the three Strike 1s:
//   Whetstone: your strikes deal 1 more for the rest of the match (stacks, nothing removes it).
//   Sword: while you hold it your strikes deal 2 more; you drop it when a strike gets through your guard.
//   Training: you regain 1 more energy each turn for the rest of the match (stacks).
CARDS.W = { id: 'W', kind: 'Whetstone', cost: 3, n: 1 };
CARDS.SW = { id: 'SW', kind: 'Sword', cost: 3, n: 2 };
CARDS.T = { id: 'T', kind: 'Training', cost: 3, n: 1 };
const DECK = { S1: 3, S2: 3, S3: 3, S4: 3, S5: 3, S6: 3, G1: 3, G2: 3, G3: 3, G4: 3 };
let VARIANT = null;
function setVariant(v) {
  VARIANT = v;
  for (const k of ['W', 'SW', 'T']) delete DECK[k];
  if (v) { delete DECK.S1; DECK[v] = 3; } else DECK.S1 = 3;
}

function deckList() {
  const out = [];
  for (const [id, k] of Object.entries(DECK)) for (let i = 0; i < k; i++) out.push(id);
  return out;
}

function rand(s) {
  let t = (s.seed = (s.seed + 0x6D2B79F5) | 0);
  t = Math.imul(t ^ (t >>> 15), t | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
function shuffleInPlace(s, a) {
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rand(s) * (i + 1)); const x = a[i]; a[i] = a[j]; a[j] = x; }
  return a;
}

function newPlayer() { return { hp: HP, maxHp: HP, mana: MAX_MANA, turns: 0, block: 0, edge: 0, sword: 0, regenUp: 0, hand: [], deck: deckList(), played: [] }; }
// damage a strike of this player deals
function strikeDmg(p, id) { return CARDS[id].n + p.edge + p.sword; }
function clonePlayer(p) { return { ...p, hand: p.hand.slice(), deck: p.deck.slice(), played: p.played.slice() }; }
function clone(s) { return { ...s, p: [clonePlayer(s.p[0]), clonePlayer(s.p[1])] }; }

function emit(s, ev, e) { if (ev) { e.round = s.turnNo; ev.push(e); } }
function draw(s, side, n) {
  const p = s.p[side]; let d = 0;
  for (let i = 0; i < n && p.deck.length; i++) { p.hand.push(p.deck.shift()); d++; }
  return d;
}

function newMatch({ seed }) {
  const s = { seed: (seed >>> 0) || 1, turnNo: 0, turn: 0, first: 0, winner: null, p: [newPlayer(), newPlayer()] };
  for (const p of s.p) shuffleInPlace(s, p.deck);
  s.first = rand(s) < 0.5 ? 0 : 1;
  draw(s, s.first, 3); draw(s, 1 - s.first, 4);
  s.turn = s.first;
  mStartTurn(s, null);
  return s;
}

function mStartTurn(s, ev) {
  const side = s.turn, p = s.p[side];
  s.turnNo++;
  emit(s, ev, { t: 'turn', side });
  if (p.block) emit(s, ev, { t: 'expire', side, n: p.block });
  p.block = 0;
  const before = p.mana;
  if (p.turns > 0) p.mana = Math.min(MAX_MANA, p.mana + REGEN + p.regenUp);
  p.turns++;
  const drew = draw(s, side, 1);
  emit(s, ev, { t: 'start', side, mana: p.mana, gain: p.mana - before, drew });
}

function checkWin(s, ev) {
  if (s.winner !== null) return true;
  const a = s.p[0].hp <= 0, b = s.p[1].hp <= 0;
  if (!a && !b) return false;
  s.winner = a && b ? 'draw' : a ? 1 : 0;
  emit(s, ev, { t: 'end', winner: s.winner });
  return true;
}

function canPlay(s, id) {
  if (s.winner !== null || !CARDS[id]) return false;
  const p = s.p[s.turn];
  if (CARDS[id].kind === 'Sword' && p.sword) return false;
  return p.hand.includes(id) && CARDS[id].cost <= p.mana;
}
function legalActions(s) {
  if (s.winner !== null) return [];
  return [...new Set(s.p[s.turn].hand)].filter(id => canPlay(s, id));
}

function mPlay(s, id, ev) {
  if (!canPlay(s, id)) throw new Error('play: illegal ' + id);
  const side = s.turn, p = s.p[side], o = s.p[1 - side], c = CARDS[id];
  p.mana -= c.cost;
  p.hand.splice(p.hand.indexOf(id), 1);
  p.played.push(id);
  emit(s, ev, { t: 'play', side, card: id, mana: p.mana });
  if (c.kind === 'Strike') {
    const total = strikeDmg(p, id);
    const absorbed = Math.min(o.block, total);
    o.block -= absorbed;
    if (absorbed) emit(s, ev, { t: 'stop', side: 1 - side, n: absorbed, block: o.block });
    const dmg = total - absorbed;
    if (dmg) {
      o.hp -= dmg; emit(s, ev, { t: 'hit', side, dmg });
      if (o.sword) { o.sword = 0; emit(s, ev, { t: 'drop', side: 1 - side }); }
    }
    checkWin(s, ev);
  } else if (c.kind === 'Whetstone') {
    p.edge += c.n; emit(s, ev, { t: 'edge', side, total: p.edge });
  } else if (c.kind === 'Sword') {
    p.sword = c.n; emit(s, ev, { t: 'sword', side });
  } else if (c.kind === 'Training') {
    p.regenUp += c.n; emit(s, ev, { t: 'train', side, total: REGEN + p.regenUp });
  } else {
    p.block += c.n;
    emit(s, ev, { t: 'guard', side, n: c.n, block: p.block });
  }
}
function mEndTurn(s, ev) {
  if (s.winner !== null) throw new Error('endTurn: match over');
  if (s.turnNo >= TURN_LIMIT) { s.winner = 'draw'; emit(s, ev, { t: 'end', winner: 'draw' }); return; }
  s.turn = 1 - s.turn;
  mStartTurn(s, ev);
}

function playAction(s, id, ev) { const t = clone(s); mPlay(t, id, ev); return t; }
function endTurn(s, ev) { const t = clone(s); mEndTurn(t, ev); return t; }
function _play(t, id) { mPlay(t, id, null); return t; }
function _endTurn(t) { mEndTurn(t, null); return t; }

// Per card of the list: copies, played, and (for the viewer's own side) in hand / in deck.
function deckSummary(s, side) {
  const p = s.p[side], cnt = (a) => a.reduce((m, x) => (m[x] = (m[x] || 0) + 1, m), {});
  const pl = cnt(p.played), h = cnt(p.hand), d = cnt(p.deck);
  return Object.entries(DECK).map(([id, total]) => ({ id, total, played: pl[id] || 0, inHand: h[id] || 0, inDeck: d[id] || 0, unseen: total - (pl[id] || 0) }));
}

// ---- src/bot.js
// The Toy 1 bot. A turn is a set of cards; the bot plays investments first, then
// strikes, then guards, so only the set matters. It picks the set whose worst case
// over the opponent's best reply is best, averaged over hands the opponent could
// hold. It never reads his hand or either deck order.

function makeRng(seed) {
  let a = (seed >>> 0) || 0x9e3779b9;
  return function () {
    let t = (a = (a + 0x6D2B79F5) | 0);
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// Every distinct affordable set of cards: strike count and sum, guard sum, investments.
function turnSets(hand, mana, holdsSword = false) {
  const counts = {};
  for (const id of hand) counts[id] = (counts[id] || 0) + 1;
  const ids = Object.keys(counts);
  const out = [];
  (function rec(i, left, acc, cards) {
    if (i === ids.length) { out.push({ ...acc, n: cards.length, cost: mana - left, cards: cards.slice() }); return; }
    const c = CARDS[ids[i]];
    let max = counts[ids[i]];
    if (c.kind === 'Sword') max = holdsSword ? 0 : Math.min(max, 1);
    for (let k = 0; k <= max; k++) {
      if (k * c.cost > left) break;
      for (let j = 0; j < k; j++) cards.push(ids[i]);
      const a = { ...acc };
      if (c.kind === 'Strike') { a.sc += k; a.ss += k * c.n; }
      else if (c.kind === 'Guard') a.grd += k * c.n;
      else if (c.kind === 'Whetstone') a.edge += k * c.n;
      else if (c.kind === 'Sword') a.sword += k * c.n;
      else if (c.kind === 'Training') a.train += k * c.n;
      rec(i + 1, left - k * c.cost, a, cards);
      cards.length -= k;
    }
  })(0, mana, { sc: 0, ss: 0, grd: 0, edge: 0, sword: 0, train: 0 }, []);
  return out;
}

const W = { block: 0.6, hand: 0.4, energy: 0.35, edge: 5, sword: 3, train: 3 };
const ORDER = { Whetstone: 0, Sword: 0, Training: 0, Strike: 1, Guard: 2 };

function botTurn(s, rng, K = 8, noInvest = false) {
  const me = s.turn, P = s.p[me], O = s.p[1 - me];
  let mine = turnSets(P.hand, P.mana, P.sword > 0);
  if (noInvest) mine = mine.filter(S => !S.edge && !S.sword && !S.train);
  const unseen = [];
  const left = { ...DECK };
  for (const id of O.played) left[id]--;
  for (const [id, k] of Object.entries(left)) for (let i = 0; i < k; i++) unseen.push(id);
  const oppMana = Math.min(MAX_MANA, O.mana + REGEN + O.regenUp);
  const oppHandNext = O.hand.length + (O.deck.length ? 1 : 0);
  const replies = [];
  for (let k = 0; k < K; k++) {
    const pool = unseen.slice();
    for (let i = pool.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); const x = pool[i]; pool[i] = pool[j]; pool[j] = x; }
    replies.push(turnSets(pool.slice(0, Math.min(pool.length, oppHandNext)), oppMana, O.sword > 0));
  }
  let best = null, bestV = -Infinity;
  for (const S of mine) {
    const myEdge = P.edge + S.edge, mySwordNow = P.sword || S.sword;
    const myDmg = S.ss + S.sc * (myEdge + mySwordNow);
    const through = Math.max(0, myDmg - O.block);
    const oppHp = O.hp - through;
    const oppSword = through > 0 ? 0 : O.sword;
    let v;
    if (oppHp <= 0) v = 1000 - S.n * 0.01;
    else {
      v = 0;
      const myBlock = S.grd, myTrain = P.regenUp + S.train;
      const myEnergy = Math.min(MAX_MANA, P.mana - S.cost + REGEN + myTrain);
      for (const T of replies) {
        let worst = Infinity;
        for (const R of T) {
          const hisEdge = O.edge + R.edge, hisSword = oppSword || R.sword;
          const hisDmg = R.ss + R.sc * (hisEdge + hisSword);
          const hit = Math.max(0, hisDmg - myBlock);
          const myHp = P.hp - hit;
          let val;
          if (myHp <= 0) val = -1000;
          else {
            const keepSword = hit > 0 ? 0 : mySwordNow;
            const hisTrain = O.regenUp + R.train;
            val = (myHp - oppHp) - W.block * R.grd
              + W.hand * ((P.hand.length - S.n) - (oppHandNext - R.n))
              + W.energy * (myEnergy - Math.min(MAX_MANA, oppMana - R.cost + REGEN + hisTrain))
              + W.edge * (myEdge - hisEdge) + W.sword * (keepSword - hisSword) + W.train * (myTrain - hisTrain);
          }
          if (val < worst) worst = val;
        }
        v += worst / K;
      }
    }
    if (v > bestV + 1e-9) { bestV = v; best = S; }
  }
  return best.cards.slice().sort((a, b) => ORDER[CARDS[a].kind] - ORDER[CARDS[b].kind] || CARDS[b].n - CARDS[a].n);
}

function greedyTurn(s) {
  const P = s.p[s.turn];
  let bestSet = null;
  for (const S of turnSets(P.hand, P.mana, P.sword > 0)) if (!bestSet || S.ss > bestSet.ss || (S.ss === bestSet.ss && S.grd > bestSet.grd)) bestSet = S;
  return bestSet.cards.slice().sort((a, b) => ORDER[CARDS[a].kind] - ORDER[CARDS[b].kind]);
}
function randomTurn(s, rng) {
  const P = s.p[s.turn];
  const sets = turnSets(P.hand, P.mana, P.sword > 0);
  return sets[Math.floor(rng() * sets.length)].cards.slice().sort((a, b) => ORDER[CARDS[a].kind] - ORDER[CARDS[b].kind]);
}

// ---- src/ui.js
// Toy 1 as a game screen. Drives the engine through its exported transitions;
// what the player sees comes from engine events, played back one beat at a time.


const ME = 0, BOT = 1;
const ui = {
  s: null, view: null, busy: false, over: false, showDecks: false,
  shown: { hp: [0, 0], mana: [0, 0], block: [0, 0] }, hist: [], fresh: new Set(), popGuard: [0, 0],
  rng: makeRng((Date.now() ^ (Math.random() * 1e9)) >>> 0), token: 0,
};
const $ = (id) => document.getElementById(id);
const wait = (ms) => new Promise(r => setTimeout(r, ms));
setVariant('SW');
const NAME = { Strike: 'Strike', Guard: 'Guard', Sword: 'Sword', Whetstone: 'Whetstone', Training: 'Training' };
const label = (id) => CARDS[id].kind === 'Strike' || CARDS[id].kind === 'Guard' ? NAME[CARDS[id].kind] + ' ' + CARDS[id].n : NAME[CARDS[id].kind];

const ICON = {
  sword: '<svg viewBox="0 0 24 24" fill="#fff"><path d="M14.5 2.5 21.5 2.5 21.5 9.5 10 21l-2-2-2.6 2.6-2.8-2.8L5.2 16.2l-2-2Z" opacity=".95"/></svg>',
  shield: '<svg viewBox="0 0 24 24" fill="#fff"><path d="M12 2 20 5v6c0 5-3.5 9-8 11-4.5-2-8-6-8-11V5Z"/></svg>',
};
const shieldSVG = '<svg viewBox="0 0 46 54"><path d="M23 2 43 9v15c0 13-9 22-20 28C12 46 3 37 3 24V9Z" fill="#5f7891" stroke="#fff" stroke-width="3"/></svg>';

// ------------------------------------------------------------------ cards
function cardHTML(id, { cls = '', attrs = '', owner = null } = {}) {
  const c = CARDS[id];
  if (c.kind === 'Sword') return `<button class="card k-Heavy ${cls}" ${attrs}>
    <span class="cgem">${c.cost}</span>
    <div class="art"><span class="big">+${c.n}</span>${ICON.sword}</div>
    <div class="nm">Sword</div>
    <div class="tx">Your strikes deal ${c.n} more. Dropped when you're hit.</div>
    <div class="sp"> </div></button>`;
  const strike = c.kind === 'Strike';
  const dmg = strike && owner ? strikeDmg(owner, id) : c.n;
  return `<button class="card k-${strike ? 'Light' : 'Defence'} ${cls}" ${attrs}>
    <span class="cgem">${c.cost}</span>
    <div class="art"><span class="big${dmg > c.n ? ' up' : ''}">${dmg}</span>${strike ? ICON.sword : ICON.shield}</div>
    <div class="nm">${NAME[c.kind]}</div>
    <div class="tx">${strike ? `Deal ${dmg} damage.` : `Absorb ${c.n} damage until your next turn.`}</div>
    <div class="sp"> </div></button>`;
}

// ------------------------------------------------------------------ rendering
function heroHTML(side) {
  const s = ui.view, p = s.p[side], mine = side === ME;
  const hp = ui.shown.hp[side], mana = ui.shown.mana[side], block = ui.shown.block[side];
  const active = !ui.over && s.turn === side;
  const shield = block > 0 ? `<div class="shield${ui.popGuard[side] ? ' pop' : ''}" id="shield${side}">${shieldSVG}<span style="font-size:18px">${block}</span></div>` : '';
  let gems = '';
  for (let i = 0; i < MAX_MANA; i++) gems += `<i class="gemc${i < mana ? ' on' : ''}"></i>`;
  const sword = p.sword ? `<div class="swordb" id="sword${side}">${ICON.sword}<span>+${p.sword}</span></div>` : '';
  return `<div class="left"><div class="guards">${sword}${shield}</div></div>
    <div class="mid"><div class="plate${active ? ' active' : ''}" id="plate${side}">
      <div class="hname">${mine ? 'You' : 'Opponent'}</div>
      <div class="hp${hp <= 8 ? ' low' : ''}">${hp}</div>
    </div></div>
    <div class="right">
      <div class="mana" id="mana${side}">${gems}<span class="manatxt">${mana}<small> energy, +${REGEN} a turn</small></span></div>
      <div class="counts">Deck ${p.deck.length}${mine ? '' : ' · Hand ' + p.hand.length}</div>
    </div>`;
}

function handHTML() {
  const s = ui.view, p = s.p[ME];
  const order = p.hand.map((n, i) => i).sort((a, b) => {
    const A = CARDS[p.hand[a]], B = CARDS[p.hand[b]];
    const R = { Sword: 0, Strike: 1, Guard: 2 };
    return (R[A.kind] - R[B.kind]) || A.cost - B.cost;
  });
  const myTurn = !ui.busy && !ui.over && s.turn === ME;
  return order.map(i => {
    const id = p.hand[i];
    const ok = myTurn && canPlay(s, id);
    let cls = ok ? 'ok' : (myTurn ? 'no' : '');
    if (ui.fresh.has(i)) cls += ' drawn';
    return cardHTML(id, { cls, owner: p, attrs: `data-play="${id}"${ok ? '' : ' disabled'}` });
  }).join('');
}

function render() {
  document.body.classList.add('playing');
  const s = ui.view;
  $('opphand').innerHTML = '<i class="back"></i>'.repeat(s.p[BOT].hand.length);
  $('hero1').innerHTML = heroHTML(BOT);
  $('hero0').innerHTML = heroHTML(ME);
  $('hand').innerHTML = handHTML();
  const myTurn = !ui.over && s.turn === ME;
  const canAct = myTurn && !ui.busy && s.p[ME].hand.some(id => canPlay(s, id));
  $('turnbox').innerHTML = `<button id="endturn" class="${myTurn && !canAct ? 'done' : ''}"${myTurn && !ui.busy ? '' : ' disabled'}>${myTurn ? 'End turn' : 'His turn'}</button>`;
  $('history').innerHTML = ui.hist.slice(-16).map(h => h.sep
    ? `<div class="hist sep">${h.sep}</div>`
    : `<div class="hist s${h.side}" data-card="${h.card}"><span class="hn">${label(h.card)}</span><span class="ho ${h.cls || ''}">${h.out || ''}</span></div>`).join('');
  $('trk1').innerHTML = trackerHTML(BOT);
  $('trk0').innerHTML = trackerHTML(ME);
  $('decks').classList.toggle('show', ui.showDecks);
  if (ui.showDecks) $('decks').innerHTML = `<button class="x" id="closedecks">Close</button><div class="wrap">${deckTable(BOT)}${deckTable(ME)}</div>`;
  ui.fresh.clear(); ui.popGuard = [0, 0];
}

// Deck tracker: every card of the list with how many are still to come.
// Yours: still in your deck. His: not yet played (in his hand or his deck).
function trackerHTML(side) {
  const s = ui.view, mine = side === ME, p = s.p[side];
  const rows = deckSummary(s, side).map(r => {
    const c = CARDS[r.id], left = mine ? r.inDeck : r.unseen;
    return `<div class="trow ${c.kind}${left ? '' : ' gone'}"><span class="tg">${c.cost}</span><span class="tn">${label(r.id)}</span><span class="tc">×${left}</span></div>`;
  }).join('');
  const total = mine ? p.deck.length : p.deck.length + p.hand.length;
  return `<h3>${mine ? 'Your deck' : 'His deck'}<small>${total} ${mine ? 'left' : 'unplayed'}</small></h3>${rows}`;
}

function deckTable(side) {
  const s = ui.s, mine = side === ME;
  const rows = deckSummary(s, side).map(r => {
    const c = CARDS[r.id], left = mine ? r.inDeck : r.unseen;
    return `<tr><td>${label(r.id)}</td><td>${c.cost}</td><td>${r.total}</td><td class="${r.played ? '' : 'z'}">${r.played}</td><td class="${left ? '' : 'z'}"><b>${left}</b></td></tr>`;
  }).join('');
  return `<div><h3>${mine ? 'Your deck' : 'His deck'}</h3><p>Both decks are the same list.</p>
    <table><thead><tr><th>Card</th><th>Cost</th><th>In list</th><th>Played</th><th>${mine ? 'In deck' : 'Not seen'}</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

// ------------------------------------------------------------------ playback
function centerOf(el) {
  const a = $('game').getBoundingClientRect(), r = el.getBoundingClientRect();
  return { x: r.left - a.left + r.width / 2, y: r.top - a.top + r.height / 2 };
}
function floater(side, text, cls, where = 'plate', dy = 0) {
  const el = $(where + side) || $('plate' + side); if (!el) return;
  const c = centerOf(el);
  const f = document.createElement('div');
  f.className = 'float ' + cls; f.textContent = text;
  f.style.left = c.x + 'px'; f.style.top = (c.y + dy) + 'px';
  $('game').appendChild(f);
  setTimeout(() => f.remove(), 1200);
}
function shake(side) {
  const el = $('plate' + side); if (!el) return;
  el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake');
}
function banner(text) {
  const b = $('banner'); b.textContent = text; b.classList.remove('show'); void b.offsetWidth; b.classList.add('show');
}
async function spotlight(card, side) {
  const t = centerOf($('table'));
  $('spot').style.left = t.x + 'px'; $('spot').style.top = t.y + 'px';
  $('spot').innerHTML = cardHTML(card, { cls: `from${side}`, owner: ui.view.p[side] });
  await wait(side === ME ? 380 : 800);
  const c = $('spot').querySelector('.card'); if (c) c.classList.add('out');
  await wait(200);
  $('spot').innerHTML = '';
}

function beats(ev) {
  const out = []; let cur = null;
  for (const e of ev) {
    if (e.t === 'play') { cur = { card: e.card, side: e.side, evs: [e] }; out.push(cur); }
    else { if (!cur) { cur = { evs: [] }; out.push(cur); } cur.evs.push(e); }
  }
  return out;
}

async function playBeats(ev, prev, next) {
  const bs = beats(ev);
  for (let k = 0; k < bs.length; k++) {
    const b = bs[k], last = k === bs.length - 1;
    for (const e of b.evs) if (e.t === 'turn') {
      ui.hist.push({ sep: e.side === ME ? 'Your turn' : 'His turn' });
      banner(e.side === ME ? 'Your turn' : 'His turn');
      await wait(e.side === ME ? 700 : 450);
    }
    if (b.card) await spotlight(b.card, b.side);
    let out = '', cls = '', dmgTo = [0, 0];
    for (const e of b.evs) {
      if (e.t === 'hit') { ui.shown.hp[1 - e.side] -= e.dmg; dmgTo[1 - e.side] += e.dmg; }
      else if (e.t === 'stop') ui.shown.block[e.side] = e.block;
      else if (e.t === 'guard') { ui.shown.block[e.side] = e.block; ui.popGuard[e.side] = 1; }
      else if (e.t === 'expire') ui.shown.block[e.side] = 0;
      else if (e.t === 'play' || e.t === 'start') ui.shown.mana[e.side] = e.mana;
    }
    ui.view = last ? next : prev;
    for (const e of b.evs) if (e.t === 'start' && e.drew && e.side === ME) ui.fresh.add(ui.view.p[ME].hand.length - 1);
    render();
    for (const e of b.evs) {
      if (e.t === 'stop') { floater(e.side, 'Absorbed ' + e.n, 'block', 'plate', -24); out = 'absorbed'; cls = 'block'; }
      if (e.t === 'guard') { out = '+' + e.n + ' ⛨'; cls = 'block'; }
      if (e.t === 'sword') { out = '+2'; cls = 'gold'; }
      if (e.t === 'drop') floater(e.side, 'Sword dropped', 'warn', 'plate', 40);
    }
    for (const side of [0, 1]) if (dmgTo[side]) { floater(side, '−' + dmgTo[side], 'dmg'); shake(side); out = (out === 'absorbed' ? 'part, ' : '') + '−' + dmgTo[side]; cls = 'dmg'; }
    if (b.card) {
      ui.hist.push({ side: b.side, card: b.card, out, cls });
      for (const e of b.evs) if (e.t === 'drop') ui.hist.push({ side: e.side, card: 'SW', out: 'dropped', cls: 'warn' });
      render();
    }
    if (b.card) await wait(b.side === ME ? 300 : 550);
  }
}

function syncShown(s) {
  ui.shown.hp = [s.p[0].hp, s.p[1].hp];
  ui.shown.mana = [s.p[0].mana, s.p[1].mana];
  ui.shown.block = [s.p[0].block, s.p[1].block];
}

async function apply(fn) {
  const prev = ui.s, ev = [];
  const next = fn(prev, ev);
  ui.s = next;
  await playBeats(ev, prev, next);
  ui.view = next; syncShown(next);
  if (next.winner !== null) finish();
  render();
}

function finish() {
  ui.over = true;
  const w = ui.s.winner;
  const t = w === 'draw' ? ['Draw', ''] : w === ME ? ['Victory', 'win'] : ['Defeat', 'lose'];
  $('over').innerHTML = `<h2 class="${t[1]}">${t[0]}</h2><div class="row"><button id="rematch">Play again</button></div>`;
  $('over').classList.add('show');
}

// ------------------------------------------------------------------ flow
async function startMatch() {
  const tok = ++ui.token;
  ui.s = newMatch({ seed: (Math.random() * 4294967296) >>> 0 });
  ui.view = ui.s; ui.over = false; ui.hist = []; ui.showDecks = false;
  syncShown(ui.s);
  $('over').classList.remove('show');
  ui.busy = true; render();
  ui.hist.push({ sep: ui.s.first === ME ? 'Your turn' : 'His turn' });
  banner(ui.s.first === ME ? 'You go first' : 'He goes first');
  await wait(900);
  if (tok !== ui.token) return;
  if (ui.s.turn === BOT) await botMove(tok);
  else { ui.busy = false; render(); }
}

async function botMove(tok) {
  ui.busy = true; render();
  await wait(400);
  const cards = botTurn(ui.s, ui.rng);
  for (const id of cards) {
    if (tok !== ui.token || ui.over) return;
    await wait(250);
    await apply((s, ev) => playAction(s, id, ev));
  }
  if (tok !== ui.token || ui.over) return;
  await wait(300);
  await apply((s, ev) => endTurn(s, ev));
  if (tok !== ui.token) return;
  ui.busy = false; render();
}

async function myPlay(id) {
  if (ui.busy || ui.over || ui.s.turn !== ME || !canPlay(ui.s, id)) return;
  ui.busy = true;
  await apply((s, ev) => playAction(s, id, ev));
  ui.busy = false; render();
}

async function myEndTurn() {
  if (ui.busy || ui.over || ui.s.turn !== ME) return;
  const tok = ui.token;
  ui.busy = true; render();
  await apply((s, ev) => endTurn(s, ev));
  if (tok !== ui.token || ui.over) return;
  await botMove(tok);
}

// ------------------------------------------------------------------ input
function peek(e) {
  const h = e.target.closest && e.target.closest('.hist[data-card]');
  const box = $('peek');
  if (!h || !CARDS[h.dataset.card]) { box.innerHTML = ''; return; }
  const g = $('game').getBoundingClientRect(), r = h.getBoundingClientRect();
  box.innerHTML = cardHTML(h.dataset.card);
  box.style.left = (r.right - g.left + 12) + 'px';
  box.style.top = Math.max(8, Math.min(r.top - g.top - 60, g.height - 250)) + 'px';
}
document.addEventListener('mouseover', peek);
document.addEventListener('mouseout', (e) => { if (!e.relatedTarget || !e.relatedTarget.closest || !e.relatedTarget.closest('.hist')) $('peek').innerHTML = ''; });
document.addEventListener('click', (e) => {
  const t = e.target.closest('button');
  if (!t || t.disabled) return;
  if (t.dataset.play) { myPlay(t.dataset.play); return; }
  switch (t.id) {
    case 'rematch': case 'newmatch': startMatch(); return;
    case 'showdecks': ui.showDecks = !ui.showDecks; render(); return;
    case 'closedecks': ui.showDecks = false; render(); return;
    case 'endturn': myEndTurn(); return;
  }
});
startMatch();

})();
</script>
