[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "animal-kingdom"
version = "0.0.1"
description = "Animal Kingdom: the web client and the tools over the Rust rules engine (engine_rs/)"
requires-python = ">=3.11"
# The rules engine is the compiled module ak_engine, built from engine_rs/ into the venv (engine_rs/README.md); nothing
# else is needed to run a game.
dependencies = []

[project.optional-dependencies]
# The web client's server only (animal_kingdom/web).
web = ["aiohttp>=3.9"]
dev = ["pytest>=7.0", "pytest-xdist>=3.5", "aiohttp>=3.9"]

[tool.setuptools]
packages = [
    "animal_kingdom",
    "animal_kingdom.web",
]

[tool.setuptools.package-data]
animal_kingdom = ["data/*.json", "web/static/*", "web/static/art/*"]

[tool.pytest.ini_options]
testpaths = ["animal_kingdom/tests"]

