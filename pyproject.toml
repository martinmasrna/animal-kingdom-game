[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "animal-kingdom"
version = "0.0.1"
description = "Animal Kingdom: the rules engine, the bot and the web client"
requires-python = ">=3.11"
# Core engine is standard-library only — no runtime dependencies (handoff §5).
dependencies = []

[project.optional-dependencies]
# The web client's server only (animal_kingdom/web). engine/ and bots/ stay stdlib-only.
web = ["aiohttp>=3.9"]
dev = ["pytest>=7.0", "pytest-xdist>=3.5", "aiohttp>=3.9"]

[tool.setuptools]
packages = [
    "animal_kingdom",
    "animal_kingdom.engine",
    "animal_kingdom.bots",
    "animal_kingdom.web",
]

[tool.setuptools.package-data]
animal_kingdom = ["data/*.json", "web/static/*", "web/static/art/*"]

[tool.pytest.ini_options]
testpaths = ["animal_kingdom/tests"]

