# The energy prototype (branch energy, ENERGY_PLAN.md) on the test app beside staging; AK_ENERGY switches its rules on. Sleeps when idle. Deploy: deploy/deploy.sh provisions
app = "animal-kingdom-provisions"
primary_region = "fra"

[env]
  AK_ENERGY = "1"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[mounts]]
  source = "ak_provisions_data"
  destination = "/app/results"

[[vm]]
  size = "performance-1x"
  memory = "2048mb"
