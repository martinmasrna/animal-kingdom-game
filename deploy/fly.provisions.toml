# The provisions test (branch provisions): deck budgets and card prices in place of the rarity caps, on its own app beside
# staging. Sleeps when idle. Deploy: deploy/deploy.sh provisions
app = "animal-kingdom-provisions"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[mounts]]
  source = "ak_provisions_data"
  destination = "/app/results"

[[vm]]
  size = "performance-1x"
  memory = "2048mb"
