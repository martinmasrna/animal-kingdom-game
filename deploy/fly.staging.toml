# A test copy of the web client, separate from the live app (its own machine and disk): new-cards and other
# unreleased work, reachable from anywhere. Sleeps when idle, so it costs only the minutes it's used.
# Deploy: deploy/staging.sh
app = "animal-kingdom-staging"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[mounts]]
  source = "ak_staging_data"
  destination = "/app/results"

[[vm]]
  size = "performance-1x"
  memory = "2048mb"
