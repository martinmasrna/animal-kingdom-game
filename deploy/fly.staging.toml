# A test copy of the game, separate from the live app (its own machine, disk and database): where Martin tests work that
# isn't released yet, from any device. Sleeps when idle, so it costs only the minutes it's used. No secrets: no Google or
# Discord sign-in, no feedback email, not in the bot league. Deploy: deploy/deploy.sh staging
app = "animal-kingdom-staging"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[mounts]]
  source = "ak_staging_data"
  destination = "/app/results"

[[vm]]
  size = "performance-1x"
  memory = "2048mb"
