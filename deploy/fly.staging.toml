# The internal playtesting server, separate from the live app (its own machine, disk and database). Sleeps when idle, so it
# costs only the minutes it's played. Its secrets are the Google and Discord sign-in keys (AK_GOOGLE_ID/SECRET,
# AK_DISCORD_ID/SECRET); no feedback e-mail, so feedback is only kept in its database (deploy/deploy.sh staging feedback).
# Deploy: deploy/deploy.sh staging
app = "animal-kingdom-staging"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[mounts]]
  source = "ak_staging_data"
  destination = "/app/results"

[[vm]]
  size = "performance-1x"
  memory = "2048mb"
