# The rules engine built for Windows, on request only (Actions tab, "Run workflow", or `gh workflow run engine-windows.yml`).
#
# Martin's work PC has no Rust toolchain and no C compiler, so nothing there can build engine_rs/; without the built
# module no server, test or bot game runs. This builds the Python module (a wheel for Python 3.14) and the bot benchmark
# from the commit it is run on and keeps both as the run's artifact:
#
#   gh run download <run id> -n ak-engine-windows -D <folder>
#   .venv/Scripts/python.exe -m pip install --force-reinstall --no-deps <folder>/dist/ak_engine-*.whl
#
# (Through python -m pip: on the work PC .venv/Scripts/pip.exe exits without installing and without a word. Check with
# `ls -la .venv/Lib/site-packages/ak_engine/` that the module's time is now.)
#
# Run it again whenever a pull brings a change under engine_rs/.
name: engine for Windows
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install "maturin>=1.5,<2"
      - name: the Python module
        working-directory: engine_rs
        run: maturin build --release -o dist
      - name: the bot benchmark
        working-directory: engine_rs
        run: cargo build --release --no-default-features --bin bot_bench
      - uses: actions/upload-artifact@v4
        with:
          name: ak-engine-windows
          path: |
            engine_rs/dist/*.whl
            engine_rs/target/release/bot_bench.exe
